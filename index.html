choose a career requires careful consideration. On balance, I believe that job satisfaction should take precedence, provided that the salary is sufficient to cover one's basic needs. Ultimately, a rewarding career is a means to a meaningful life, not merely to a larger income."}, {"id": "wr44", "sec": "wr", "part": "Essay", "title": "Essay: preventative healthcare", "type": "write", "kind": "essay", "task": "'Governments should invest more in preventative healthcare than in hospitals.' Develop TWO of these ideas: long-term cost · public awareness campaigns · immediate medical need.", "min": 220, "max": 280, "minutes": 30, "checklist": ["I rephrased the prompt instead of copying it", "Clear thesis + the two points announced", "I developed exactly TWO ideas, not three", "4 C1 structures: inversion, cleft, impersonal passive, inverted conditional", "At least one evidence phrase (A study conducted by…)", "One concession with its refutation", "A different connector per paragraph, no repeated 'also'", "Between 220 and 280 words", "Final check: -s · articles · prepositions · repeated connectors"], "model": "The question of how public health budgets should be allocated has sparked considerable debate in recent years. While some maintain that hospitals must remain the priority, others contend that prevention offers far greater returns. This essay will argue that governments should shift resources towards preventative care, focusing in particular on its long-term cost and on the role of public awareness campaigns.\n\nThe most compelling argument in favour of prevention is financial. It is widely acknowledged that treating chronic conditions such as diabetes or heart disease is enormously expensive, whereas encouraging healthier lifestyles costs a fraction of that sum. A study conducted by the World Health Organization suggests that every euro invested in prevention saves several in future treatment. The upshot is that prevention, far from being a luxury, eases the strain on overstretched hospitals.\n\nFurthermore, public awareness campaigns have proved remarkably effective at changing behaviour. Anti-smoking campaigns, for instance, have contributed to a dramatic decline in tobacco use across Europe. Not only do such initiatives reduce illness, but they also foster a culture in which individuals take responsibility for their own health. Admittedly, some patients will always require urgent treatment; such concerns, while understandable, do not justify neglecting the root causes of disease.\n\nIn light of the above, the evidence points overwhelmingly towards greater investment in prevention. This is not to say that hospitals should be underfunded; rather, governments must strike a balance between immediate needs and long-term health. Only by tackling illness before it develops can we hope to build a sustainable healthcare system."}, {"id": "wrhome", "sec": "wr", "part": "Essay", "title": "Essay: working from home", "type": "write", "kind": "essay", "task": "'Working from home is becoming increasingly common across many industries. Is this a positive or negative development?' Develop TWO of these ideas: productivity · work-life balance · social isolation. (You wrote this essay in class: try it again and compare with your Error clinic.)", "min": 220, "max": 280, "minutes": 30, "checklist": ["I rephrased the prompt instead of copying it", "Clear thesis + the two points announced", "I developed exactly TWO ideas, not three", "4 C1 structures: inversion, cleft, impersonal passive, inverted conditional", "At least one evidence phrase (A study conducted by…)", "One concession with its refutation", "A different connector per paragraph, no repeated 'also'", "Between 220 and 280 words", "Final check: -s · articles · prepositions · repeated connectors"]}, {"id": "wr14", "sec": "wr", "part": "Summary", "title": "Summary: the experimenter effect", "type": "write", "kind": "summary", "task": "Read the two texts and write ONE paragraph (80–100 words) summarising the main ideas.", "passages": [{"title": "Text 1 · Psychology textbook", "text": "When researchers conduct experiments, results can be negatively affected in various ways. One common cause of bias is the researcher themselves — the 'experimenter effect'. There are two main kinds: non-interactional effects (e.g. the Observer Effect, where researchers don't record accurately), and Intentional Effects (where researchers deliberately misreport results)."}, {"title": "Text 2 · Psychology lecture", "text": "A leading psychologist studied 'Interactional Effects'. Two teams were given rats in a maze: one was told they had intelligent rats, the other unintelligent rats. The 'intelligent' rats solved the maze better — but all the rats were equally intelligent! This is the 'expectancy effect', where researchers unconsciously influence their subjects. The researchers with 'intelligent' rats treated them better."}], "min": 80, "max": 100, "minutes": 20, "checklist": ["No chain of 4+ words copied from the texts", "No opinion", "Both texts are present", "Varied reporting verbs (points out, acknowledges, stresses…)", "One paragraph, 80–100 words"], "model": "Both texts examine how researchers themselves can distort the outcome of experiments. The first explains that this bias may occur without any contact with participants, either through careless recording or through the deliberate falsification of data. The second, by contrast, focuses on bias that arises from interaction, describing a study in which scientists who believed their rats were cleverer obtained better results, simply because they handled the animals more favourably. Taken together, the texts suggest that a researcher's behaviour and expectations, whether conscious or not, can seriously undermine scientific findings."}, {"id": "wr43", "sec": "wr", "part": "Summary", "title": "Summary: television", "type": "write", "kind": "summary", "task": "Write ONE paragraph (80–100 words). Absolute paraphrase, combine both texts, no opinion.", "passages": [{"title": "Text A · book extract", "text": "Television has become part of our daily lives, since the majority of people watch it every day. Its potential to shape public opinion gives it immense power: it does not merely mirror society but exerts a considerable influence on it. Critics argue that some programmes insult viewers' intelligence, though it could equally be said that television simply imitates the society that produces it."}, {"title": "Text B · lecture transcript", "text": "What interests me about television is its economics. Advertising revenue is enormous, which means the medium does not only satisfy a need for entertainment — it manufactures a need for new products. Viewers are led to desire goods well beyond their means in order to keep up with prevailing trends. Parents, meanwhile, bear the responsibility of monitoring what their children watch."}], "min": 80, "max": 100, "minutes": 20, "checklist": ["No chain of 4+ words copied from the texts", "No opinion", "Both texts are present", "Varied reporting verbs (points out, acknowledges, stresses…)", "One paragraph, 80–100 words"], "model": "Both texts examine the influence television exerts on society. The first points out that, given how widely it is watched, the medium does not simply reflect public attitudes but actively shapes them, and it acknowledges the criticism that certain programmes underestimate their audience. The second, by contrast, approaches the subject commercially, emphasising that vast advertising revenues turn television into a machine for manufacturing consumer desire, often for goods viewers cannot afford. It also stresses the role of parents in supervising younger viewers. Taken together, the texts present television as a powerful force over both opinion and spending."}, {"id": "wrsmall", "sec": "wr", "part": "Summary", "title": "Summary: small businesses and globalisation", "type": "write", "kind": "summary", "task": "You wrote a summary on this topic in class. Try again with these two texts (80–100 words).", "passages": [{"title": "Text 1 · business magazine", "text": "For the corner shop and the family workshop, globalisation has rarely felt like an opportunity. Multinationals can manufacture in countries where labour is cheap, buy materials in vast quantities and deliver to large cities within hours. Faced with prices they cannot match, many small firms have simply closed their doors, and town centres have paid the price."}, {"title": "Text 2 · radio interview with an economist", "text": "I'm far less pessimistic than most. The same technology that allowed big companies to expand has lowered the barriers for small ones: a workshop in a village can now sell to customers on the other side of the world through a website. What small firms cannot do is compete on price. Where they win is on flexibility, specialist knowledge and personal service — things that a global corporation finds very hard to copy."}], "min": 80, "max": 100, "minutes": 20, "checklist": ["No chain of 4+ words copied from the texts", "No opinion", "Both texts are present", "Varied reporting verbs (points out, acknowledges, stresses…)", "One paragraph, 80–100 words"], "model": "Both texts consider the impact of globalisation on small businesses. The first stresses the difficulties they face, explaining that large corporations benefit from cheap overseas production, bulk purchasing and rapid distribution, which has forced many independent firms out of business. The second takes a more optimistic view, arguing that digital technology now enables even tiny companies to reach international customers. While acknowledging that they cannot undercut multinationals, it maintains that their adaptability, expertise and personal attention give them a genuine advantage. Taken together, the texts suggest that small firms can survive only by competing on value rather than price."}, {"id": "wrtour", "sec": "wr", "part": "Summary", "title": "Summary: overtourism", "type": "write", "kind": "summary", "task": "80–100 words. Combine both texts; no opinion.", "passages": [{"title": "Text 1 · travel article", "text": "Maya Bay in Thailand was once a secluded paradise of turquoise water and coral. After it appeared in a Hollywood film, up to five thousand visitors a day arrived by boat. Within two decades, most of the coral had died and the authorities were forced to close the beach entirely to allow the ecosystem to recover."}, {"title": "Text 2 · podcast with a tourism researcher", "text": "Overtourism isn't caused by one film. Budget airlines have made distant destinations affordable for millions, and social media turns a single beautiful photo into a global queue. Influencers rarely mention the damage. If travellers want these places to survive, they need to think about when and how they visit — and whether that photo is really worth posting."}], "min": 80, "max": 100, "minutes": 20, "checklist": ["No chain of 4+ words copied from the texts", "No opinion", "Both texts are present", "Varied reporting verbs (points out, acknowledges, stresses…)", "One paragraph, 80–100 words"], "model": "Both texts address the damage caused by mass tourism to fragile natural sites. The first illustrates the problem through the case of Maya Bay, where the huge number of visitors attracted by a famous film destroyed much of the coral and eventually led to the beach being closed. The second broadens the focus, attributing the phenomenon to cheap flights and to social media, which can make a single location suddenly popular worldwide. It also calls on tourists to plan their trips more responsibly. Taken together, the texts present overtourism as a serious threat that requires changes in traveller behaviour."}], "mock": {"title": "Mock Test 1", "listening": [{"id": "ml1", "type": "listenset", "part": "Part 1", "title": "Part 1 · Short extracts", "instr": "You will hear three short extracts. Each can be played twice. Choose the best answer.", "clips": [{"q": "A man is talking about volunteering at a food bank. Why did he start volunteering?", "o": ["He needed experience for a job application.", "He wanted to understand a problem more directly.", "A friend persuaded him to join a team."], "a": 1, "why": "'I wanted to see for myself what was behind the numbers'. The CV benefit came later 'as a bonus'; the friend only told him about it.", "script": [{"s": "M", "t": "People assume I did it for my CV, and to be fair it has come in handy in interviews since — but that was a bonus I hadn't even thought about. A friend of mine had mentioned the food bank in passing, and I kept reading these reports about how many families in our town were struggling to feed their children. I'd look at the figures and they just didn't feel real. I suppose I wanted to see for myself what was behind the numbers, so one Saturday I turned up and asked if they needed another pair of hands."}]}, {"q": "A woman is talking about learning to cook from online videos. What is her opinion of the videos?", "o": ["They make cooking look easier than it really is.", "They are less reliable than traditional recipe books.", "They are useful only once you have some basic skills."], "a": 0, "why": "'everything looks effortless… the reality in my kitchen was rather different' — the final twist marks the answer. Recipe books are mentioned as what she 'expected' to miss but didn't.", "script": [{"s": "F", "t": "I'd always assumed I'd miss my mum's old recipe books, but honestly the videos are brilliant for seeing exactly what a sauce should look like at each stage. And you can learn complete beginner stuff — how to chop an onion, for instance. My only gripe is that they're so heavily edited. The chef's chopping board is spotless, nothing ever sticks to the pan, and everything is ready in eight minutes. The reality in my kitchen was rather different, I can tell you."}]}, {"q": "A museum director is speaking to new volunteers. Why is she speaking to them?", "o": ["to explain how the museum's collection was acquired", "to persuade them to talk to visitors more", "to warn them about the rules on photography"], "a": 1, "why": "Purpose in the last sentence: 'what I'd really ask of you is to strike up conversations'. The collection's history and the photography rule are context.", "script": [{"s": "F", "t": "Welcome, everyone. You'll get a full tour later, so I won't go into how the collection was put together — that's a story in itself. And yes, before anyone asks, visitors are allowed to take photos as long as they don't use a flash. What our surveys tell us, though, is that the thing people remember most isn't a particular painting; it's a conversation. So what I'd really ask of you is not to stand silently in the corner of each room, but to strike up conversations with visitors whenever the moment feels right."}]}]}, {"id": "ml2", "type": "listen", "mode": "gap", "part": "Part 2", "title": "Part 2 · Note completion", "instr": "You will hear a talk about a rooftop farm. Complete the notes with 1–3 words you hear.", "script": [{"s": "M", "t": "Thanks for coming up to the roof — mind the step. This farm sits on top of what used to be a car park, and when we started in 2021 most people thought we were mad. The original idea came from a group of retired engineers who'd worked out that the roof could carry far more weight than anyone assumed."}, {"s": "M", "t": "We grow mainly salad leaves and herbs, which suit the shallow soil. We did try tomatoes in the first year, but the wind up here was simply too strong for them. The real surprise has been the bees: we put in two hives as an experiment and they've done better than the ones at ground level, probably because there are fewer pesticides around."}, {"s": "M", "t": "Everything we harvest is sold to restaurants within walking distance — we don't use vans at all; deliveries go out by cargo bike. Our biggest customer isn't a restaurant, actually, it's the hospital across the road, which buys about forty per cent of what we produce for its staff canteen."}, {"s": "M", "t": "People often ask what the hardest part has been. It isn't the weather and it isn't money. It's water. Pumping it up four floors uses a surprising amount of electricity, so we're now installing tanks to collect rainwater, which should be ready by next spring."}], "items": [{"q": "The farm was originally a ___.", "a": ["car park"]}, {"q": "The idea came from a group of retired ___.", "a": ["engineers"]}, {"q": "Tomatoes failed because of the strong ___.", "a": ["wind"]}, {"q": "Deliveries are made by ___.", "a": ["cargo bike", "cargo bikes"]}, {"q": "The farm's biggest customer is a ___.", "a": ["hospital"]}, {"q": "To solve the main problem, the farm is installing tanks for ___.", "a": ["rainwater"]}]}, {"id": "ml3", "type": "listen", "mode": "match", "opts": ["M", "W", "B"], "part": "Part 3", "title": "Part 3 · Matching opinions", "instr": "Two friends discuss electric scooters in cities. Decide whether each opinion is expressed by the man (M), the woman (W) or both (B).", "script": [{"s": "F", "t": "Have you seen they're bringing hire scooters to our city next month?"}, {"s": "M", "t": "I have. I can see the appeal — for short trips they're quicker than the bus and they don't pollute, at least not directly."}, {"s": "F", "t": "'Not directly' is doing a lot of work there. The batteries don't last long and the scooters themselves get replaced every year or so. Once you factor that in, the environmental argument looks much weaker."}, {"s": "M", "t": "That's a fair point. Though I'd still rather people were on scooters than in cars."}, {"s": "F", "t": "But that's the thing — the research I've read suggests most people who use them would otherwise have walked or taken public transport, not driven."}, {"s": "M", "t": "Really? I hadn't heard that. What bothers me more is the pavements. In Paris they ended up everywhere, blocking the way for people in wheelchairs."}, {"s": "F", "t": "Absolutely, that's my main worry too. Pavements are for pedestrians, full stop. If they're going to allow them, there have to be proper parking bays."}, {"s": "M", "t": "And the speed limit needs to be enforced. I'd be in favour of fining people who ride them on the pavement."}, {"s": "F", "t": "Fines only work if someone's there to issue them, and the police have better things to do. I'd rather the companies were made responsible — they can track every scooter, after all."}, {"s": "M", "t": "I suppose that would be cheaper for the council."}], "items": [{"q": "Scooters offer a fast alternative for short journeys.", "a": "M", "why": ""}, {"q": "The environmental benefits are smaller than they appear.", "a": "W", "why": "He accepts it ('That's a fair point') but she formulates it."}, {"q": "Scooters mainly replace walking and public transport rather than cars.", "a": "W", "why": ""}, {"q": "Scooters left on pavements are a serious problem.", "a": "B", "why": "Both contribute: he mentions Paris and wheelchairs; she says it's her main worry too."}, {"q": "Riders who break the rules should be fined.", "a": "M", "why": ""}, {"q": "The hire companies should be held responsible for problems.", "a": "W", "why": ""}]}, {"id": "ml4", "type": "listenset", "part": "Part 4", "title": "Part 4 · Attitude and purpose", "instr": "Three extracts. Choose the best answer.", "clips": [{"q": "A lecturer is talking about handwriting and typing. What point is she making?", "o": ["Students who type their notes remember less.", "The method matters less than how students process information.", "Handwriting should be compulsory in lectures."], "a": 1, "why": "'the advantage disappears when typists are told to summarise rather than transcribe' — processing is the key. A is the popular headline she qualifies.", "script": [{"s": "F", "t": "You'll often read that students who take notes on a laptop remember less than those who write by hand, and the original study did find that. What tends to get left out of the headlines is why. Typists produced more words but simply transcribed what they heard; people writing by hand couldn't keep up, so they were forced to choose and rephrase. And when later studies told typists to summarise rather than transcribe, the advantage largely disappeared. So please don't leave your laptops at home on my account."}]}, {"q": "A man is talking about trying a minimalist lifestyle. How does he feel about it now?", "o": ["regretful about giving away things he valued", "relieved, although he finds some aspects excessive", "frustrated that it hasn't saved him money"], "a": 1, "why": "'I wouldn't go back' + 'the purist version… strikes me as a bit much'. The money point is mentioned and dismissed.", "script": [{"s": "M", "t": "Clearing out the flat was oddly liberating — I'd been holding on to things out of pure guilt. People ask if it saved me money; not really, and that was never the point. I'll admit I gave away a couple of books I then had to buy again, but that's hardly a tragedy. I wouldn't go back to how I was living. That said, the purist version, where you count every object you own and post the number online, strikes me as a bit much."}]}, {"q": "A woman is reviewing a new podcast about history. What is her main criticism?", "o": ["The presenters rely too heavily on humour.", "The episodes are far longer than they need to be.", "The research behind it is sometimes inaccurate."], "a": 1, "why": "'there's a forty-minute episode in there somewhere, buried inside a two-hour one'. The jokes are praised; the research is described as 'meticulous'.", "script": [{"s": "F", "t": "The two presenters clearly adore their subject, and the research is meticulous — every claim comes with a source in the show notes. Some listeners will find the jokes a little forced, but I thought they mostly landed. My problem is stamina. There's a superb forty-minute episode in there somewhere, buried inside a two-hour one, and I found myself skipping ahead far more often than I'd like to admit."}]}]}], "reading": [{"id": "mr1", "type": "mcq", "part": "Part 1", "title": "Part 1 · Short texts", "instr": "Read each text and choose the best answer.", "items": [{"q": "What is the main purpose of the email?", "o": ["to apologise for a delay in repairs", "to request access to the flat", "to announce an increase in rent"], "a": 1, "why": "The key request: 'could you let me know a time… when the engineer can get in'. The rent is mentioned only to say it won't change.", "text": "Dear Ms Santos, I hope you're settling in well. The boiler service is due before the end of the month and, as you know, the law requires me to have it carried out by a registered engineer. Could you let me know a day and time next week when the engineer can get in? It should take no more than an hour. Just to reassure you, this has nothing to do with the rent review I mentioned in the spring — that won't be happening this year after all. Best wishes, Daniel", "title": "An email from a landlord"}, {"q": "What does the notice suggest about the exhibition?", "o": ["It has been extended because of its popularity.", "Visitors are advised to plan their visit in advance.", "It is less crowded at weekends than on weekdays."], "a": 1, "why": "'we strongly recommend booking a time slot online'. It closes on the date announced; weekends are the busiest.", "text": "Due to exceptional demand, timed entry now applies to 'Oceans in Glass'. Walk-up tickets remain available, but on recent weekends queues have exceeded ninety minutes, and we strongly recommend booking a time slot online before you travel. Please note that the exhibition will close as planned on 3 March; we regret that it will not be possible to extend it, as the works are due to return to their lenders.", "title": "A museum notice"}, {"q": "What is the reviewer's view of the novel?", "o": ["Its unusual structure is its greatest strength.", "It begins slowly but becomes rewarding.", "Its characters are less convincing than its setting."], "a": 1, "why": "'The first hundred pages test the reader's patience… persevere, and the payoff is considerable'. The structure is called 'conventional'.", "text": "Nothing about Ana Ruiz's debut is formally daring: the story is told in a conventional, chronological fashion, by a single narrator. The first hundred pages test the reader's patience, lingering over the details of a coastal town where very little appears to happen. Persevere, however, and the payoff is considerable: the quiet accumulation of detail turns out to be the very thing that makes the final chapters so devastating.", "title": "A book review"}]}, {"id": "mr2", "type": "match", "part": "Part 2", "title": "Part 2 · Multiple matching", "instr": "Three scientists give their views on space tourism. Read all three texts first, then match each question to A, B or C.", "opts": ["A", "B", "C"], "passages": [{"title": "A · Dr Helena Marsh, atmospheric chemist", "text": "The fuss about space tourism tends to focus on ticket prices, which strikes me as a distraction. What concerns me is what rockets leave behind. Soot released in the upper atmosphere stays there far longer than emissions at ground level, and its warming effect is disproportionate. With a handful of flights a year this is negligible; with the hundreds a week that companies are promising, it would not be. I am not calling for a ban. I am calling for the measurements to be made before the industry grows, not after."}, {"title": "B · Professor Ravi Anand, aerospace engineer", "text": "Every transport revolution started as a toy for the rich: the car, the aeroplane, the mobile phone. Space tourism is no different, and the engineering lessons it is generating — reusable boosters, cheaper heat shields — are already lowering the cost of launching satellites for weather forecasting and communications. I understand why people find the sight of billionaires in orbit distasteful. I find some of the marketing distasteful myself. But it would be short-sighted to judge an industry by its first customers."}, {"title": "C · Dr Sofia Lindqvist, space policy researcher", "text": "The law has not caught up. The treaties that govern space were written in the 1960s, when only governments could get there, and they say almost nothing about private passengers. Who is liable if a tourist is injured? Who decides how many flights a single company may operate? At present, the answer is largely whichever country the company happens to be registered in, which invites a race to the bottom. I would like to see an international agreement before the first serious accident forces one upon us."}], "items": [{"q": "Who believes the most important issue is being overlooked in public discussion?", "a": "A", "why": "'The fuss… tends to focus on ticket prices, which strikes me as a distraction'."}, {"q": "Who compares space tourism with earlier technological developments?", "a": "B", "why": ""}, {"q": "Who warns that a problem will become significant only if the industry expands?", "a": "A", "why": "'With a handful of flights… negligible; with hundreds a week… it would not be'."}, {"q": "Who admits to sharing some of the critics' feelings?", "a": "B", "why": "'I find some of the marketing distasteful myself'."}, {"q": "Who fears that companies may choose the least demanding regulations?", "a": "C", "why": "'a race to the bottom'."}, {"q": "Who argues that space tourism is already producing benefits beyond tourism?", "a": "B", "why": "Cheaper satellite launches."}]}, {"id": "mr3", "type": "match", "part": "Part 3", "title": "Part 3 · Gapped text", "instr": "Six sentences have been removed. Choose from A–H the sentence that fits each gap. There are two extra sentences.", "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "optsfull": ["A · During those hours, the brain appears to replay the day's experiences, strengthening some connections and allowing others to fade.", "B · Students who stayed up all night before an exam, by contrast, performed as well as those who slept.", "C · It was a reasonable assumption, given that the body is largely still and the mind, apparently, switched off.", "D · In other words, the brain was not simply storing what had been learned; it was reorganising it.", "E · This may explain why so many people report solving a problem after 'sleeping on it'.", "F · Few teenagers, however, are willing to give up their phones at night.", "G · The irony is that the people most likely to sacrifice sleep are those under the greatest pressure to perform.", "H · The body is remarkably good at recovering from an occasional short night, provided it is allowed to catch up."], "passages": [{"title": "Why we sleep on it", "text": "For much of the twentieth century, sleep was regarded as a kind of pause button: a period of inactivity during which the body recovered and nothing much else happened. [1] We now know that it was almost entirely wrong.\n\nIn a series of experiments that began in the 1990s, researchers taught volunteers a new skill — a sequence of finger movements, say, or a list of word pairs — and then tested them again twelve hours later. Those who had slept in between consistently outperformed those who had spent the same twelve hours awake. [2] Brain scans taken overnight showed the regions involved in learning firing in patterns that closely matched those recorded during the original training.\n\nThe effect goes beyond simple memory. In one well-known study, participants were given a mathematical task that contained a hidden shortcut. After a night's sleep, they were more than twice as likely to discover it as those who had stayed awake. [3] [4] The old advice turns out to have a solid biological basis.\n\nThe practical implications are considerable. [5] Night-time revision before an exam, the habit of answering emails at midnight, the culture of long hours in medicine and finance: all of them trade the very process that consolidates learning for a few extra hours of apparent productivity. Repeated studies have found that people deprived of sleep consistently overestimate how well they are performing.\n\nNone of this means that every lost hour is a disaster. [6] But the evidence is now strong enough that 'I'll sleep when the work is done' looks less like dedication and more like a miscalculation."}], "items": [{"q": "Gap 1", "a": "C", "why": "'It was a reasonable assumption' → 'We now know that it was almost entirely wrong'."}, {"q": "Gap 2", "a": "A", "why": "Explains why sleepers outperformed; prepares 'Brain scans… overnight'."}, {"q": "Gap 3", "a": "D", "why": "Discovering a shortcut = reorganising, not just storing."}, {"q": "Gap 4", "a": "E", "why": "'sleeping on it' → 'The old advice turns out to have a solid biological basis'."}, {"q": "Gap 5", "a": "G", "why": "'those under the greatest pressure' → exams, medicine, finance."}, {"q": "Gap 6", "a": "H", "why": "'None of this means that every lost hour is a disaster' + 'the body recovers from an occasional short night' + 'But the evidence…'."}], "note": "Extras: B contradicts the experiments described; F is off-topic (phones are never mentioned)."}, {"id": "mr4", "type": "mcq", "part": "Part 4", "title": "Part 4 · Long text", "instr": "Read the article and choose the best answer (A, B or C).", "passage": {"title": "In defence of boredom", "text": "Of all the emotions we try to avoid, boredom may be the one we are most successful at eliminating. A queue, a bus journey, the two minutes before a meeting starts: each of these was once an unavoidable stretch of empty time, and each is now routinely filled by a glance at a screen. It is tempting to see this as an unambiguous gain. Nobody, after all, misses standing in a post office with nothing to do.\n\nPsychologists have begun to suggest that the loss is more significant than it appears. Boredom, in their account, is not simply an unpleasant absence of stimulation but a signal — an uncomfortable nudge telling us that what we are doing is not meeting our needs, and prompting us to look for something better. Remove the discomfort and you remove the nudge. The phone does not solve the problem that boredom points to; it merely silences the alarm.\n\nThere is also some evidence, though it is less robust than its enthusiasts claim, that boredom aids creativity. In a frequently cited experiment, participants who had first completed a tedious task — copying numbers from a telephone directory — came up with more inventive uses for a pair of plastic cups than those who had not. The finding has been widely reported as proof that boredom makes us creative. It is more accurately described as a hint: the samples were small, and attempts to repeat the result have produced mixed outcomes.\n\nWhat seems clearer is the role of unstructured time in reflection. When the mind is not occupied by an external task, it tends to wander towards unfinished business: plans, worries, half-formed ideas. This mind-wandering is not always pleasant, and it is not always productive. But it appears to be the process by which we make sense of experience and connect it to the future. A generation that never lets its mind drift may find that process harder to access when it is needed.\n\nNone of this is an argument for throwing away our phones, still less for romanticising the tedium of the past. Boredom can be corrosive, particularly when it is chronic and imposed, as many workers in repetitive jobs could testify. The case is a more modest one: that occasional, chosen boredom — a walk without headphones, a journey spent looking out of the window — may be worth more than the distraction we reach for by reflex."}, "items": [{"q": "In the first paragraph, the writer suggests that most people regard the disappearance of boredom as…", "o": ["a change that has gone largely unnoticed.", "an improvement with no obvious drawbacks.", "a worrying sign of growing impatience."], "a": 1, "why": "'It is tempting to see this as an unambiguous gain'.", "text": "", "title": ""}, {"q": "According to the second paragraph, the problem with avoiding boredom is that…", "o": ["it prevents us from responding to an important warning.", "it makes us less able to tolerate discomfort.", "it encourages us to depend on technology."], "a": 0, "why": "'Remove the discomfort and you remove the nudge… it merely silences the alarm'.", "text": "", "title": ""}, {"q": "What is the writer's attitude to the experiment with plastic cups?", "o": ["The results have been exaggerated by some commentators.", "The method used was fundamentally flawed.", "It provides convincing evidence for the writer's argument."], "a": 0, "why": "'widely reported as proof… more accurately described as a hint'. The writer questions the sample size, not the method as a whole.", "text": "", "title": ""}, {"q": "What does the writer say about mind-wandering?", "o": ["It is usually more enjoyable than people expect.", "It helps people to process experience and plan ahead.", "It occurs more often in younger generations."], "a": 1, "why": "'the process by which we make sense of experience and connect it to the future'.", "text": "", "title": ""}, {"q": "In the final paragraph, the writer…", "o": ["admits that the case for boredom has been overstated.", "argues that boredom should be deliberately sought at times.", "criticises employers who impose repetitive work."], "a": 1, "why": "'occasional, chosen boredom… may be worth more than the distraction'. Workers in repetitive jobs are an example, not a criticism of employers.", "text": "", "title": ""}]}], "writing": [{"id": "mw1", "type": "write", "kind": "essay", "part": "Part 1", "title": "Essay", "minutes": 30, "min": 220, "max": 280, "task": "You have been discussing technology and young people in class. Your tutor has asked you to write an essay: 'Children today spend too much time on screens. What should be done about it?' Write about TWO of the following: the role of parents · the role of schools · the responsibility of technology companies.", "checklist": ["Rephrased the prompt", "Exactly two ideas", "Clear thesis", "4 C1 structures", "Concession + refutation", "220–280 words"], "model": "In an era characterised by constant connectivity, the amount of time children spend on screens has become a matter of growing concern for parents and educators alike. While some maintain that this is simply a feature of modern childhood, others contend that it is damaging young people's health and concentration. This essay will argue that the responsibility lies primarily with technology companies and schools.\n\nThe most compelling argument for holding technology companies accountable is that their products are deliberately designed to be addictive. Features such as endless scrolling and autoplay are engineered to maximise engagement, and it is naive to expect a ten-year-old to resist techniques that most adults find difficult to ignore. Were companies required to switch these features off by default for younger users, screen time would almost certainly fall without anyone having to ban anything.\n\nSchools, furthermore, are ideally placed to teach digital literacy. Granted, there is some truth in the claim that the curriculum is already overcrowded; however, this objection overlooks the fact that helping pupils understand how apps capture their attention is arguably as important as many traditional subjects. Not only would such lessons encourage healthier habits, but they would also equip children to question what they see online.\n\nIn light of the above, it is clear that the problem cannot be left to parents alone. What is needed, ultimately, is a combined approach in which regulation limits the most manipulative design features and education gives children the tools to make informed choices. Only by acting on both fronts can we hope to reverse the trend."}, {"id": "mw2", "type": "write", "kind": "summary", "part": "Part 2", "title": "Summary", "minutes": 20, "min": 80, "max": 100, "task": "Read the two texts and write ONE paragraph (80–100 words) summarising the main ideas. Use your own words and do not give your opinion.", "passages": [{"title": "Text 1 · extract from a book on urban planning", "text": "Cities have traditionally been designed around the car. Wide roads, large car parks and long distances between homes, shops and offices made driving the only realistic option for many residents. The '15-minute city' reverses this logic: everything a person needs on a daily basis — school, work, shops, healthcare, parks — should be reachable within a quarter of an hour on foot or by bike. Supporters argue that this reduces pollution, revives local high streets and gives people back time they would otherwise spend commuting."}, {"title": "Text 2 · transcript of a radio debate", "text": "The idea sounds wonderful on paper, and in dense European centres it often works. But it assumes that jobs and services can be spread evenly across a city, which is rarely the case. Specialist hospitals, universities and large employers tend to be concentrated in a few places. There's also a risk that the most desirable 15-minute neighbourhoods become so expensive that only wealthier residents can afford to live in them, pushing everyone else further out."}], "checklist": ["Both texts", "No copied chains", "No opinion", "80–100 words"], "model": "Both texts examine the concept of the '15-minute city'. The first explains that, unlike traditional car-centred planning, this model aims to place all essential daily services within a short walk or cycle of people's homes, which its advocates believe would cut pollution, support local businesses and reduce time spent travelling. The second takes a more sceptical view, pointing out that many key services and jobs are concentrated in particular areas and therefore cannot easily be distributed. It also warns that such neighbourhoods may become unaffordable for lower-income residents. Taken together, the texts present the idea as attractive but difficult to apply fairly."}], "speaking": [{"id": "ms1", "type": "speak", "part": "Part 1", "title": "Interview", "questions": ["What's your name and where are you from? (not marked)", "What do you do — do you work or study? (not marked)", "How do you usually spend your weekends?", "Tell me about a skill you would like to learn in the future.", "How has the place where you live changed in recent years?", "If you could change one thing about your daily routine, what would it be?"], "prep": 5, "talk": 30, "phrases": "It depends on… · If I could…, I would… · Looking back… · I'm keen on…", "checklist": ["Expanded every answer", "Used a conditional", "Upgraded basic adjectives"]}, {"id": "ms2", "type": "speak", "part": "Part 2", "title": "Voice message", "instr": "You agreed to look after a friend's dog this weekend, but now you have to go away for a family event. Leave a voice message: apologise and explain the situation · say how you feel · suggest another solution.", "questions": ["Leave your message now."], "prep": 10, "talk": 40, "phrases": "I'm really sorry, but I'm afraid… · I feel terrible about… · Have you thought about…? · I'd be happy to…", "checklist": ["All three points", "Diplomatic tone", "Concrete alternative"]}, {"id": "ms3", "type": "speakaudio", "part": "Part 3", "title": "Oral summary", "instr": "Listen to two experts talking about reading habits (once). Then summarise the points they agree on.", "prep": 40, "talk": 50, "script": [{"s": "N", "t": "Expert one."}, {"s": "F", "t": "There's a lot of worry that young people don't read any more, but the figures don't really support that. What has changed is the format: far more reading happens on phones, in short pieces. That has a cost. Studies suggest that when people read long texts on screens, they tend to skim and understand less than they would on paper. So the issue isn't whether we read, but how deeply."}, {"s": "N", "t": "Expert two."}, {"s": "M", "t": "I'd agree that people are reading as much as ever — messages, articles, social media posts. The concern for me is concentration. Sustained reading of a novel or a long report is a skill, and like any skill it weakens if you don't use it. The good news is that it comes back quite quickly. Even twenty minutes a day of uninterrupted reading on paper makes a measurable difference within a few weeks."}], "phrases": "Both experts discussed… · They agreed that… · However, they also emphasised… · Overall…", "checklist": ["Two main points: people still read / deep reading is the concern", "A supporting detail for each", "Paraphrased", "~50 seconds"], "model": "Both experts discussed changes in the way people read. They agreed, first of all, that the amount of reading hasn't actually fallen; what has changed is that much of it now consists of short texts on mobile devices. However, they also emphasised that this affects our ability to read in depth: people tend to skim and lose concentration with longer texts on screens. Overall, their message was that deep reading is a skill we need to practise, for instance by reading on paper for a short time every day."}, {"id": "ms4", "type": "speak", "part": "Part 4", "title": "Debate", "instr": "Statement: 'University education should be free for everyone.' Use 2 or 3 of these ideas: equality of opportunity · cost to taxpayers · quality of education · graduate debt.", "questions": ["Present your case now."], "prep": 45, "talk": 120, "phrases": "I'm going to present a case… · Some might argue that…, but… · Not to mention… · All things considered…", "checklist": ["Position in 5 seconds", "Concession + refutation", "Two C1 structures", "Strong close", "Full 2 minutes"]}, {"id": "ms5", "type": "speak", "part": "Part 5", "title": "Follow-up questions", "questions": ["Do you think universities will still exist in the same form in 30 years?", "Is a university degree more or less valuable than it was for your parents' generation?", "Should students choose subjects based on job prospects or personal interest?", "How might artificial intelligence change the way people learn?"], "prep": 5, "talk": 40, "phrases": "This could potentially lead to… · It's hard to say, but… · I see why people might think that, but… · I've got mixed feelings about…", "checklist": ["Speculated about the future", "Used a 2nd/3rd conditional", "Disagreed diplomatically once"]}]}};</script>
<script>
(function () {
"use strict";
const D = window.DATA;

/* ================================================================ storage */
const KEY = "c1-companion-v1";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
function initS() {
  ["bm", "bmx", "learned", "notes", "wb", "fc", "drafts", "checks"].forEach(k => { if (!S[k] || typeof S[k] !== "object" || Array.isArray(S[k])) S[k] = {}; });
  if (!Array.isArray(S.mocks)) S.mocks = [];
  if (!Array.isArray(S.my)) S.my = [];
  if (!S.fc._u || typeof S.fc._u !== "object") S.fc._u = {};
}
initS();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  if (k === "cb") go("cb-" + v); else if (k === "wb") { const map = { speaking: "sp", listening: "li", reading: "re", writing: "wr", vocab: "vg" }; go("wbs-" + (map[v] || v)); }
  else if (k === "fc") go("fc-" + v); else if (k === "mock") openMock();
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g) { e.preventDefault(); handleGoto(g.dataset.goto); }
});

function hydrate(root) {

    $$("input", n).forEach((c, i) => { c.checked = !!st[i]; c.onchange = () => { S.checks[k] = $$("input", n).map(x => x.checked); save(); }; });

}

/* ================================================================ timers */
let TIMERS = [];
function clearAllTimers() { TIMERS.forEach(t => clearInterval(t)); TIMERS = []; }
function countdown(sec, tick, done) {
  const end = Date.now() + sec * 1000; tick(sec);
  const t = setInterval(() => { const left = (end - Date.now()) / 1000; if (left <= 0) { clearInterval(t); tick(0); done && done(); } else tick(left); }, 250);
  TIMERS.push(t); return () => clearInterval(t);
}

/* ================================================================ EXERCISES */
function scoreSave(ex, score, total) { S.wb[ex.id] = { score, total, t: Date.now() }; save(); refreshWBSide(); }
function player(script, cap) {
  // cap: max plays (0 = unlimited)
  let plays = 0, playing = false;
  const node = el(`<div class="player"><button class="pbtn" aria-label="Play">▶</button><div class="eq"><i></i><i></i><i></i><i></i></div><div class="pinfo"></div></div>`);
  const btn = node.querySelector(".pbtn"), info = node.querySelector(".pinfo");
  const upd = () => { info.textContent = !TTS.ok ? "Read-aloud isn't available in this browser: open the transcript instead." : playing ? "Playing… (press ■ to stop)" : cap ? `Plays left: ${cap - plays}` : plays ? `Played ${plays}×. In the exam you hear it twice.` : "Press play (your browser reads it aloud)"; btn.textContent = playing ? "■" : "▶"; btn.disabled = !TTS.ok || (!playing && cap && plays >= cap); };
  btn.onclick = () => {
    if (playing) { TTS.stop(); playing = false; node.classList.remove("playing"); upd(); return; }
    plays++; playing = true; node.classList.add("playing"); upd();
    TTS.play(script, () => { playing = false; node.classList.remove("playing"); upd(); });
  };
  upd(); return node;
}
function transcriptNode(script, open) {
  return el(`<details class="reveal" ${open ? "open" : ""}><summary>Transcript</summary><div class="transcript">${script.map(l => `<p>${l.s !== "N" ? `<span class="who">${l.s === "F" ? "W" : l.s}</span>` : "<em>"}${esc(l.t)}${l.s === "N" ? "</em>" : ""}</p>`).join("")}</div></details>`);
}
function passageNode(p) { return el(`<div class="passage">${p.title ? `<h4>${esc(p.title)}</h4>` : ""}${paras(p.text)}</div>`); }

function renderExercise(ex, opts = {}) {
  const mock = !!opts.mock;
  const card = el(`<div></div>`);
  const api = { grade: () => ({ score: 0, total: 0 }), reveal: () => {}, auto: false };
  const T = ex.type;
  const actions = el(`<div class="ex-actions"></div>`);
  const scoreEl = el(`<span class="ex-score"></span>`);
  const prev = S.wb[ex.id];
  if (!mock && prev) scoreEl.textContent = `Last score: ${prev.score}/${prev.total}`;

  if (T === "empty") {
    card.append(el(`<div class="empty" style="text-align:left"><p><b>Nothing here yet.</b> Every time you add a word, idiom, grammar structure or phrase with the <b>＋</b> button, it goes into its Classbook section, into Flashcards and into new exercises here:</p><ul><li>match the meaning to the word</li><li>complete your own example sentences</li><li>use it in a sentence of your own</li></ul></div>`));
    card.append(btn("＋ Add a new word or structure", "pri", () => openAdd()));
  }
  else if (T === "gap" || (T === "listen" && ex.mode === "gap")) {
    if (T === "listen") { card.append(player(ex.script, mock ? 2 : 0)); if (!mock) card.append(transcriptNode(ex.script)); }
    if (ex.bank) card.append(el(`<div class="bank">${esc(ex.bank)}</div>`));
    const rows = ex.items.map((it, i) => {
      const parts = it.q.split("___");
      let inner = esc(parts[0]); for (let k = 1; k < parts.length; k++) inner += `<input type="text" aria-label="Answer ${i + 1}" autocomplete="off" spellcheck="false"> ` + esc(parts[k]);
      if (parts.length === 1) inner += ` <input type="text" aria-label="Answer ${i + 1}" autocomplete="off">`;
      const r = el(`<div class="item"><div class="num">${i + 1}</div><div><div>${inner}</div><div class="fb"></div></div></div>`);
      card.append(r); return r;
    });
    const check = (show) => {
      let sc = 0;
      rows.forEach((r, i) => {
        const ins = $$("input", r), it = ex.items[i]; const val = ins.map(x => x.value).join(" ");
        const okv = it.a.some(a => normGap(a) === normGap(val));
        if (okv) sc++;
        ins.forEach(x => { x.classList.toggle("ok-f", okv); x.classList.toggle("bad-f", !okv); });
        const fb = $(".fb", r); fb.className = "fb " + (okv ? "ok" : "bad");
        fb.innerHTML = okv ? "✓" : (show || !mock ? `✗ Answer: <b>${esc(it.a.join(" / "))}</b>` : "");
      });
      return sc;
    };
    api.auto = true;
    api.grade = () => { let sc = 0; rows.forEach((r, i) => { const val = $$("input", r).map(x => x.value).join(" "); if (ex.items[i].a.some(a => normGap(a) === normGap(val))) sc++; }); return { score: sc, total: rows.length }; };
    api.reveal = () => { check(true); if (T === "listen") card.append(transcriptNode(ex.script, false)); if (ex.why) card.append(el(`<div class="why">${esc(ex.why)}</div>`)); };
    if (!mock) {
      actions.append(btn("Check", "pri", () => { const sc = check(false); scoreSave(ex, sc, rows.length); scoreEl.textContent = `Score: ${sc}/${rows.length}`; if (ex.why && !card.querySelector(".why")) actions.before(el(`<div class="why">${esc(ex.why)}</div>`)); }));
      actions.append(btn("Reset", "", () => { rows.forEach(r => { $$("input", r).forEach(x => { x.value = ""; x.className = ""; }); $(".fb", r).innerHTML = ""; }); scoreEl.textContent = ""; }));
    }
  }

  else if (T === "rewrite") {
    const rows = ex.items.map((it, i) => {
      const r = el(`<div class="item"><div class="num">${i + 1}</div><div><div>${esc(it.q)}</div>${it.lead ? `<div class="lead-w">Start with: <b>${esc(it.lead)}</b></div>` : ""}${it.tag ? `<div class="lead-w">${esc(it.tag)}</div>` : ""}<textarea aria-label="Your version of sentence ${i + 1}" spellcheck="false"></textarea><div class="fb"></div></div></div>`);
      card.append(r); return r;
    });
    const self = {};
    const check = () => {
      let sc = 0;
      rows.forEach((r, i) => {
        const it = ex.items[i], ta = $("textarea", r), fb = $(".fb", r);
        const models = it.a.split(" | "); const exact = models.some(m => norm(m) === norm(ta.value));
        if (exact) { sc++; ta.className = "ok-f"; fb.className = "fb ok"; fb.innerHTML = "✓ Perfect match"; delete self[i]; return; }
        ta.className = ""; fb.className = "fb";
        fb.innerHTML = `<span class="model">Model: ${esc(models.join("  /  "))}</span><span class="jbtns"><button class="btn sm" data-s="1">✓ Mine is correct too</button><button class="btn sm" data-s="0">✗ Not yet</button></span>`;
        if (self[i] === 1) sc++;
        $$("[data-s]", fb).forEach(b => b.onclick = () => { self[i] = +b.dataset.s; ta.className = self[i] ? "ok-f" : "bad-f"; const s2 = rows.reduce((a, rr, k) => a + ((ex.items[k].a.split(" | ").some(m => norm(m) === norm($("textarea", rr).value)) || self[k] === 1) ? 1 : 0), 0); scoreSave(ex, s2, rows.length); scoreEl.textContent = `Score: ${s2}/${rows.length}`; });
      });
      return sc;
    };
    api.reveal = check;
    actions.append(btn("Check & compare", "pri", () => { const sc = check(); scoreSave(ex, sc, rows.length); scoreEl.textContent = `Score: ${sc}/${rows.length} (mark the rest yourself)`; }));
    actions.append(btn("Reset", "", () => { rows.forEach(r => { $("textarea", r).value = ""; $("textarea", r).className = ""; $(".fb", r).innerHTML = ""; }); scoreEl.textContent = ""; }));
  }

  else if (T === "mcq") {
    let wrap = card;
    if (ex.passage) { const c2 = el(`<div class="cols2"><div class="stick"></div><div></div></div>`); c2.firstChild.append(passageNode(ex.passage)); card.append(c2); wrap = c2.lastChild; }
    const ans = {};

      <div class="fc-actions"><button class="btn again" id="ag">↺ Again</button><button class="btn got" id="ok">✓ Got it</button></div>`;
    $("#card").onclick = () => $("#card").classList.toggle("flipped");
    $("#ag").onclick = () => answer(false); $("#ok").onclick = () => answer(true);
  };
  const answer = ok => {
    const c = cards[pos];
    if (ok) { boxSet(c.d, c.i, Math.min(5, boxGet(c.d, c.i) + 1)); got++; }
    else { boxSet(c.d, c.i, 0); again++; const key = c.d + c.i; if (!requeued.has(key)) { requeued.add(key); cards.splice(Math.min(cards.length, pos + 4), 0, c); } }
    save(); pos++; show();
  };
  window._fcKey = e => {
    if (!$("#card") && !$(".done-card")) return;
    if (e.target.matches("input,textarea,select")) return;
    if (e.key === " ") { e.preventDefault(); $("#card") && $("#card").classList.toggle("flipped"); }
    else if (e.key === "ArrowRight" && $("#card")) answer(true);
    else if (e.key === "ArrowLeft" && $("#card")) answer(false);
    else if (e.key === "Escape") go("fc");
  };
  show();
}

let IDX = [];

buildIndex();
const sIn = $("#q"), sRes = $("#res"); let sAct = -1;
function doSearch() {
  const q = sIn.value.trim().toLowerCase();
  if (q.length < 2) { sRes.classList.remove("open"); return; }
  const hits = IDX.map(o => { let sc = 0; if (o.term && o.term === q) sc += 50; if (o.t.toLowerCase().includes(q)) sc += 20; if (o.term && o.term.startsWith(q)) sc += 10; if (o.body.includes(q)) sc += 5; return [sc, o]; }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 14);
  sAct = -1;
  sRes.innerHTML = hits.length ? hits.map(([, o], i) => `<button data-h="${o.h}" data-i="${i}"><div class="r-k">${esc(o.k)}</div><div class="r-t">${esc(o.t)}</div>${o.s ? `<div class="r-s">${esc(String(o.s).slice(0, 110))}</div>` : ""}</button>`).join("") : `<div style="padding:12px" class="legend">No results for "${esc(q)}"</div>`;
  sRes.classList.add("open");
  $$("button", sRes).forEach(b => b.onclick = () => { sRes.classList.remove("open"); sIn.value = ""; go(b.dataset.h); });
}
sIn.addEventListener("input", doSearch);
sIn.addEventListener("keydown", e => {
  const bs = $$("button", sRes);
  if (e.key === "ArrowDown") { sAct = Math.min(bs.length - 1, sAct + 1); } else if (e.key === "ArrowUp") { sAct = Math.max(0, sAct - 1); }
  else if (e.key === "Enter") { (bs[sAct] || bs[0]) && (bs[sAct] || bs[0]).click(); return; } else if (e.key === "Escape") { sRes.classList.remove("open"); return; } else return;
  e.preventDefault(); bs.forEach((b, i) => b.classList.toggle("act", i === sAct)); bs[sAct] && bs[sAct].scrollIntoView({ block: "nearest" });
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) sRes.classList.remove("open"); });

/* ================================================================ MOCK EXAM */
function openMock() {
  TTS.stop(); clearAllTimers();
  const M = D.mock;
  const ov = el(`<div class="mock-overlay" role="dialog" aria-label="Mock exam"><div class="mock-top"><span class="mt">${esc(M.title)}</span><span class="mp" id="mp">Choose a module</span><span class="sp"></span><span class="timer" id="mtimer" style="display:none"></span><button class="btn sm" id="mclose">Exit</button></div><div class="mock-body" id="mbody"></div></div>`);
  document.body.append(ov); document.body.style.overflow = "hidden";
  const close = () => { TTS.stop(); clearAllTimers(); ov.remove(); document.body.style.overflow = ""; route(); };
  $("#mclose", ov).onclick = close;
  const mods = [
    { k: "listening", name: "Listening", ch: "li", time: 0, d: "Four parts. Each recording can be played twice (read aloud by your browser)." },
    { k: "reading", name: "Reading", ch: "re", time: 35, d: "Four parts, 35 minutes. Marked automatically." },
    { k: "writing", name: "Writing", ch: "wr", time: 50, d: "Essay (30 min) + summary (20 min). Self-assessed with models." },
    { k: "speaking", name: "Speaking", ch: "sp", time: 0, d: "Five parts with preparation and speaking timers. Record yourself on your phone." },
  ];
  const lastRes = k => { const r = S.mocks.filter(m => m.k === k).slice(-1)[0]; return r ? `Last: ${r.score}/${r.total}${r.total ? " (" + Math.round(r.score / r.total * 100) + "%)" : ""}` : ""; };
  const home = () => {
    clearAllTimers(); TTS.stop(); $("#mtimer", ov).style.display = "none"; $("#mp", ov).textContent = "Choose a module";
    $("#mbody", ov).innerHTML = `<h2>Oxford Test of English Advanced · ${esc(M.title)}</h2><p class="legend">Do the modules in any order. Like the real test, Listening and Reading give no feedback until you finish the module.</p>
      <div class="mod-grid">${mods.map(m => `<button class="mod" style="--cc:${cc(m.ch)}" data-m="${m.k}"><h3>${m.name}</h3><p>${m.d}</p><div class="res">${lastRes(m.k)}</div></button>`).join("")}</div>
      <p class="legend">As a rough guide for the auto-marked modules: 75% or more suggests you're working comfortably at C1; 60–75% is the B2/C1 border.</p>`;
    $$("[data-m]", ov).forEach(b => b.onclick = () => runModule(mods.find(m => m.k === b.dataset.m)));
  };
  const runModule = mod => {
    const parts = M[mod.k]; let i = 0; const nodes = parts.map(p => renderExercise(p, { mock: true }));
    let finished = false;
    if (mod.time) { const t = $("#mtimer", ov); t.style.display = ""; countdown(mod.time * 60, l => { t.textContent = fmt(l); t.classList.toggle("warn", l < 300); }, () => { beep(660, .5); if (!finished) finish(); }); }
    const show = () => {
      TTS.stop();
      const p = parts[i]; $("#mp", ov).textContent = `${mod.name} · ${p.part} (${i + 1}/${parts.length})`;
      const body = $("#mbody", ov); body.innerHTML = "";
      body.append(el(`<div class="ex-card" style="--cc:${cc(mod.ch)};border-left-color:${cc(mod.ch)}"><h1>${esc(p.title)}</h1><p class="ex-instr">${esc(p.instr || p.task || "")}</p><div id="slot"></div><div class="pager"><button class="btn" id="mprev" ${i === 0 ? "disabled" : ""}>← Previous part</button>${i < parts.length - 1 ? `<button class="btn pri" id="mnext">Next part →</button>` : `<button class="btn pri" id="mfin">${finished ? "See results" : "Finish module"}</button>`}</div></div>`));
      if (p.type === "write") $(".ex-instr", body).textContent = p.task + (p.minutes ? ` (suggested time: ${p.minutes} min)` : "");
      $("#slot", body).append(nodes[i]);
      $("#mprev", body).onclick = () => { i--; show(); };
      if ($("#mnext", body)) $("#mnext", body).onclick = () => { i++; show(); };
      if ($("#mfin", body)) $("#mfin", body).onclick = finish;
      ov.scrollTop = 0;
    };
    const finish = () => {
      if (!finished) {
        finished = true; clearAllTimers(); TTS.stop(); $("#mtimer", ov).style.display = "none";
        let sc = 0, tot = 0;
        nodes.forEach(n => { const a = n._api; if (a.auto) { const g = a.grade(); sc += g.score; tot += g.total; } a.reveal(); });
        const extra = mod.k === "writing" ? ` · essay ${nodes[0]._api.words ? nodes[0]._api.words() : 0} words, summary ${nodes[1] && nodes[1]._api.words ? nodes[1]._api.words() : 0} words` : "";
        S.mocks.push({ k: mod.k, module: mod.name, score: sc, total: tot, date: new Date().toISOString().slice(0, 10) }); save();
        const body = $("#mbody", ov);
        body.innerHTML = `<div class="panel"><h2>${mod.name}: finished</h2>${tot ? `<p style="font:600 34px var(--f-display);margin:10px 0">${sc}/${tot} <span class="legend" style="font-size:16px">(${Math.round(sc / tot * 100)}%)</span></p>` : `<p class="legend">This module is self-assessed${extra}. Review each part below: the model answers and checklists are now open.</p>`}
          <div class="btnrow"><button class="btn pri" id="rev">Review answers</button><button class="btn" id="mh">Back to modules</button></div></div>`;
        $("#rev", body).onclick = () => { i = 0; show(); };
        $("#mh", body).onclick = home;
        $("#mp", ov).textContent = `${mod.name} · results`;
        return;
      }
      home();
    };
    show();
  };
  home();
}

function toast(html, actions) {
  const old = $(".toast"); if (old) old.remove();
  const t = el(`<div class="toast" role="status"><div>${html}</div><div class="toast-a"></div></div>`);
  (actions || []).forEach(([l, fn]) => { const b = el(`<button class="btn sm">${l}</button>`); b.onclick = () => { t.remove(); fn(); }; $(".toast-a", t).append(b); });
  document.body.append(t); setTimeout(() => t.classList.add("in"), 10); setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 300); }, 7000);

}

function openAdd(pre = {}) {
  const editing = pre.id ? S.my.find(u => u.id === pre.id) : null;

  const [m, close] = modal(`

    <h3 style="font-size:17px;margin:18px 0 6px">Restore</h3>

    <div class="btnrow" style="justify-content:flex-end"><button class="btn" id="b-rs">Restore from pasted text</button></div>

  $("#b-dl", m).onclick = () => {
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = "ote-backup-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.append(a); a.click(); a.remove(); msg.textContent = "If nothing downloaded (some previews block downloads), use 'Copy backup as text' and paste it into a note."; }
    catch (e) { msg.textContent = "Download isn't allowed here: use 'Copy backup as text'."; }
  };
  $("#b-cp", m).onclick = async () => { try { await navigator.clipboard.writeText(data); msg.textContent = "Copied. Paste it into a note or send it to yourself."; } catch (e) { $("#b-txt", m).value = data; $("#b-txt", m).select(); msg.textContent = "Copy didn't work automatically: the text is selected in the box, copy it manually."; } };
  const restore = txt => {
    try { const o = JSON.parse(txt); const st = o && o.state ? o.state : o; if (!st || typeof st !== "object" || (!st.learned && !st.my && !st.fc)) throw 0;
