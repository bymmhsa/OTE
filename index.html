tten informally → rewrite them formally: <b class=\"hl\">Motor vehicles are prohibited<\/b> · <b class=\"hl\">Take reasonable care of the contents<\/b> · <b class=\"hl\">You are liable for any damage<\/b> · <b class=\"hl\">Notify us in advance<\/b> · <b class=\"hl\">It will be refunded in full<\/b>.<\/p><\/div>", "tags": ""}, {"id": "wr-beyond", "ch": "wr", "part": "Keep your level", "title": "Beyond the exam: other formats", "sub": "Emails, reports, proposals (Cambridge-style)", "html": "<p class=\"lead\">The Oxford Test only asks for an essay and a summary, but if you want to keep your level for work or for another exam, these formats from your Cambridge notes are worth having.<\/p><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Informal email<\/div><p><b class=\"hl\">Open:<\/b> It's been ages! · Lovely to hear from you · Sorry I haven't been in touch for so long.<br><b class=\"hl\">Persuade:<\/b> You'd get so much out of it · Just imagine how it would improve your CV.<br><b class=\"hl\">Advise:<\/b> Whatever you do, make sure you… · You'd be much better off + -ing · If I were in your shoes, I'd…<br><b class=\"hl\">Change topic:<\/b> By the way… · In other news…<br><b class=\"hl\">Close:<\/b> I think I've rattled on for long enough · Drop me a line soon · Take care.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Report<\/div><p><b class=\"hl\">Title:<\/b> Report on…<br><b class=\"hl\">Intro:<\/b> The aim of this report is to examine / evaluate / outline… It is based on a survey conducted among…<br><b class=\"hl\">Findings:<\/b> A significant number of… · A handful of… · The key strengths mentioned were… · The most pressing issue is…, which is compounded by…<br><b class=\"hl\">Recommendations:<\/b> I would strongly recommend that… · It would be highly advisable to… · Were these recommendations to be implemented, …<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Proposal<\/div><p><b class=\"hl\">Title:<\/b> Proposal for…<br><b class=\"hl\">Intro:<\/b> The purpose of this proposal is to… as requested by…<br><b class=\"hl\">Headings:<\/b> Regarding… · As far as… is concerned · When it comes to…<br><b class=\"hl\">Suggestions:<\/b> I believe this issue could be tackled by + -ing · In my view, it is advisable to…<br><b class=\"hl\">Results:<\/b> If this measure is taken… · Doing X will ensure…<br><b class=\"hl\">Close:<\/b> I strongly urge the council to consider this proposal.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Review<\/div><p><b class=\"hl\">Open strongly:<\/b> a rhetorical question or a bold statement that teases the reader.<br><b class=\"hl\">Body:<\/b> describe → evaluate (gripping plot, compelling characters, faithful adaptation).<br><b class=\"hl\">Close:<\/b> a clear recommendation: It's well worth seeing… / I wouldn't think twice about…<\/p><\/div><\/div><h3>Cambridge essay openers worth keeping<\/h3><ul class=\"ideas\"><li>In this day and age, it is a widely held belief that there is a myriad of ways to… Yet this begs the question of which ones ought to be given more prominence.<\/li><li>There is undoubtedly an increasing trend towards… nowadays.<\/li><li>The trend nowadays is towards + -ing…<\/li><li>Few people would dispute the fact that…<\/li><li>Another point equally worth paying heed to is…<\/li><li>Be that as it may, I feel strongly that… takes precedence.<\/li><\/ul>", "tags": ""}, {"id": "wr-prompts", "ch": "wr", "part": "Keep your level", "title": "Essay prompt bank", "sub": "Oxford format: develop two of the three ideas", "html": "<p class=\"lead\">Pick one, set a 30-minute timer in the Workbook writing desk, and develop exactly <b class=\"hl\">two<\/b> of the three ideas.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Statement<\/th><th>Ideas (choose 2)<\/th><\/tr><\/thead><tbody><tr><td>What factors should people consider most carefully when choosing a career?<\/td><td>qualifications · pay · job satisfaction<\/td><\/tr><tr><td>Governments should invest more in preventative healthcare than in hospitals.<\/td><td>long-term cost · public awareness campaigns · immediate medical need<\/td><\/tr><tr><td>Working from home is a positive development.<\/td><td>productivity · work-life balance · social isolation<\/td><\/tr><tr><td>Smartphones should be banned in schools.<\/td><td>concentration · social skills · safety<\/td><\/tr><tr><td>Young people leave school with a negative attitude to learning. How can schools change this?<\/td><td>practical skills · teaching methods · rewards<\/td><\/tr><tr><td>Countries should import less food.<\/td><td>local economy · food security · environment<\/td><\/tr><tr><td>Advertising aimed at children should be banned.<\/td><td>consumer pressure · parental responsibility · commercial freedom<\/td><\/tr><tr><td>The rapid growth of the world population is unsustainable.<\/td><td>resources · economic growth · education<\/td><\/tr><tr><td>Plastic packaging should be taxed heavily.<\/td><td>environmental damage · cost to consumers · alternatives<\/td><\/tr><tr><td>Social skills matter more than academic qualifications when hiring.<\/td><td>communication · technical knowledge · teamwork<\/td><\/tr><tr><td>Drivers should retake their driving test regularly.<\/td><td>road safety · cost · older drivers<\/td><\/tr><tr><td>Global tourism is making places around the world look the same.<\/td><td>globalisation · local culture · the economy<\/td><\/tr><tr><td>Fossil fuels should be phased out as quickly as possible.<\/td><td>climate · energy prices · jobs<\/td><\/tr><tr><td>We can no longer trust journalists.<\/td><td>competition · clickbait · investigative journalism<\/td><\/tr><tr><td>Salary is the most important aspect of a job.<\/td><td>passion · ethics · financial security<\/td><\/tr><tr><td>Governments should spend more on space exploration.<\/td><td>jobs · scientific progress · cost<\/td><\/tr><tr><td>Rich countries should make it easier for young people to buy a home.<\/td><td>wages · housing supply · taxation<\/td><\/tr><\/tbody><\/table><\/div><button class=\"goto\" data-goto=\"wb:writing\">Open the writing desk →<\/button>", "tags": ""}, {"id": "mo-format", "ch": "mo", "part": "Exam", "title": "The Oxford Test of English Advanced", "sub": "Format with no surprises", "html": "<p class=\"lead\">The exam measures <b class=\"hl\">mediation<\/b>: summarising, synthesising and adapting language. It's 100% computer-based at an exam centre. Reading and Listening are <b class=\"hl\">adaptive<\/b> (get it right → harder questions → more points).<\/p><div class=\"tbl-wrap\"><table class=\"score-table\"><thead><tr><th>Module<\/th><th>Parts<\/th><th>Star task<\/th><th>Time<\/th><th>Marked by<\/th><th>Your score<\/th><\/tr><\/thead><tbody><tr><td>Speaking<\/td><td>5<\/td><td>Debate (2 min) + oral summary<\/td><td>~15 min<\/td><td>Human<\/td><td><b class=\"hl\">128<\/b> (B2)<\/td><\/tr><tr><td>Listening<\/td><td>4<\/td><td>Note completion + matching opinions<\/td><td>~30 min<\/td><td>Computer<\/td><td><b class=\"hl\">141<\/b> (C1 ✓)<\/td><\/tr><tr><td>Reading<\/td><td>4<\/td><td>Gapped text + multiple matching<\/td><td>~35 min<\/td><td>Computer<\/td><td><b class=\"hl\">140<\/b> (B2)<\/td><\/tr><tr><td>Writing<\/td><td>2<\/td><td>Essay (220–280) + summary (80–100)<\/td><td>50 min<\/td><td>Human<\/td><td><b class=\"hl\">140<\/b> (B2)<\/td><\/tr><\/tbody><\/table><\/div><p>Scale: B2 = 111–140 · C1 = 141–170. Your overall score was <b class=\"hl\">137<\/b>. Three points per module, mostly in Speaking, are what separates you from C1.<\/p><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Range vs precision<\/span><\/div><p>In Speaking and Writing, <b class=\"hl\">range<\/b> wins (varied structures and vocabulary). In Reading and Listening, <b class=\"hl\">precision<\/b> wins (synonyms; don't trust options that repeat the words).<\/p><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Before the exam<\/span><\/div><p>Do the official free OUP demo and at least one full practice test on a computer with a timer. Each task is timed and the system moves on by itself: practising the format is worth as much as knowing English.<\/p><\/div>", "tags": ""}, {"id": "mo-mock", "ch": "mo", "part": "Exam", "title": "Full mock exam", "sub": "Timed, auto-marked where possible", "html": "<p class=\"lead\">A complete original mock in Oxford format. Reading and Listening are marked automatically; Writing and Speaking come with timers, word counters, checklists and model answers so you can self-assess.<\/p><div class=\"mock-launch\"><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Module<\/th><th>In this mock<\/th><th>Time<\/th><\/tr><\/thead><tbody><tr><td>Listening<\/td><td>Part 1 (3 items) · Part 2 (6 gaps) · Part 3 (6 items) · Part 4 (3 items), played aloud by your browser twice<\/td><td>~20 min<\/td><\/tr><tr><td>Reading<\/td><td>Part 1 (3 texts) · Part 2 (6 items) · Part 3 (6 gaps) · Part 4 (5 items)<\/td><td>35 min<\/td><\/tr><tr><td>Writing<\/td><td>Essay + summary with word counter<\/td><td>50 min<\/td><\/tr><tr><td>Speaking<\/td><td>All 5 parts with preparation and speaking timers<\/td><td>~15 min<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Record yourself<\/span><\/div><p>The browser can't record inside this page, so put your phone on the desk and record the Speaking module. Listen back with the checklist.<\/p><\/div>", "tags": ""}, {"id": "mo-checklist", "ch": "mo", "part": "Exam", "title": "Exam-day checklist", "sub": "What you must have 100% learned", "html": "<div class=\"checklist\" data-check=\"examday\"><label><input type=\"checkbox\"> <b class=\"hl\">Grammar:<\/b> I can produce an inversion, a cleft, an inverted conditional and an impersonal passive without thinking.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Vocabulary:<\/b> I have 15–20 upgrades and 10 collocations I can place correctly.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Idioms:<\/b> 5–6 natural idioms ready for Speaking.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Connectors:<\/b> a different one per function; I don't repeat 'also'.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Essay:<\/b> I know the template and write ~250 words in 30 minutes with 3–4 C1 structures.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Summary:<\/b> I paraphrase everything, combine both texts, give no opinion, ≤100 words.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Reading:<\/b> I read the question first; in gapped text I watch pronouns and connectors; in Part 2 I read all three texts before marking.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Listening:<\/b> the answer paraphrases; literal repetitions are traps.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Speaking:<\/b> I have the phrase bank per part and I've timed the 2-minute debate.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">L1 errors:<\/b> I check -s, articles, prepositions and uncountables.<\/label><label><input type=\"checkbox\"> <b class=\"hl\">Time:<\/b> I've practised on a computer with a timer; I know the system moves on by itself.<\/label><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Winning mindset<\/span><\/div><p>The examiner looks for <b class=\"hl\">range and control<\/b>, not perfection. Take risks with C1 structures, but only with the ones you control. Better 250 clear, varied words than 280 forced ones with errors. <b class=\"hl\">Variety + control = C1.<\/b><\/p><\/div>", "tags": ""}, {"id": "mo-plan", "ch": "mo", "part": "Exam", "title": "4-week study plan", "sub": "Format first, then language, then timed mocks", "html": "<div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Week 1 · Format + diagnosis<\/div><div class=\"step-b\">Do the official OUP demo and a full practice test. Identify your weakest module (Speaking). Start memorising the grammar structures.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Week 2 · Active language<\/div><div class=\"step-b\">Vocabulary, idioms and connectors. Write 2 essays and 2 summaries; self-correct with the Error clinic. Reading and Listening: one part of each per day.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Week 3 · Speaking + timed writing<\/div><div class=\"step-b\">Record the 2-minute debate every day using the phrase bank. Essays and summaries with a timer (30 + 20 min).<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Week 4 · Full mocks<\/div><div class=\"step-b\">2–3 full exams on a computer, timed, no pauses. Review only your recurring errors. The day before: rest.<\/div><\/div><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Minimum daily routine<\/span><\/div><p>15 min active vocabulary (Flashcards) · 1 Reading or Listening task · 1 Speaking recording of 1–2 min · every 2 days, 1 piece of writing.<\/p><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">To keep your level after the exam<\/span><\/div><p>Two flashcard sessions a week · one podcast summarised aloud · one essay a month from the prompt bank · read one long article a week and note 5 words in <b class=\"hl\">My notes<\/b>.<\/p><\/div>", "tags": ""}], "workbook": [{"id": "vg1", "sec": "vg", "part": "Grammar", "title": "Rewrite using inversion", "type": "rewrite", "instr": "Make each sentence more emphatic, starting with the word(s) given.", "items": [{"q": "I have never seen such a moving film.", "a": "Never have I seen such a moving film.", "lead": "Never"}, {"q": "We only received our drinks when we reminded the waiter for the third time.", "a": "Only when we reminded the waiter for the third time did we receive our drinks.", "lead": "Only when"}, {"q": "The novel has an implausible storyline and the characters are really dull as well.", "a": "Not only does the novel have an implausible storyline, but the characters are also really dull.", "lead": "Not only"}, {"q": "I will never read another book by that author again.", "a": "Never again will I read a book by that author.", "lead": "Never again"}, {"q": "The film had scarcely started when I was moved to tears.", "a": "Scarcely had the film started when I was moved to tears.", "lead": "Scarcely"}, {"q": "Until you've watched the film two or three times, you can't fully understand the plot.", "a": "Not until you've watched the film two or three times can you fully understand the plot.", "lead": "Not until"}, {"q": "I fell asleep as soon as my head hit the pillow.", "a": "No sooner had my head hit the pillow than I fell asleep.", "lead": "No sooner"}, {"q": "We were only given a different room after we asked to speak to the manager.", "a": "Only then were we given a different room. | Only after we asked to speak to the manager were we given a different room.", "lead": "Only after"}]}, {"id": "vg2", "sec": "vg", "part": "Grammar", "title": "Gap fill: inversions", "type": "gap", "instr": "Complete with one word: again, but, hardly, never, no, not, only, rarely, sooner, than, until, when.", "items": [{"q": "No ___ had we sat down at our table than we were offered a drink.", "a": ["sooner"]}, {"q": "___ have I read such a gripping book. I just couldn't put it down!", "a": ["Rarely", "Never", "Seldom"]}, {"q": "Hardly had we finished our starters ___ the waiter brought our main courses.", "a": ["when", "than"]}, {"q": "Never ___ will I watch a war film on a laptop.", "a": ["again"]}, {"q": "___ when I compared the original to the translation did I see how bad it was.", "a": ["Only"]}, {"q": "Not ___ were our rooms not available, there was also nowhere to leave our luggage.", "a": ["only"]}, {"q": "Not ___ you stay at this hotel do you understand the meaning of 'luxury'.", "a": ["until"]}]}, {"id": "vg22", "sec": "vg", "part": "Grammar", "title": "Not only… but also", "type": "rewrite", "instr": "Rewrite using Not only + auxiliary + subject…, but…", "items": [{"q": "The policy is not only unpopular but also ineffective.", "a": "Not only is the policy unpopular, but it is also ineffective.", "lead": ""}, {"q": "The government not only failed but also misled the public.", "a": "Not only did the government fail, but it also misled the public.", "lead": ""}, {"q": "The plan is not only expensive but also unrealistic.", "a": "Not only is the plan expensive, but it is also unrealistic.", "lead": ""}, {"q": "She not only finished the project early but also under budget.", "a": "Not only did she finish the project early, but she also did it under budget.", "lead": ""}]}, {"id": "vg25", "sec": "vg", "part": "Grammar", "title": "Cleft sentences", "type": "rewrite", "instr": "Rewrite to emphasise the part in CAPITALS with a cleft sentence (It is… that / What… is).", "items": [{"q": "Governments must prioritise RENEWABLE ENERGY.", "a": "It is renewable energy that governments must prioritise. | What governments must prioritise is renewable energy.", "lead": ""}, {"q": "POLITICIANS should decide, not scientists.", "a": "It is politicians who should decide, not scientists.", "lead": ""}, {"q": "We should worry about the ENVIRONMENTAL implications, not the financial ones.", "a": "It is not the financial but the environmental implications we should worry about.", "lead": ""}, {"q": "THE LACK OF INVESTMENT is the real problem, not poor management.", "a": "It is the lack of investment that is the real problem, not poor management.", "lead": ""}, {"q": "The study fails to consider THE LONG-TERM IMPACT.", "a": "What the study fails to consider is the long-term impact.", "lead": ""}]}, {"id": "vgcond", "sec": "vg", "part": "Grammar", "title": "Inverted conditionals", "type": "rewrite", "instr": "Rewrite without 'if', starting with Had / Were / Should.", "items": [{"q": "If the government had acted sooner, the crisis would have been averted.", "a": "Had the government acted sooner, the crisis would have been averted.", "lead": "Had"}, {"q": "If it weren't for investment in technology, development would stall.", "a": "Were it not for investment in technology, development would stall.", "lead": "Were"}, {"q": "If you need any help, do not hesitate to ask.", "a": "Should you need any help, do not hesitate to ask.", "lead": "Should"}, {"q": "If this trend continued, inequality would inevitably widen.", "a": "Were this trend to continue, inequality would inevitably widen.", "lead": "Were"}, {"q": "If we had listened to local legends, we would have dug in the wrong place.", "a": "Had we listened to local legends, we would have dug in the wrong place.", "lead": "Had"}]}, {"id": "vg3", "sec": "vg", "part": "Grammar", "title": "The… the… comparatives", "type": "rewrite", "instr": "Rewrite using The… the… + comparative.", "items": [{"q": "If a car is big, it uses more petrol.", "a": "The bigger a car is, the more petrol it uses.", "lead": ""}, {"q": "If we start soon, we'll finish soon.", "a": "The sooner we start, the sooner we'll finish.", "lead": ""}, {"q": "When you get old, you become wiser.", "a": "The older you get, the wiser you become.", "lead": ""}, {"q": "If people drive fast, they have more accidents.", "a": "The faster people drive, the more accidents they have.", "lead": ""}, {"q": "If the weather is hot, you need to drink more.", "a": "The hotter the weather (is), the more you need to drink.", "lead": ""}, {"q": "If you cook it slowly, it'll taste better.", "a": "The more slowly you cook it, the better it'll taste.", "lead": ""}, {"q": "If we do a lot of work now, we'll have less to do later.", "a": "The more work we do now, the less we'll have to do later.", "lead": ""}]}, {"id": "vg4", "sec": "vg", "part": "Grammar", "title": "So / such / such a", "type": "gap", "instr": "Complete with so, such or such a.", "items": [{"q": "My case is ___ heavy that I can hardly pick it up.", "a": ["so"]}, {"q": "It was ___ long flight that the children got very bored.", "a": ["such a"]}, {"q": "There were ___ many people at the airport that we couldn't see him.", "a": ["so"]}, {"q": "It was ___ awful weather that we couldn't leave the hotel.", "a": ["such"]}, {"q": "We had ___ much luggage that we had to ask a porter.", "a": ["so"]}, {"q": "Jim is ___ selfish that he can't think about anybody else.", "a": ["so"]}, {"q": "Jim is ___ selfish person that he can't think about anybody else.", "a": ["such a"]}, {"q": "They were ___ cheap tickets that we decided to buy them.", "a": ["such"]}]}, {"id": "vgsubj", "sec": "vg", "part": "Grammar", "title": "Subjunctive & passives", "type": "gap", "instr": "Write the correct form of the verb in brackets.", "items": [{"q": "It is vital that the company ___ (implement) new rules.", "a": ["implement"]}, {"q": "The board recommended that he ___ (be) promoted.", "a": ["be"]}, {"q": "It is imperative that the issue of waste ___ (address).", "a": ["be addressed"]}, {"q": "I wish governments ___ (be) more transparent.", "a": ["were"]}, {"q": "The CEO is reported ___ (resign) last week.", "a": ["to have resigned"]}, {"q": "Plastic is thought ___ (be) one of the main pollutants.", "a": ["to be"]}, {"q": "The company had the report ___ (review) by experts.", "a": ["reviewed"]}]}, {"id": "vg24", "sec": "vg", "part": "Grammar", "title": "Reduced relatives & participle clauses", "type": "rewrite", "instr": "Shorten each sentence (remove which/who + be, or use a participle clause).", "items": [{"q": "The policy, which was introduced in 2020, has been controversial.", "a": "The policy, introduced in 2020, has been controversial.", "lead": ""}, {"q": "Students who are from disadvantaged backgrounds often face more obstacles.", "a": "Students from disadvantaged backgrounds often face more obstacles.", "lead": ""}, {"q": "The research, which was conducted by Harvard, challenges previous assumptions.", "a": "The research, conducted by Harvard, challenges previous assumptions.", "lead": ""}, {"q": "Employees who are affected by the changes will be notified next week.", "a": "Employees affected by the changes will be notified next week.", "lead": ""}, {"q": "After the panel had considered the evidence, it reached a verdict.", "a": "Having considered the evidence, the panel reached a verdict.", "lead": ""}, {"q": "Because they were faced with rising costs, firms cut staff.", "a": "Faced with rising costs, firms cut staff.", "lead": ""}]}, {"id": "vg23", "sec": "vg", "part": "Grammar", "title": "Advanced concession", "type": "rewrite", "instr": "Rewrite with the structure given.", "items": [{"q": "I appreciate the policy, but I cannot support it.", "a": "Much as I appreciate the policy, I cannot support it.", "lead": "Much as"}, {"q": "The policy has many benefits, but it also has drawbacks.", "a": "For all its benefits, the policy also has drawbacks.", "lead": "For all its"}, {"q": "There were concerns, but the project went ahead.", "a": "Concerns notwithstanding, the project went ahead.", "lead": "…notwithstanding"}, {"q": "I admire her work ethic, but I disagree with her methods.", "a": "Much as I admire her work ethic, I disagree with her methods.", "lead": "Much as"}]}, {"id": "vg5", "sec": "vg", "part": "Grammar", "title": "Hedging at C1 level", "type": "rewrite", "instr": "Rewrite with the hedging structure indicated.", "items": [{"q": "Social media causes anxiety.", "a": "It would be reductive to suggest that social media causes anxiety.", "lead": "It would be reductive to suggest that…"}, {"q": "The policy is perfect.", "a": "This is not to say that the policy is flawless.", "lead": "This is not to say that…"}, {"q": "Economic growth will solve poverty.", "a": "It is by no means certain that economic growth will solve poverty.", "lead": "It is by no means certain that…"}, {"q": "Urbanisation leads to environmental damage.", "a": "There is a growing body of evidence to suggest that urbanisation may lead to environmental damage.", "lead": "There is a growing body of evidence…"}, {"q": "The economy is growing, so wages will rise.", "a": "While the economy may be growing, it does not necessarily follow that wages will rise.", "lead": "While X may be true, it does not necessarily follow that…"}]}, {"id": "vg21", "sec": "vg", "part": "Grammar", "title": "Quantifiers: countable or uncountable?", "type": "rewrite", "instr": "Correct the error. If the sentence is correct, write it again unchanged.", "items": [{"q": "A large amount of people attended the conference.", "a": "A large number of people attended the conference.", "lead": ""}, {"q": "A large number of research has been done.", "a": "A large amount of research has been done. | A great deal of research has been done.", "lead": ""}, {"q": "There are a great deal of options available.", "a": "There are a great number of options available. | There is a great deal of choice available.", "lead": ""}, {"q": "Countless money has been wasted.", "a": "A great deal of money has been wasted. | A considerable amount of money has been wasted.", "lead": ""}, {"q": "The vast majority of information is outdated.", "a": "The vast majority of information is outdated.", "lead": ""}]}, {"id": "vgverbpat", "sec": "vg", "part": "Grammar", "title": "Infinitive or -ing?", "type": "mcq", "instr": "Choose the correct option.", "items": [{"q": "I stopped ___ TV years ago: I don't even own one.", "o": ["to watch", "watching"], "a": 1, "why": "stop + -ing = give up the activity."}, {"q": "On the way home I stopped ___ a coffee.", "o": ["to have", "having"], "a": 0, "why": "stop + to = stop in order to do something."}, {"q": "My boss made me ___ the report again.", "o": ["write", "to write"], "a": 0, "why": "make + object + bare infinitive."}, {"q": "I was made ___ the report again.", "o": ["write", "to write"], "a": 1, "why": "Passive of make takes to."}, {"q": "I look forward to ___ from you.", "o": ["hear", "hearing"], "a": 1, "why": "look forward TO + -ing."}, {"q": "It's easy ___ to get lost in this city.", "o": ["for me", "that I"], "a": 0, "why": "preposition + person + to-infinitive."}, {"q": "Our parents let us ___ out late.", "o": ["stay", "to stay"], "a": 0, "why": "let + object + bare infinitive."}]}, {"id": "vgprep", "sec": "vg", "part": "Grammar", "title": "Prepositions", "type": "gap", "instr": "Write the missing preposition. Write 0 if none is needed.", "items": [{"q": "It all depends ___ the weather.", "a": ["on"]}, {"q": "The course consists ___ six modules.", "a": ["of"]}, {"q": "Could you explain the problem ___ me?", "a": ["to"]}, {"q": "She apologised ___ being late.", "a": ["for"]}, {"q": "Plastic affects ___ marine life.", "a": ["0"]}, {"q": "Small businesses have to face ___ many obstacles.", "a": ["0"]}, {"q": "Children may be distracted ___ the real world.", "a": ["from"]}, {"q": "I'm really interested ___ genetics.", "a": ["in"]}, {"q": "Lean ___ the wall if you feel dizzy.", "a": ["against"]}, {"q": "I heard it ___ the radio.", "a": ["on"]}, {"q": "Please provide us ___ more information.", "a": ["with"]}, {"q": "Many people struggle ___ grammar.", "a": ["with"]}]}, {"id": "vgirr", "sec": "vg", "part": "Grammar", "title": "Irregular verbs", "type": "gap", "instr": "Write the past participle.", "items": [{"q": "lead → ___", "a": ["led"]}, {"q": "seek → ___", "a": ["sought"]}, {"q": "spring → ___", "a": ["sprung"]}, {"q": "swell → ___", "a": ["swollen"]}, {"q": "forbid → ___", "a": ["forbidden"]}, {"q": "shrink → ___", "a": ["shrunk"]}, {"q": "lean → ___", "a": ["leant", "leaned"]}, {"q": "bear (borne out) → ___", "a": ["borne"]}, {"q": "tear → ___", "a": ["torn"]}, {"q": "lie (tumbarse) → ___", "a": ["lain"]}, {"q": "strike → ___", "a": ["struck"]}, {"q": "sweep → ___", "a": ["swept"]}, {"q": "dig → ___", "a": ["dug"]}, {"q": "spill → ___", "a": ["spilt", "spilled"]}, {"q": "bite → ___", "a": ["bitten"]}, {"q": "feed → ___", "a": ["fed"]}]}, {"id": "vgcontrast", "sec": "vg", "part": "Grammar", "title": "Yet, whereas, although, despite", "type": "mcq", "instr": "Choose the best option.", "items": [{"q": "___ being well-qualified, she struggled to find a job.", "o": ["Although", "Despite"], "a": 1, "why": "Despite + -ing."}, {"q": "___ the government has invested heavily, results remain disappointing.", "o": ["Although", "Despite"], "a": 0, "why": "Although + clause."}, {"q": "I haven't finished it ___.", "o": ["yet", "still"], "a": 0, "why": "yet at the end of a negative sentence."}, {"q": "The flat is small ___ surprisingly bright.", "o": ["yet", "whereas"], "a": 0, "why": "adjective + yet + adjective."}, {"q": "I love yoga, ___ my sister can't stand it.", "o": ["whereas", "despite"], "a": 0, "why": "whereas contrasts two facts."}, {"q": "Crime rates have fallen, ___ public perception of safety has not improved.", "o": ["whereas", "owing to"], "a": 0, "why": ""}, {"q": "___ the evidence, the committee approved the plan.", "o": ["In light of", "In spite of"], "a": 0, "why": "In light of = because of / considering."}, {"q": "The plan has some merit. ___, it fails to address the core issue.", "o": ["Nevertheless", "Furthermore"], "a": 0, "why": ""}, {"q": "Unemployment has risen sharply. ___, consumer spending has declined.", "o": ["Consequently", "Moreover"], "a": 0, "why": ""}]}, {"id": "vg6", "sec": "vg", "part": "Vocabulary", "title": "Upgrade the basic word", "type": "gap", "instr": "Replace the word in CAPITALS with a C1 word from the box.", "bank": "paramount · detrimental · tackle · plummeted · trigger · substantial · foster · shed light on", "items": [{"q": "Education is VERY IMPORTANT for development. → ___", "a": ["paramount"]}, {"q": "Pollution has a BAD effect on health. → ___", "a": ["detrimental"]}, {"q": "Governments need to SOLVE the housing crisis. → ___", "a": ["tackle"]}, {"q": "House prices have DECREASED dramatically. → ___", "a": ["plummeted"]}, {"q": "The new law could CAUSE protests. → ___", "a": ["trigger"]}, {"q": "There has been a BIG increase in online learning. → ___", "a": ["substantial"]}, {"q": "Schools should IMPROVE creativity. → ___", "a": ["foster"]}, {"q": "This study will SHOW the real causes. → ___", "a": ["shed light on"]}], "note": "Last time you mixed up tackle/trigger and foster/shed light on: trigger = cause, tackle = solve; foster = encourage, shed light on = reveal."}, {"id": "vg7", "sec": "vg", "part": "Vocabulary", "title": "Collocations: choose the verb", "type": "gap", "instr": "Complete with: pose, raise, draw, play, shed, strike, bridge, gain.", "items": [{"q": "___ awareness of mental health issues", "a": ["raise"]}, {"q": "___ a threat to biodiversity", "a": ["pose"]}, {"q": "___ a conclusion from the data", "a": ["draw"]}, {"q": "___ a pivotal role in education", "a": ["play"]}, {"q": "___ light on the causes of the crisis", "a": ["shed"]}, {"q": "___ a balance between work and leisure", "a": ["strike"]}, {"q": "___ the gap between rich and poor", "a": ["bridge"]}, {"q": "___ momentum in the polls", "a": ["gain"]}]}, {"id": "vg27", "sec": "vg", "part": "Vocabulary", "title": "Vague → precise", "type": "gap", "instr": "Replace the vague phrase in CAPITALS with a precise alternative from the box.", "bank": "exacerbated · mitigated · incredibly disruptive · sustain them domestically · developed economies · dramatic shifts · could have disastrous consequences", "items": [{"q": "Climate change is A PROBLEM for agriculture. → ___", "a": ["incredibly disruptive"]}, {"q": "The drought has MADE WORSE the water shortage. → ___", "a": ["exacerbated"]}, {"q": "New irrigation methods have MADE BETTER the losses. → ___", "a": ["mitigated"]}, {"q": "Ignoring the warning signs IS A BAD IDEA. → ___", "a": ["could have disastrous consequences"]}, {"q": "The country needs to GROW FOOD FOR its population. → ___", "a": ["sustain them domestically"]}, {"q": "Some DEVELOPED COUNTRIES rely heavily on imports. → ___", "a": ["developed economies"]}, {"q": "We are seeing BIG CHANGES in consumer behaviour. → ___", "a": ["dramatic shifts"]}]}, {"id": "vg26", "sec": "vg", "part": "Vocabulary", "title": "Semi-formal register", "type": "gap", "instr": "Replace the casual word in CAPITALS with a semi-formal alternative.", "items": [{"q": "This app will HELP students to organise their time. → ___", "a": ["facilitate", "aid", "enable"]}, {"q": "The graph SHOWS a clear downward trend. → ___", "a": ["demonstrates", "illustrates", "reveals"]}, {"q": "Climate change is a serious PROBLEM for coastal cities. → ___", "a": ["challenge", "obstacle", "threat"]}, {"q": "New regulations will CHANGE the way companies operate. → ___", "a": ["transform", "alter"]}, {"q": "The report doesn't EXPLAIN why sales fell. → ___", "a": ["clarify", "outline"]}, {"q": "Many PEOPLE are unaware of the risks. → ___", "a": ["individuals", "citizens"]}, {"q": "There is A LOT OF evidence to support this theory. → ___", "a": ["considerable", "substantial", "a wealth of", "a great deal of", "abundant"]}]}, {"id": "vgimp", "sec": "vg", "part": "Vocabulary", "title": "Synonyms of important: choose the nuance", "type": "mcq", "instr": "Choose the word that fits the nuance best.", "items": [{"q": "Signing the contract was a ___ decision for the company: its consequences will last decades.", "o": ["momentous", "requisite", "urgent"], "a": 0, "why": ""}, {"q": "Honesty is ___ in any decision: nothing matters more.", "o": ["paramount", "notable", "leading"], "a": 0, "why": ""}, {"q": "There is an ___ shortage of nurses: the situation is urgent and severe.", "o": ["acute", "historic", "weighty"], "a": 0, "why": ""}, {"q": "She has the ___ skills for the post.", "o": ["requisite", "grave", "burning"], "a": 0, "why": ""}, {"q": "Housing is the ___ issue for young people right now.", "o": ["burning", "virtuous", "requisite"], "a": 0, "why": ""}, {"q": "Safety is our ___ concern: it comes before everything else.", "o": ["overriding", "notable", "leading"], "a": 0, "why": ""}, {"q": "Her ___ manners impressed the interviewers.", "o": ["impeccable", "momentous", "acute"], "a": 0, "why": ""}, {"q": "The charity's ___ efforts reduced local poverty (formal praise).", "o": ["laudable", "grave", "urgent"], "a": 0, "why": ""}]}, {"id": "vg8", "sec": "vg", "part": "Vocabulary", "title": "False friends", "type": "gap", "instr": "Write the word that should replace the false friend in CAPITALS.", "items": [{"q": "I ACTUALLY live in Madrid, but I'm thinking of moving next year. → ___", "a": ["currently", "now"]}, {"q": "She's very SENSIBLE — she cries at romantic films. → ___", "a": ["sensitive"]}, {"q": "I need to ASSIST a meeting at 3 pm. → ___", "a": ["attend"]}, {"q": "He didn't REALISE the experiment — his assistant did. → ___", "a": ["carry out", "do", "conduct"]}, {"q": "I EVENTUALLY go to the gym when I have time. → ___", "a": ["occasionally", "sometimes"]}, {"q": "I can't SUPPORT the noise from the building site. → ___", "a": ["stand", "put up with", "tolerate", "bear"]}, {"q": "Housing is a major PREOCCUPATION for young people. → ___", "a": ["concern"]}]}, {"id": "vg9", "sec": "vg", "part": "Vocabulary", "title": "Travel vocabulary: right or wrong?", "type": "gap", "instr": "If the word in CAPITALS is wrong, write the correct one. If it's right, write 'correct'.", "items": [{"q": "Salzburg is one of the most PICTUREFUL cities in Europe.", "a": ["picturesque"]}, {"q": "If you could go IN holiday anywhere, where would you go?", "a": ["on"]}, {"q": "What time are you SETTING AWAY tomorrow?", "a": ["setting off"]}, {"q": "The resort was far too TOURISTIC for us.", "a": ["touristy"]}, {"q": "Relaxing by the pool is the perfect way to CHILL DOWN.", "a": ["chill out"]}, {"q": "There are some very REMOVED beaches on the island.", "a": ["remote", "secluded"]}, {"q": "The best way to SOAK the local atmosphere is to walk.", "a": ["soak up"]}, {"q": "He can't wait to go on holiday and RENEW his batteries.", "a": ["recharge"]}, {"q": "I think the cathedral is OVERSTATED.", "a": ["overrated"]}, {"q": "The town is very LIFELY at this time of year.", "a": ["lively"]}, {"q": "We need to GET AWAY FROM IT ALL.", "a": ["correct"]}, {"q": "Our hotel is completely off the BITTEN track.", "a": ["beaten"]}]}, {"id": "vg10", "sec": "vg", "part": "Vocabulary", "title": "Idioms: right or wrong?", "type": "judge", "instr": "Is the expression in CAPITALS used correctly?", "items": [{"q": "I completely SEE EYE TO EYE with my boss — we argue constantly.", "a": false, "why": "See eye to eye = agree."}, {"q": "Before buying a house, you should WEIGH UP the advantages and disadvantages.", "a": true, "why": ""}, {"q": "I'm completely ON THE FENCE about moving — I've already bought my ticket.", "a": false, "why": "On the fence = undecided."}, {"q": "She always GOES THE EXTRA MILE for her clients — she does the absolute minimum.", "a": false, "why": "It means doing MORE than expected."}, {"q": "The lecture gave me a lot of FOOD FOR THOUGHT — I've been thinking about it all week.", "a": true, "why": ""}, {"q": "He's been OUT OF WORK for two years, yet he keeps getting promoted.", "a": false, "why": "Out of work = unemployed."}, {"q": "The company's REVENUE fell, so they hired fifty new staff.", "a": false, "why": "Revenue = income from sales; falling revenue → no hiring."}, {"q": "Her schedule is so HECTIC that she has whole afternoons free.", "a": false, "why": "Hectic = no free time."}, {"q": "Losing that job was A BLESSING IN DISGUISE: I found a much better one.", "a": true, "why": ""}, {"q": "The drawbacks OUTWEIGH the benefits, so it's definitely worth doing.", "a": false, "why": "The heavier thing goes first: drawbacks win → not worth it."}]}, {"id": "vgidiom", "sec": "vg", "part": "Vocabulary", "title": "What does it mean?", "type": "mcq", "instr": "Choose the meaning of each expression.", "items": [{"q": "a double-edged sword", "o": ["something with pros and cons", "a dangerous person", "a final decision"], "a": 0, "why": ""}, {"q": "to cut corners", "o": ["to save money by doing things badly", "to take a shortcut home", "to reduce a budget fairly"], "a": 0, "why": ""}, {"q": "the tip of the iceberg", "o": ["a small visible part of a bigger problem", "the best part of something", "a cold reception"], "a": 0, "why": ""}, {"q": "to bite the bullet", "o": ["to face something unpleasant at once", "to get angry", "to avoid a problem"], "a": 0, "why": ""}, {"q": "to be the third wheel", "o": ["to be the unwanted extra person with a couple", "to be a backup plan", "to be very useful"], "a": 0, "why": ""}, {"q": "a gut feeling", "o": ["an intuition", "a stomach ache", "a strong opinion based on data"], "a": 0, "why": ""}, {"q": "to nip something in the bud", "o": ["to stop it at an early stage", "to make it grow", "to postpone it"], "a": 0, "why": ""}, {"q": "to beat about the bush", "o": ["to avoid saying something directly", "to work outdoors", "to win easily"], "a": 0, "why": ""}]}, {"id": "vgphr", "sec": "vg", "part": "Vocabulary", "title": "Phrasal verbs", "type": "gap", "instr": "Complete with the right particle(s).", "items": [{"q": "The match was called ___ because of the rain.", "a": ["off"]}, {"q": "She turned ___ the job offer.", "a": ["down"]}, {"q": "Experts have ruled ___ a quick recovery.", "a": ["out"]}, {"q": "Transport accounts ___ 30% of emissions.", "a": ["for"]}, {"q": "She takes ___ her father: same eyes, same temper.", "a": ["after"]}, {"q": "I've taken ___ running this year.", "a": ["up"]}, {"q": "I can't tell the twins ___.", "a": ["apart"]}, {"q": "He turned ___ two hours late.", "a": ["up"]}, {"q": "Many young people look ___ ___ their mentors.", "a": ["up to"]}, {"q": "We need to come ___ ___ a better plan.", "a": ["up with"]}, {"q": "They argued but made ___ the next day.", "a": ["up"]}, {"q": "I'm trying to cut ___ ___ sugar.", "a": ["down on"]}]}, {"id": "sp1", "sec": "sp", "part": "Part 1", "title": "Interview: 6 questions", "type": "speak", "instr": "Answer each question for 30 seconds. Record yourself on your phone. Expand every answer: reason + example + detail, and use 1–2 C1 words.", "questions": ["Thinking about friends, how important is it for friends to share the same interests?", "Compare your life today with five years ago. How is it different?", "If you could travel anywhere in the world, where would you go and why?", "Who has had the greatest influence on your life?", "What is the best piece of advice you have ever been given?", "Do you think it's important to have a daily routine? Why or why not?"], "prep": 10, "talk": 30, "phrases": "Well, I guess it depends on… · If I were…, I would… · Looking back, … · To be honest, … · I'd say that… · That said, …", "checklist": ["I spoke for the full 30 seconds", "I gave a reason AND an example", "I used a conditional (2nd or 3rd)", "I avoided good / nice / very", "I didn't answer with yes/no only"]}, {"id": "sptopics", "sec": "sp", "part": "Part 1", "title": "Random topic from your prepared list", "type": "speak", "instr": "Press 'New topic' and talk for 30 seconds (Part 1) or press the 2-minute timer for a longer answer (Part 4 practice).", "questions": ["Tell me about a book that has also been made into a film or series.", "Describe a sport or activity you enjoy and one you dislike.", "Describe a place you enjoy going to on holiday.", "What is your favourite gadget and why?", "Describe a job you would love and one you would hate.", "Tell me about a hobby you like and one you don't.", "Which two languages would you like to learn and why?", "What are two activities you like doing in your free time?", "What is your favourite shop?", "Which two countries would you like to visit or live in?", "What is your favourite possession?", "What is your favourite food and cuisine?"], "random": true, "prep": 10, "talk": 30, "phrases": "I'm an avid… · I like nothing more than… · It has great sentimental value · It's a real hidden gem · It helps me unwind", "checklist": ["I named something concrete in English", "I gave a reason and a short anecdote", "I used 4–5 words from the topic kit"]}, {"id": "sp2", "sec": "sp", "part": "Part 2", "title": "Voice message: cancel a meeting", "type": "speak", "instr": "You study at college. You had arranged to meet your tutor today to discuss your final project, but you now have to cancel. Leave a voice message and: give a reason for cancelling · say how you feel about cancelling · explain why it is important to rearrange quickly.", "questions": ["Leave your voice message now."], "prep": 10, "talk": 40, "phrases": "I'm afraid I won't be able to… · I'm really sorry to cancel at such short notice · I wonder if we could possibly rearrange… · I'd really appreciate it if… · I do apologise for any inconvenience", "checklist": ["I covered all three points", "I sounded diplomatic, not abrupt", "I proposed a new time", "I avoided 'I am concern' / 'look forward for'"], "model": "Hello Dr Lewis, it's Marina Santos. I'm afraid I won't be able to make our meeting this afternoon: my grandmother has just been taken to hospital and I need to be with my family. I'm really sorry to cancel at such short notice, especially as I know how busy you are. I wonder if we could possibly rearrange for early next week, as the deadline is approaching and I'd really appreciate your feedback before I submit the draft. Apologies again for any inconvenience."}, {"id": "sp2b", "sec": "sp", "part": "Part 2", "title": "Voice message: decline an invitation", "type": "speak", "instr": "A colleague has invited you to give a talk at her department's conference next month, but you can't do it. Leave a voice message: thank her · explain why you can't accept · suggest an alternative.", "questions": ["Leave your voice message now."], "prep": 10, "talk": 40, "phrases": "Thank you so much for the kind invitation, but I'm afraid… · Under normal circumstances I would love to… · Have you considered…? · It might be worth asking…", "checklist": ["I thanked her warmly", "I gave a clear but polite reason", "I suggested an alternative (another date, another speaker)"], "model": "Hi Laura, it's Marina. Thank you so much for the kind invitation to speak at the conference — I'm genuinely flattered. Under normal circumstances I would love to, but sadly I'll be sitting my final exams that week and I simply couldn't prepare a talk to the standard it deserves. Have you considered asking Pablo? He presented similar research last spring and I'm sure he'd do a brilliant job. Alternatively, if there's a later event, I'd be delighted to take part then. Thanks again for thinking of me."}, {"id": "sp3", "sec": "sp", "part": "Part 3", "title": "Oral summary: two experts on stress", "type": "speakaudio", "instr": "Press Play to hear two experts (read aloud by your browser, once). Take notes. Then you have 40 seconds to prepare and 50 seconds to summarise the points they AGREE on.", "script": [{"s": "N", "t": "Expert one."}, {"s": "F", "t": "People tend to think of stress as the enemy, but in short bursts it's actually one of the body's most useful tools. Before a presentation or a race, a surge of cortisol sharpens attention and speeds up reactions. The problem begins when that alarm never switches off. Chronic stress — the kind that drags on for months — wears down the immune system, disturbs sleep and is linked to heart disease. So the message isn't to eliminate stress, but to make sure the body gets the chance to recover."}, {"s": "N", "t": "Expert two."}, {"s": "M", "t": "In my clinic I see the same pattern again and again. A deadline or an exam gives people a boost; they perform better than they expected. But when pressure becomes the background noise of their lives, it takes a real toll — headaches, exhaustion, and in some cases depression. What helps most isn't avoiding challenges altogether; it's building in proper breaks: sleep, exercise, time with friends. Recovery is what turns stress from something harmful into something that makes us stronger."}], "prep": 40, "talk": 50, "phrases": "Both experts discussed… · The first key point they agreed on was that… · However, they also emphasised that… · Overall, their message was that…", "checklist": ["I gave TWO main points", "Each point had one supporting detail", "I combined the experts (Both agreed…)", "I paraphrased (no 'surge of cortisol', no 'background noise')", "I spoke for close to 50 seconds"], "model": "Both experts discussed the effects of stress on our health. The first key point they agreed on was that short-term stress can be beneficial: when we face a challenge such as an exam or a presentation, it helps us concentrate and perform better. However, they also emphasised that long-lasting stress is harmful, as it weakens the body and can lead to illnesses such as heart problems or depression. Overall, their message was that we shouldn't try to avoid pressure completely, but rather make sure we have enough rest and recovery time."}, {"id": "sp4", "sec": "sp", "part": "Part 4", "title": "Debate: shorter working hours", "type": "speak", "instr": "Statement: 'Shorter working hours would be a good thing for society.' Use 2 or 3 of these ideas: work-life balance · productivity · health and well-being · economic impact · environmental benefits.", "questions": ["Present your case now."], "prep": 45, "talk": 120, "phrases": "I'm going to present a case to support this statement · First of all… Some might argue that…, but… · Not to mention that… · Another important point in favour of… · All things considered, …", "checklist": ["I stated my position in the first 5 seconds", "I included a concession + refutation", "I used 2 C1 structures (inversion, the… the…, inverted conditional, cleft)", "I closed with 'All things considered' + three adjectives", "I reached 2 minutes without going blank"], "model": "I'm going to present a case in support of this statement. I'm convinced that reducing working hours would benefit employees, companies and society as a whole. First of all, a shorter week is intrinsically linked to productivity. Companies that have trialled a four-day week found that output held up, largely because unnecessary meetings disappeared. The less exhausted employees are, the more focused they become. Some might argue that certain sectors, like hospitals, would need more staff, but that is a cost to be debated, not an impossibility. Not to mention the impact on health: burnout is one of the main causes of sick leave, so fewer hours would mean fewer absences and lower costs. Another important point in favour is work-life balance: parents could spend more time with their children, which has a knock-on effect on the next generation. All things considered, shorter working hours would create a healthier, more productive and more humane society."}, {"id": "sp4b", "sec": "sp", "part": "Part 4", "title": "Debate: ban cars from city centres", "type": "speak", "instr": "Statement: 'Cities should ban private cars from their centres.' Ideas: public health · local businesses · public transport · personal freedom.", "questions": ["Present your case now."], "prep": 45, "talk": 120, "phrases": "…can't be viewed in isolation · …have a knock-on effect on… · Given the…, it's highly likely that… · We have a clear precedent for this in…", "checklist": ["Introduction + central premise", "Argument 1 connects two factors", "Argument 2 adds a second layer", "Conclusion ties back to the premise"]}, {"id": "sp4c", "sec": "sp", "part": "Part 4", "title": "Debate: advertising aimed at children", "type": "speak", "instr": "Statement: 'Advertising aimed at children should be banned.' Ideas: consumer pressure · parental responsibility · commercial freedom.", "questions": ["Present your case now."], "prep": 45, "talk": 120, "phrases": "It is not… but… that we should worry about · By running constant campaigns, advertisers manufacture needs… · Admittedly…, however…", "checklist": ["Position in the first 5 seconds", "Concession ('Some might argue that…, but…')", "Two C1 structures", "Tricolon close", "Full 2 minutes"]}, {"id": "sp5", "sec": "sp", "part": "Part 5", "title": "Follow-up questions: working hours", "type": "speak", "instr": "Answer each question for 40 seconds. Speculate, hypothesise and make critical comments.", "questions": ["Do you think technology has made people work more or less? Why?", "How might working patterns change in the next 20 years?", "Some people say that being busy is a sign of success. Do you agree?", "Should governments set limits on how many hours people can work?"], "prep": 5, "talk": 40, "phrases": "This could potentially lead to… · It's hard to say, but I'd imagine… · In the long run, we may well see… · I see why people might think that, but… · I've got mixed feelings about…", "checklist": ["I used a modal of speculation (could well, might well have)", "I used a conditional", "I disagreed diplomatically at least once", "I expressed a feeling (It worries me that… / It's encouraging to see…)"]}, {"id": "sp28", "sec": "sp", "part": "Toolkit", "title": "Match the diplomatic function", "type": "match", "instr": "Match each phrase with its function.", "opts": ["A · Showing empathy", "B · Disagreeing politely", "C · Rearranging a meeting", "D · Declining an invitation", "E · Proposing an alternative", "F · Refusing a request"], "items": [{"q": "'I wonder if… is entirely correct.'", "a": "B", "why": ""}, {"q": "'That's an interesting perspective…'", "a": "A", "why": ""}, {"q": "'Have you thought about considering an alternative?'", "a": "E", "why": ""}, {"q": "'Thank you for the kind invitation, but I'm afraid…'", "a": "D", "why": ""}, {"q": "'I wonder if we could possibly rearrange…?'", "a": "C", "why": ""}, {"q": "'I'm afraid due to [reason], I won't be able to…'", "a": "F", "why": ""}]}, {"id": "sp29", "sec": "sp", "part": "Toolkit", "title": "Order the debate macrostructure", "type": "match", "instr": "Statement: 'Cities should ban private cars from their centres.' Put the four elements in order (1–4).", "opts": ["1", "2", "3", "4"], "items": [{"q": "Conclusion — restate the central premise ('All things considered…')", "a": "4", "why": ""}, {"q": "Argument 2 — secondary supporting layer ('…have a knock-on effect on…')", "a": "3", "why": ""}, {"q": "Introduction & framing — define the topic and central premise", "a": "1", "why": ""}, {"q": "Argument 1 — connect the ideas ('…can't be viewed in isolation')", "a": "2", "why": ""}], "model": "Traffic congestion and pollution can't be viewed in isolation from public health — they are intrinsically linked. Furthermore, restricting cars would have a knock-on effect on local businesses, encouraging investment in public transport. All things considered, banning private cars from city centres would bring far more benefits than drawbacks."}, {"id": "sp30", "sec": "sp", "part": "Toolkit", "title": "Speculate using the right timeframe", "type": "gap", "instr": "Complete with the structure indicated.", "items": [{"q": "(past speculation, perfect modal) Global warming ___ less dramatic without industrial farming.", "a": ["might well have been", "could well have been", "might have been", "could have been"]}, {"q": "(3rd conditional) If we ___ so much land, the destruction wouldn't have been so extensive.", "a": ["hadn't needed", "had not needed"]}, {"q": "(present/future modal) We ___ a rapid improvement in biodiversity.", "a": ["could well see", "may well see", "might well see"]}, {"q": "(2nd conditional) If we ___ eating meat, we would see huge disruption.", "a": ["stopped"]}, {"q": "(probability adverb) We ___ will need to reduce consumption.", "a": ["almost certainly"]}]}, {"id": "li31", "sec": "li", "part": "Part 1", "title": "Part 1 · Short extracts (2.01)", "type": "listenset", "instr": "Read the question, press Play (each clip can be played twice), then answer. Open the transcript only afterwards.", "clips": [{"q": "A luxury-soap maker is talking about opening a shop. She has decided to open a shop now because…", "o": ["finding experienced staff is straightforward.", "interest in handmade products is increasing.", "running costs and expenses are relatively low."], "a": 2, "why": "'premises and business rates have been driven down substantially… and that's what I want to take advantage of'. A is the opposite: staff is the biggest challenge. B: she talks about surviving shops, not growing interest.", "script": [{"s": "F", "t": "When I first announced to friends that I was thinking of opening a real-life retail outlet for the soap I'd been creating and selling online for several years, the initial reaction was generally one of utter disbelief. To some extent, they have a point — after all, Internet shopping's stripped town centres of many well-known names. Where I live, though, small independent stores selling locally crafted goods have managed to hang on largely intact, thanks to the constant stream of tourists passing through. An unexpected bonus that Internet shopping has indirectly provided is that premises and business rates have been driven down substantially as councils struggle to keep town and city centres alive, and that's what I want to take advantage of. Funnily enough, the greatest challenge in getting the business up and running has been recruiting shop assistants who actually know what a till is and how it works."}]}, {"q": "A radio discussion about moving to the countryside. What aspect of her new life did the woman struggle with?", "o": ["the attitude of her neighbours", "the slower pace of life", "the lack of an established routine"], "a": 2, "why": "'I effortlessly filled my time doing anything but write' + 'that sense of getting somewhere' = she lacked structure. A: neighbours are private, but that's not her struggle. B: she loved it ('I indulged in my new-found freedom').", "script": [{"s": "M", "t": "Have you ever been tempted by a simpler way of living, outside the confines of the city? Our first caller, Monica, left a high-flying London existence for rural Wales to try her hand as a novelist. Was it worth it, Monica?"}, {"s": "F", "t": "The move? Unquestionably. The career switch, less so. Clearly, not everyone has a book in them. I indulged in my new-found freedom from the stress of the commute and the long hours in a bustling office, to the extent that I effortlessly filled my time doing anything but write. People here are very private, and cautious about opening up to someone like me who might be off at the drop of a hat, but I wanted to put down roots here. So, for the sake of a regular salary, and that sense of getting somewhere, I opted to abandon writing and take up my old job but working online."}]}, {"q": "A professor is giving an interview about a writing challenge. How does he feel about the challenge?", "o": ["He applauds its main objective.", "He is impressed by those who complete it.", "He welcomes this way of finding new authors."], "a": 0, "why": "'that's not really the point. It's about getting your first draft down on paper'. C is explicitly ruled out; B is a number trap (10%).", "script": [{"s": "F", "t": "Professor, tell us about National Novel Writing Month."}, {"s": "M", "t": "The challenge is to write a 50,000-word novel in a month. I haven't tried it, but I've got colleagues who have. Most didn't finish! In fact, only 10% do!"}, {"s": "F", "t": "And have any of those had their novels published?"}, {"s": "M", "t": "Well, it's not entirely unheard of, but that's not really the point. It's about getting your first draft down on paper — something most writers struggle with. Once the challenge is finished, you can start editing your draft into what will hopefully become a decent novel. And even if it doesn't, you've discovered a lot about writing — and about yourself as a writer — in the process."}]}]}, {"id": "li204", "sec": "li", "part": "Part 1", "title": "Part 1 · Short extracts (2.04) — from your class photos", "type": "listenset", "instr": "Five new short extracts from your course book. Play, answer, then check.", "clips": [{"q": "A student is telling a friend about a computer club. Why is she dissatisfied with the club?", "o": ["Other members tend to be uncommunicative.", "The resources that it provides are inadequate.", "There are few opportunities to learn from others."], "a": 2, "why": "She hoped collaborative projects would make her 'a bit more of an expert, but everyone just seems to get on with their own thing'. A is ruled out ('it's pretty lively and I can hardly get a word in edgeways'); B is the opposite ('they have all the latest stuff').", "script": [{"s": "F", "t": "I've started going to the university computer club."}, {"s": "M", "t": "Oh? How's that been?"}, {"s": "F", "t": "Hmmm, the jury's still out, but I'll give it a few more tries. I mean, they have all the latest stuff there. I didn't even know half of it existed!"}, {"s": "M", "t": "All that goes right over my head!"}, {"s": "F", "t": "Mine too, to an extent, and part of why I went is because I imagined that with all the collaborative projects that I thought members would do at the club, I'd end up being a bit more of an expert, but everyone just seems to get on with their own thing. Don't get me wrong — it's pretty lively and I can hardly get a word in edgeways at times. It's just not quite what I was hoping for, I guess."}]}, {"q": "A professor is giving a lecture about robots. What does he consider to be of particular significance?", "o": ["the rapid advance of robotic technology", "the relationship between humans and robots", "the influence of film on our perception of robots"], "a": 1, "why": "'have you found yourself naming and talking to it? Would you feel guilty if you broke it? Now, the science behind those questions is critical'. C (films) is context; A is mentioned at the very end as background.", "script": [{"s": "M", "t": "If I ask whether you have a robot at home, you'll probably say 'no', presumably because you're picturing an android — a robot that resembles a person — the kind that TV movies and cinema have made so familiar to us. And yet, you do have robots — your washing machines, for example. Perhaps you even have one of those devices that goes around by itself, quietly hoovering. If so, have you found yourself naming and talking to it? Would you feel guilty if you broke it? Now, the science behind those questions is critical because robots are here to stay and they're becoming more sophisticated all the time."}]}, {"q": "A woman has recently taken up running. How does she feel about it?", "o": ["frustrated with her progress", "disappointed by the lack of support", "doubtful about keeping it up"], "a": 0, "why": "'It was absolute torture, though everyone else made it look so effortless, which really didn't help.' C is ruled out: 'I'm determined that won't be the case this time!'", "script": [{"s": "M", "t": "Emma — are you up for a run later?"}, {"s": "F", "t": "Oh, I thought I'd give it a break today. I did my first three kilometre run yesterday, and I'm paying for it. It was absolute torture, though everyone else made it look so effortless, which really didn't help."}, {"s": "M", "t": "Perhaps you're going too fast?"}, {"s": "F", "t": "Well, no, 'cos I'm following this app which is meant to get you from absolute beginner to running 5k in nine weeks, though whether or not it'll live up to expectations remains to be seen. I know I haven't exactly been great at sticking to exercise regimes, but I'm determined that won't be the case this time!"}]}, {"q": "A history lecturer is talking about research into smells. The most significant objective of the research is…", "o": ["to establish findings that have a commercial application.", "to explore changes in attitudes towards them.", "to find written sources that reveal past impressions of them."], "a": 1, "why": "'Shifts like this are fundamental to our research.' C is the method (searching documents), not the objective; A (tourist attractions) is a possible by-product ('could perhaps').", "script": [{"s": "M", "t": "One of the current research projects involves searching through historical documents to seek references to smells. Smells are very effective at stimulating emotions — think of a rose, for example — but the way people feel about them isn't necessarily constant over time. Coffee, for instance, when first introduced to Europe, would've seemed exotic, but as it gained popularity, the smell became commonplace. Shifts like this are fundamental to our research. The project involves analysing the prevalence of references to smells in different historical contexts as well; the results of this could perhaps provide valuable information for tourist attractions that offer visitors an authentic experience of life in the past."}]}, {"q": "A man is talking about deciding to become a teacher. He suggests he decided to enter the teaching profession after…", "o": ["meeting someone unexpectedly.", "recognising he had the right skill set.", "realising it might be a sensible option."], "a": 0, "why": "Chatting to an ex-classmate at a reunion 'got me seriously thinking about it'. B is ruled out: 'I don't exactly tick all the boxes when it comes to patience and organisation'.", "script": [{"s": "F", "t": "John — I hear you're doing a teacher-training course. That's a surprise!"}, {"s": "M", "t": "Well, you know I studied Chinese at college? Last year we had a reunion, and it was chatting to one of my ex-classmates who's actually already head of languages at a secondary school that got me seriously thinking about it."}, {"s": "F", "t": "Funny, I'd always seen you as something like an interpreter."}, {"s": "M", "t": "Chance would be a fine thing, especially these days."}, {"s": "F", "t": "Still, you're good at explaining things, which I guess is half the battle."}, {"s": "M", "t": "Maybe, though I don't exactly tick all the boxes when it comes to patience and organisation!"}]}]}, {"id": "lixtra", "sec": "li", "part": "Part 1", "title": "Part 1 · Everyday situations — from your class photos", "type": "listenset", "instr": "Five quick everyday extracts. Watch for options that are mentioned and then ruled out.", "clips": [{"q": "A husband and wife are talking about a new fitness class. How does the woman feel about joining the class?", "o": ["anxious about causing herself an injury", "worried that she'll be the oldest member", "concerned that she'll be unable to keep up"], "a": 0, "why": "'just as long as I don't overdo it and end up being off work for weeks. That's the main thing.' 'I'm hardly a teenager' sounds like B, but the main worry is injury.", "script": [{"s": "M", "t": "You've got your extreme fitness class tomorrow, haven't you?"}, {"s": "F", "t": "Yeah. I must have been mad to sign up for it. What was I thinking?"}, {"s": "M", "t": "Well, you said you wanted to challenge yourself."}, {"s": "F", "t": "Oh, it'll be a challenge alright. I mean, I'm hardly a teenager anymore."}, {"s": "M", "t": "Look, it's all about attitude. Tell yourself that you're as good as the others and you will be."}, {"s": "F", "t": "I'll certainly give it my best shot… just as long as I don't overdo it and end up being off work for weeks. That's the main thing."}, {"s": "M", "t": "You'll be fine."}]}, {"q": "A girl is leaving a voicemail message for her father. What does she want her father to do?", "o": ["help her to gather data", "pay an unexpected bill", "call the internet provider"], "a": 2, "why": "'Can you sort it out, please? … let me know what they say.' She mentions research and being charged a lot, but the request is to contact the provider.", "script": [{"s": "F", "t": "Dad, it's Laura, I need you to do me a favour. Our Wi-Fi's gone down again and I really need to get on with my project. I've still got tonnes of research to do and I need some support. It's getting ridiculous… we're being charged a lot for this service. Can you sort it out, please? I don't want to have to go to the library… I know it won't have everything I need. But at this rate I might have no choice. Anyway, let me know what they say. Text me, OK?"}]}, {"q": "A husband and wife are discussing home repairs. The woman says that the man…", "o": ["has to build the bookcase", "ought to try to fix the front door", "needs to focus on the floorboards"], "a": 1, "why": "'the front door seems to be sticking… You sorted out the back one last year, right?' The bookcase is already built ('Someone hasn't been in the study recently!'); a professional is coming for the floorboards.", "script": [{"s": "M", "t": "I'm planning to do some DIY tomorrow. There are a few things that need fixing."}, {"s": "F", "t": "Well, better late than never, as they say."}, {"s": "M", "t": "OK, I'll put that bookcase together, shall I?"}, {"s": "F", "t": "Someone hasn't been in the study recently! Anyway, the front door seems to be sticking. It's probably swollen in the summer heat. You sorted out the back one last year, right?"}, {"s": "M", "t": "That's right. I'll have a go at those loose floorboards, too."}, {"s": "F", "t": "Actually, the guy who fixes those is coming round next week."}, {"s": "M", "t": "Oh, OK."}]}, {"q": "A woman is leaving a message for the manager of a company. What is the main purpose of her message?", "o": ["to request a personal visit", "to ask for her call to be returned", "to enquire about a range of products"], "a": 0, "why": "'I think it would be helpful for you to see the situation for yourself.' She'll look through the catalogue herself and confirm by email, so B and C are not the purpose.", "script": [{"s": "F", "t": "Hello, this is Sylvie Rodriguez speaking. My elderly mother's just come to live with me and she's having some difficulty getting up and down the stairs. I'm thinking of having a stairlift fitted, so she'll be able to manage by herself. You've got quite a selection and there are a few that look promising. I think it would be helpful for you to see the situation for yourself. Meanwhile, I'll have another look through your catalogue to narrow down my options. Anyway, I'll confirm all this in an email. I look forward to your reply."}]}, {"q": "A brother and sister are talking about a science magazine. What is the subject of the article they mention?", "o": ["the planets", "the weather", "the atmosphere"], "a": 1, "why": "'that piece on how lightning forms and its effects' → weather. 'Gases' (atmosphere) and 'solar system' (planets) are distractors.", "script": [{"s": "M", "t": "This new natural science magazine's great!"}, {"s": "F", "t": "Yeah, I thought it looked interesting."}, {"s": "M", "t": "Who knew there was so much going on all around us."}, {"s": "F", "t": "You mean in terms of gases and stuff? It's all a bit complex for me, actually… science never was my best subject."}, {"s": "M", "t": "I know, but it's all explained in a way that you can get your head around. Like that piece on how lightning forms and its effects. You know… the one you read recently."}, {"s": "F", "t": "Our world's amazing, isn't it?"}, {"s": "M", "t": "It is. I find our entire solar system very interesting actually."}]}]}, {"id": "li49", "sec": "li", "part": "Part 1", "title": "Part 1 · New extracts", "type": "listenset", "instr": "The final twist usually marks the answer.", "clips": [{"q": "A woman is talking about a co-working space she used to go to. Why did she stop going?", "o": ["The cost became difficult to justify.", "She found the environment distracting.", "It failed to deliver what she had expected."], "a": 2, "why": "'sold on this idea of a community… not one of those events actually took place'. A is mentioned and ruled out; B (isolation) is why she went, not why she left.", "script": [{"s": "F", "t": "I signed up for a whole year, mostly because I'd been working from my kitchen table and the isolation was starting to get to me. And to be fair, the coffee was excellent and the chairs didn't destroy your back, which is more than I can say for my flat. The membership wasn't cheap, though I'd budgeted for that and it never really bothered me. What did bother me was that the entire thing was sold on this idea of a community — networking evenings, collaboration, all of that — and in eight months not one of those events actually took place. I might as well have been sitting in a library for free."}]}, {"q": "A researcher is talking about urban beekeeping. What point does he make?", "o": ["It has become more widespread than the environment can sustain.", "The public has been misled by conservation charities.", "Bees kept in cities produce less honey than rural ones."], "a": 0, "why": "'several thousand more mouths competing for the same flowers' + 'wild bee species were noticeably scarcer'.", "script": [{"s": "M", "t": "People hear 'save the bees' and put a hive on their roof, which is a lovely impulse and I've no wish to discourage it. The difficulty is that honeybees are livestock — a managed species, not a threatened one — and every new hive in a city means several thousand more mouths competing for the same flowers. Our surveys across three European capitals found that in the districts where hive density was highest, wild bee species were noticeably scarcer. Nobody is suggesting people stop keeping bees. We're suggesting they plant something as well as keeping something."}]}, {"q": "Two friends are discussing a documentary about food waste. What is the man's criticism of it?", "o": ["It offered no practical solutions.", "It directed its message at the wrong audience.", "It relied too heavily on striking images."], "a": 1, "why": "'There were practical tips, plenty of them. Just aimed at entirely the wrong people.' C turns praise into criticism.", "script": [{"s": "F", "t": "Did you get to the end of that food waste documentary?"}, {"s": "M", "t": "Just about. Beautifully shot, I'll give it that."}, {"s": "F", "t": "The supermarket footage was extraordinary."}, {"s": "M", "t": "It was — although by the halfway point I'd worked out exactly where it was going. A full hour telling households to plan their meals better, when a third of the problem never gets anywhere near a household; it's rejected on the farm because the carrots are the wrong shape. There were practical tips, plenty of them. Just aimed at entirely the wrong people."}]}]}, {"id": "li52", "sec": "li", "part": "Part 2", "title": "Part 2 · Note completion: community solar", "type": "listen", "instr": "Before listening, predict the type of word for each gap. Then play the talk and write 1–3 exact words.", "mode": "gap", "script": [{"s": "F", "t": "Good evening, and thank you all for coming. I'll keep this brief because the site tour starts at half past. The Ridgeway scheme began in 2019 and, rather unusually, it wasn't started by the council — it was set up by a group of allotment holders who had simply got tired of waiting. There are now four hundred and twenty members, though I should say that only about a third of those live in the village itself; the rest are scattered across the county."}, {"s": "F", "t": "The panels are mounted on the roofs of three buildings: the leisure centre, the primary school and, since last spring, the fire station. We had hoped to add the library as a fourth, but the survey found the roof wouldn't take the weight."}, {"s": "F", "t": "On the money: members buy shares at fifty pounds each, and the return has averaged four per cent a year, which is modest but has never yet dropped. Anything left over once the return is paid goes into what we call the community fund, and that has so far paid for a minibus."}, {"s": "F", "t": "The biggest single obstacle — and I want to be honest about this — was not planning permission and it wasn't money. It was the grid connection. That took twenty-two months, and it is still the thing that stops most schemes like ours before they start. Finally, if you'd like to join, the next share offer opens in October and closes on the fifteenth of November."}], "items": [{"q": "The scheme was set up by a group of ___.", "a": ["allotment holders"]}, {"q": "Only about ___ of the members live in the village itself.", "a": ["a third", "one third"]}, {"q": "Panels were added to the ___ most recently.", "a": ["fire station"]}, {"q": "The library was ruled out because its roof would not take the ___.", "a": ["weight"]}, {"q": "Money left over after the return is paid goes into the ___.", "a": ["community fund"]}, {"q": "The longest delay was caused by the ___, which took 22 months.", "a": ["grid connection"]}], "why": "Traps: 'the council' is mentioned first and is exactly what it wasn't. Three buildings are listed; only one has 'since last spring'. Two candidates (planning permission, money) are ruled out aloud before the right one. Write the exact words heard: 'a third', not '33%'."}, {"id": "li50", "sec": "li", "part": "Part 3", "title": "Part 3 · Four-day week (Man / Woman / Both)", "type": "listen", "instr": "Decide who expresses each opinion: M (man), W (woman) or B (both).", "mode": "match", "opts": ["M", "W", "B"], "script": [{"s": "F", "t": "So your company's been trialling the four-day week for six months. Verdict?"}, {"s": "M", "t": "Productivity has held up, which was the thing everybody was nervous about beforehand. What nobody predicted was how much of the gain came from simply cancelling meetings. We got rid of about a third of them in the first fortnight and nothing broke."}, {"s": "F", "t": "That doesn't surprise me in the slightest. Every trial I've looked at shows the same thing — the day isn't really 'found', it's recovered from waste that was sitting there the whole time."}, {"s": "M", "t": "Exactly. Though I'd add that it's a great deal harder in some sectors than the coverage tends to admit. It's fine for us, we're a software company. I'd struggle to see how you'd run a hospital ward or a classroom on it without hiring more people."}, {"s": "F", "t": "Well, that's a cost, not an impossibility. If a hospital needs twenty per cent more staff, then that's the price, and we ought to be having the argument about whether it's worth paying rather than pretending the model scales for free."}, {"s": "M", "t": "Fair. What has genuinely surprised me is the recruitment side. We've had four times the applications for every post since we announced it, and the standard is noticeably higher."}, {"s": "F", "t": "I'd be cautious there. That's an advantage that only exists while you're one of the few doing it. Once everyone's on four days, it evaporates."}, {"s": "M", "t": "I hadn't thought of it that way, but you're right."}, {"s": "F", "t": "The thing I keep coming back to is the people it doesn't reach. Anyone on an hourly contract just gets a shorter week and less money."}, {"s": "M", "t": "That's the part of it I find hardest to defend, if I'm honest."}], "items": [{"q": "The improvement came largely from removing unnecessary activity.", "a": "B", "why": "He: cancelling meetings; she: recovered from waste. Same idea, different words."}, {"q": "The model is considerably harder to apply in certain sectors.", "a": "M", "why": "She answers only to reframe it."}, {"q": "The extra staffing required should be treated as a cost to be debated openly.", "a": "W", "why": ""}, {"q": "The advantage in attracting applicants is only temporary.", "a": "W", "why": "His 'you're right' doesn't make it Both."}, {"q": "Workers paid by the hour stand to lose out.", "a": "B", "why": "She raises it; he accepts it as the hardest part to defend: real agreement."}, {"q": "Fears about a drop in output turned out to be unfounded.", "a": "M", "why": ""}]}, {"id": "li203", "sec": "li", "part": "Part 3", "title": "Part 3 · Clothes from recycled plastic (2.03) — from your class photos", "type": "listen", "instr": "Two fashion journalists discuss clothing made from recycled plastic. Match the opinions to the man (M), the woman (W) or both (B).", "mode": "match", "opts": ["M", "W", "B"], "script": [{"s": "M", "t": "Hi, I'm fashion journalist Ronnie Callow, and I'm delighted to welcome fellow writer Elena Bartlett to this week's podcast, in which we'll be discussing clothing made from recycled plastic. Elena, a few of the groundbreaking companies who have built their identities around this kind of clothing generate so much excitement on social media…"}, {"s": "F", "t": "I'd say there was certainly an astonishing amount of initial interest when they first appeared on the fashion scene, and all sorts of predictions that they'd take the world by storm. These haven't really materialised, though, for one reason or another, and it's something of a rarity to see celebrities or even people in the street wearing them."}, {"s": "M", "t": "Well, whatever the fact of the matter is, clothing's certainly being made from some unusual things these days — old plastic fishing nets, for example."}, {"s": "F", "t": "For sure, and plastic bottles are commonly recycled and repurposed into synthetic fabrics. I guess the sky's the limit in terms of what you can transform into clothing…"}, {"s": "M", "t": "Actually, my understanding is that the type and grade of plastic required is harder to come by than people perhaps imagine, so diverting the entire contents of our recycling bins to create materials suitable for clothing is unlikely to be happening anytime soon."}, {"s": "F", "t": "We'll see, but what's for sure is that the processes involved in transforming plastic into fabric aren't straightforward, so…"}, {"s": "M", "t": "This is what troubles me somewhat about recycling plastic into clothing. I wonder whether it gives the rather misleading impression that manufacturers and ret
