<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Oxford-blue study book: cool grey desk, white sheets, highlighter accents */
  --desk:#eef1f6; --sheet:#ffffff; --ink:#18233a; --muted:#5b667a; --line:#dde3ec;
  --primary:#0b2d5b; --primary-2:#1f4f96; --hl:#ffe08a; --hl-ink:#3a2c00;
  --trap:#c2384f; --tip:#1f7a8c; --mine:#6c4ab6; --model:#2f7d4a; --score:#b5651d;
  --c-vg:#0b2d5b; --c-sp:#c2384f; --c-li:#1f7a8c; --c-re:#b5651d; --c-wr:#6c4ab6; --c-mo:#46536b; --c-my:#0f7a5a;
  --ok:#2f7d4a; --bad:#c2384f; --soft:#f4f6fa; --shadow:0 1px 2px rgba(16,30,60,.06),0 8px 24px rgba(16,30,60,.08);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0c1320; --sheet:#141d2d; --ink:#e4e9f2; --muted:#9aa6ba; --line:#26334a;
  --primary:#9fc0ff; --primary-2:#c3d7ff; --hl:rgba(255,214,102,.28); --hl-ink:#ffe7a8;
  --trap:#ff7d8f; --tip:#5cc6d8; --mine:#b9a2ff; --model:#6fcf8d; --score:#f0a868;
  --c-vg:#9fc0ff; --c-sp:#ff7d8f; --c-li:#5cc6d8; --c-re:#f0a868; --c-wr:#b9a2ff; --c-mo:#a8b4c8; --c-my:#5fd3a8;
  --ok:#6fcf8d; --bad:#ff7d8f; --soft:#1a2436; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0c1320; --sheet:#141d2d; --ink:#e4e9f2; --muted:#9aa6ba; --line:#26334a;
  --primary:#9fc0ff; --primary-2:#c3d7ff; --hl:rgba(255,214,102,.28); --hl-ink:#ffe7a8;
  --trap:#ff7d8f; --tip:#5cc6d8; --mine:#b9a2ff; --model:#6fcf8d; --score:#f0a868;
  --c-vg:#9fc0ff; --c-sp:#ff7d8f; --c-li:#5cc6d8; --c-re:#f0a868; --c-wr:#b9a2ff; --c-mo:#a8b4c8; --c-my:#5fd3a8;
  --ok:#6fcf8d; --bad:#ff7d8f; --soft:#1a2436; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--primary-2)}
.sr{position:absolute;left:-9999px}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;background:none;border:0;padding:0}
.brand-mark{width:38px;height:34px;border-radius:8px;background:var(--primary);color:var(--sheet);display:grid;place-items:center;font:700 12px var(--f-display);letter-spacing:.02em}
.brand-t{font:600 18px/1 var(--f-display)}
.brand-s{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--primary);color:var(--sheet)}
.nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--hl);color:var(--hl-ink);font-size:12px}
.search{margin-left:auto;position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.results{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:40}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button.act{background:var(--soft)}
.results .r-k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.results .r-t{font-weight:600}
.results .r-s{font-size:13px;color:var(--muted)}

main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}

/* ---------- home */
.home-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.hero-t{font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin-bottom:8px}
.hero-p{color:var(--muted);max-width:60ch;margin:0 0 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--primary-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--sheet)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scores h3{font-size:18px;margin-bottom:4px}
.scores .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.sbar{display:grid;grid-template-columns:90px 1fr 54px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.sbar .track{position:relative;height:12px;background:var(--soft);border-radius:6px;overflow:visible}
.sbar .fill{height:100%;border-radius:6px;background:var(--primary-2)}
.sbar .fill.low{background:var(--trap)} .sbar .fill.ok{background:var(--ok)}
.sbar .c1{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.sbar b{font-variant-numeric:tabular-nums;text-align:right}
.legend{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.tile{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px 20px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc)}
.tile:hover{border-color:var(--cc)}
.tile .code{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--cc);color:var(--sheet);font:700 13px var(--f-display);margin-bottom:8px}
.tile h3{font-size:19px}
.tile p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cc,var(--primary-2))}
.tile .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sect-h h2{font-size:22px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.quick .panel{padding:16px}
.quick .big{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.quick .lbl{color:var(--muted);font-size:14px;margin:4px 0 10px}
.priority{border-left:4px solid var(--c-sp)}

/* ---------- book layout */
.book{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.chtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:2}
.chtabs button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 4px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.chtabs button.on{background:var(--cc);border-color:var(--cc);color:var(--sheet)}
.chtabs button span{display:block;font-weight:500;font-size:11px}
.toc{padding:6px 6px 12px}
.toc .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.toc button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--ink)}
.toc button:hover{background:var(--soft)}
.toc button.on{background:color-mix(in srgb,var(--cc) 14%,transparent);font-weight:600}
.toc .pn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:20px;flex:none}
.toc .tt{flex:1}
.toc .ic{display:flex;gap:3px;flex:none}
.ic-bm{width:9px;height:12px;background:var(--trap);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.ic-ok{width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:grid;place-items:center}
.ic-sc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

.sheetwrap{min-width:0}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px 16px 16px 6px;box-shadow:var(--shadow);padding:34px clamp(18px,4vw,52px) 26px;min-height:70vh;border-left:6px solid var(--cc)}
.sheet.flip{animation:flip .28s ease}
@keyframes flip{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet.flip{animation:none}}
.sheet-h{display:flex;justify-content:space-between;gap:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;padding-right:44px}
.sheet h1{font-size:clamp(26px,3vw,34px);line-height:1.12}
.sheet .subt{color:var(--muted);margin:6px 0 20px;font-size:17px}
.ribbon{position:absolute;top:-1px;right:22px;width:30px;height:46px;border:0;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:height .15s,background .15s}
.ribbon:hover{height:52px}
.ribbon.on{background:var(--trap);height:56px}
.content{max-width:78ch}
.content p{margin:0 0 12px}
.content h3{font-size:19px;margin:22px 0 10px}
.content .lead{font-size:18px;line-height:1.55}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;font-weight:600;padding:0 1px}
[data-theme="dark"] .hl,.dk .hl{color:var(--hl-ink)}
s.wrong{color:var(--bad);text-decoration-thickness:2px}
.slot{display:inline-block;min-width:3em;border-bottom:1.5px dashed var(--muted)}
ul.ex,ul.ideas{padding-left:0;list-style:none;margin:0 0 14px}
ul.ex li,ul.ideas li{position:relative;padding:7px 10px 7px 30px;border-bottom:1px dashed var(--line)}
ul.ex li::before{content:"›";position:absolute;left:10px;top:5px;color:var(--cc);font-weight:700;font-size:18px}
ul.ideas li::before{content:"";position:absolute;left:12px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--cc);opacity:.7}
ol.steps-ol{padding-left:22px;margin:6px 0} ol.steps-ol li{margin:5px 0}
.tbl-wrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.box{border:1px solid var(--line);border-left:5px solid var(--bc);border-radius:10px;padding:12px 16px 4px;margin:0 0 16px;background:color-mix(in srgb,var(--bc) 6%,var(--sheet))}
.box.key{--bc:#e0a800} .box.trap{--bc:var(--trap)} .box.tip{--bc:var(--tip)} .box.mine{--bc:var(--mine)} .box.model{--bc:var(--model)} .box.score{--bc:var(--score)} .box.rule{--bc:var(--primary-2)}
.box-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.box-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sheet);background:var(--bc);padding:2px 8px;border-radius:5px}
.box.key .box-tag{color:#3a2c00}
.box-t{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:14px}
.stepgrid{display:grid;gap:10px;margin:0 0 16px}
.step{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.step-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--cc);color:var(--sheet);display:grid;place-items:center;font:700 14px var(--f-display)}
.step-t{font-weight:700}
.step-b{color:var(--ink);font-size:15px}
.cardgrid{display:grid;gap:12px;margin:0 0 16px}
.cardgrid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mini{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
.mini-t{font-weight:700;margin-bottom:6px;color:var(--cc)}
.mini p,.mini ul{margin:0;font-size:15px}
.fixes{display:grid;gap:8px;margin:4px 0 12px}
.fix{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sheet)}
.fx-w{color:var(--bad)} .fx-r{color:var(--ok);font-weight:600} .fx-why{font-size:13px;color:var(--muted);margin-top:2px}
blockquote.model-text{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--model);background:var(--soft);border-radius:0 10px 10px 0;font-size:15.5px}
blockquote cite{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.goto{border:1px solid var(--cc);color:var(--cc);background:none;border-radius:999px;padding:6px 14px;font-weight:600;margin:4px 0 14px}
.goto:hover{background:color-mix(in srgb,var(--cc) 10%,transparent)}

/* deck tables */
.deck{border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.deck-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.deck-h b{font-family:var(--f-display);font-size:17px}
.deck-h .n{color:var(--muted);font-size:13px}
.deck-h .sp{flex:1}
.deck table{font-size:15px}
.deck td:first-child{font-weight:600;width:32%}
.deck td.ex-c{color:var(--muted);font-style:italic;font-size:14px}
.deck.hide td.m-c{color:transparent;text-shadow:0 0 8px var(--muted);cursor:pointer;user-select:none}
.deck.hide td.m-c.show{color:inherit;text-shadow:none}

.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager .pg{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.learn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:none;font-weight:600}
.learn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.notes{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.notes summary{cursor:pointer;font-weight:600;color:var(--muted)}
.notes textarea{width:100%;min-height:110px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);resize:vertical}
.menu-btn{display:none}
.scrim{display:none}

/* ---------- workbook */
.ex-card{background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:6px 16px 16px 6px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,44px)}
.ex-card h1{font-size:clamp(22px,2.6vw,30px)}
.ex-instr{color:var(--muted);margin:6px 0 16px}
.ex-note{font-size:14px;color:var(--mine);margin:8px 0}
.bank{border:1px dashed var(--cc);border-radius:10px;padding:8px 12px;margin:0 0 14px;font-weight:600}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .num{font:700 14px var(--f-display);color:var(--cc);padding-top:3px}
.item input[type=text],.item textarea,.item select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--soft);min-width:0}
.item input[type=text]{width:min(260px,100%)}
.item textarea{width:100%;min-height:62px;margin-top:6px;resize:vertical}
.item .lead-w{font-size:13px;color:var(--muted)}
.ok-f{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 12%,var(--sheet))!important}
.bad-f{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 10%,var(--sheet))!important}
.fb{font-size:14px;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .model{display:block;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:4px}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--sheet)}
.opt:hover{border-color:var(--primary-2)}
.opt .l{font:700 13px var(--f-display);color:var(--muted);width:16px;flex:none;padding-top:2px}
.opt.sel{border-color:var(--primary-2);background:color-mix(in srgb,var(--primary-2) 8%,var(--sheet))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--sheet))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--sheet))}
.why{font-size:14px;color:var(--muted);margin-top:6px;border-left:3px solid var(--tip);padding-left:10px}
.jbtns{display:flex;gap:8px;margin-top:6px}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ex-score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.passage{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px;font-size:15.5px}
.passage h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px}
.passage p{margin:0 0 10px}
.passage .gapmark{display:inline-block;background:var(--cc);color:var(--sheet);border-radius:5px;padding:0 7px;font-weight:700;font-size:13px}
.ptext{font-size:15px;background:var(--soft);border-radius:10px;padding:10px 14px;margin:6px 0 8px}
.ptext .pt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.optlist{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.optlist div{padding:4px 0;border-bottom:1px dashed var(--line)} .optlist div:last-child{border:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols2 .stick{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.player .pbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--cc);color:var(--sheet);display:grid;place-items:center}
.player .pinfo{font-size:13px;color:var(--muted)}
.player .eq{display:flex;gap:2px;align-items:flex-end;height:18px}
.player .eq i{width:3px;background:var(--cc);height:30%;border-radius:1px}

.checklist{display:grid;gap:6px;margin:10px 0}

.phr{background:color-mix(in srgb,var(--tip) 8%,var(--sheet));border:1px solid var(--line);border-left:4px solid var(--tip);border-radius:8px;padding:8px 12px;font-size:15px;margin:10px 0}

.reveal{margin-top:10px}

/* ---------- flashcards */
.fc-groups{display:grid;gap:18px}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.fc-bar label{display:flex;gap:6px;align-items:center;font-size:14px}
.study{max-width:720px;margin:0 auto}
.study-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
.face.back{transform:rotateY(180deg)}
.face .deckname{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.face .box-n{position:absolute;top:14px;right:18px;font-size:12px;color:var(--muted)}
.face .term{font:600 clamp(24px,4vw,36px)/1.15 var(--f-display)}
.face .mean{font-size:clamp(18px,2.4vw,22px);font-weight:600}
.face .eg{margin-top:14px;color:var(--muted);font-style:italic;max-width:52ch}
.face .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fc-actions .btn{padding:14px;font-size:17px}
.btn.again{border-color:var(--bad);color:var(--bad)} .btn.got{border-color:var(--ok);background:var(--ok);color:#fff}
.done-card{text-align:center;padding:40px}

/* ---------- bookmarks */
.bm-list{display:grid;gap:10px}
.bm-item{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:10px;padding:12px 14px}

.bm-item .t{font-weight:600}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* ---------- mock */
.mock-launch{margin:4px 0 18px}
.mock-overlay{position:fixed;inset:0;z-index:60;background:var(--desk);overflow:auto}

.mock-top .mp{font-size:14px;opacity:.85}

.mock-top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:inherit}
.mock-body{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.mod{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:5px solid var(--cc)}
.mod h3{font-size:18px}
.mod p{color:var(--muted);font-size:14px;margin:6px 0 0}
.mod .res{margin-top:8px;font-weight:700}
.resrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}

@media (max-width:900px){

ride", "m": "rode – ridden · montar", "e": ""}, {"t": "rise", "m": "rose – risen · alzarse", "e": ""}, {"t": "write", "m": "wrote – written · escribir", "e": ""}, {"t": "beat", "m": "beat – beaten · vencer", "e": ""}, {"t": "bite", "m": "bit – bitten · morder", "e": ""}, {"t": "hide", "m": "hid – hidden · esconder", "e": ""}, {"t": "eat", "m": "ate – eaten · comer", "e": ""}, {"t": "fall", "m": "fell – fallen · caer", "e": ""}, {"t": "forget", "m": "forgot – forgotten · olvidar", "e": ""}, {"t": "forgive", "m": "forgave – forgiven · perdonar", "e": ""}, {"t": "forbid", "m": "forbade – forbidden · prohibir", "e": ""}, {"t": "shake", "m": "shook – shaken · agitar", "e": ""}, {"t": "give", "m": "gave – given · dar", "e": ""}, {"t": "take", "m": "took – taken · coger", "e": ""}, {"t": "blow", "m": "blew – blown · soplar", "e": ""}, {"t": "draw", "m": "drew – drawn · dibujar", "e": ""}, {"t": "grow", "m": "grew – grown · crecer", "e": ""}, {"t": "know", "m": "knew – known · saber", "e": ""}, {"t": "show", "m": "showed – shown · mostrar", "e": ""}, {"t": "throw", "m": "threw – thrown · tirar", "e": ""}, {"t": "fly", "m": "flew – flown · volar", "e": ""}, {"t": "begin", "m": "began – begun · empezar", "e": ""}, {"t": "drink", "m": "drank – drunk · beber", "e": ""}, {"t": "shrink", "m": "shrank – shrunk · encoger", "e": ""}, {"t": "sink", "m": "sank – sunk · hundir", "e": ""}, {"t": "swim", "m": "swam – swum · nadar", "e": ""}, {"t": "ring", "m": "rang – rung · sonar", "e": ""}, {"t": "sing", "m": "sang – sung · cantar", "e": ""}, {"t": "spring", "m": "sprang – sprung · saltar, surgir", "e": ""}, {"t": "run", "m": "ran – run · correr", "e": ""}, {"t": "come", "m": "came – come · venir", "e": ""}, {"t": "become", "m": "became – become · convertirse", "e": ""}, {"t": "lie (tumbarse)", "m": "lay – lain · echarse (≠ lie, lied, lied = mentir)", "e": ""}, {"t": "swell", "m": "swelled – swollen · hincharse", "e": ""}, {"t": "bear", "m": "bore – borne · soportar (borne out = demostrado)", "e": ""}]}], "pages": [{"id": "vg-start", "ch": "vg", "part": "Grammar", "title": "How to use this chapter", "sub": "Range + accuracy = C1", "html": "<p class=\"lead\">Your vocabulary and grammar are not tested in a separate Use of English paper. They are marked <b class=\"hl\">inside Writing and Speaking<\/b>, where the examiner rewards <b class=\"hl\">range<\/b> (varied structures and words) used with <b class=\"hl\">control<\/b>.<\/p><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Grammar pages<\/div><p>Fifteen structures that separate a high B2 from a C1. Aim to produce 3–4 of them naturally in every essay and in the debate.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Vocabulary pages<\/div><p>Upgrades, synonyms, collocations, phrasal verbs, idioms, connectors, register and topic words. Every table can be studied as flashcards.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Ideas by topic<\/div><p>Ready-made arguments so you never go blank in the essay or the 2-minute debate.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Your notebook<\/div><p>Words and rules from your own class notes (Héctor's lessons and your handwritten pages) are collected in their own pages.<\/p><\/div><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">The C1 formula<\/span><\/div><p>Advanced concession + inversion + reduced relative clause + hedging + cleft sentence. Combining several of these in one paragraph is the mark of a very high C1.<\/p><blockquote class=\"model-text\">Much as AI offers productivity gains, it is not without risks. <b class=\"hl\">Not only can<\/b> algorithms process data at unprecedented speeds, <b class=\"hl\">but<\/b> they <b class=\"hl\">also<\/b> enable breakthroughs. However, evidence, <b class=\"hl\">collected from numerous studies<\/b>, <b class=\"hl\">suggests<\/b> that benefits <b class=\"hl\">may not<\/b> be evenly distributed.<\/blockquote><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Don't overreach<\/span><\/div><p>An expensive word used wrongly costs more than a simple word used well. Use only the structures you control.<\/p><\/div>", "tags": ""}, {"id": "vg-inversion", "ch": "vg", "part": "Grammar", "title": "Inversions", "sub": "Negative adverb first → question word order", "html": "<p class=\"lead\">When a negative or limiting adverb opens the sentence, the word order inverts as in a question: <b class=\"hl\">auxiliary + subject + verb<\/b>. It sounds C1 instantly.<\/p><ul class=\"ex\"><li><b class=\"hl\">Not only is<\/b> renewable energy efficient, <b class=\"hl\">but it is also<\/b> cost-effective.<\/li><li><b class=\"hl\">Under no circumstances should<\/b> governments ignore this.<\/li><li><b class=\"hl\">Rarely do we see<\/b> such rapid change.<\/li><li><b class=\"hl\">No sooner had<\/b> the law passed <b class=\"hl\">than<\/b> protests erupted.<\/li><li><b class=\"hl\">Not until<\/b> recently <b class=\"hl\">did experts agree<\/b> on the cause.<\/li><li><b class=\"hl\">Little did people realise<\/b> how serious the issue was.<\/li><li><b class=\"hl\">Hardly had<\/b> we finished our starters <b class=\"hl\">when<\/b> the main course arrived.<\/li><li><b class=\"hl\">Only when<\/b> we reminded the waiter for the third time <b class=\"hl\">did we receive<\/b> our drinks.<\/li><li><b class=\"hl\">Seldom do<\/b> people consider the long-term cost.<\/li><li><b class=\"hl\">In no way<\/b> does this justify the decision.<\/li><\/ul><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Trigger<\/th><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Not only<\/td><td>Not only + aux + S…, but (S) also…<\/td><td>Not only <b class=\"hl\">does<\/b> she sing, but she <b class=\"hl\">also<\/b> dances.<\/td><\/tr><tr><td>Never / Rarely / Seldom<\/td><td>+ aux + S + V<\/td><td>Never <b class=\"hl\">have I<\/b> seen such a moving film.<\/td><\/tr><tr><td>No sooner… than / Hardly… when<\/td><td>+ had + S + p.p.<\/td><td>No sooner <b class=\"hl\">had<\/b> my head hit the pillow <b class=\"hl\">than<\/b> I fell asleep.<\/td><\/tr><tr><td>Only when / Only then / Only by<\/td><td>inversion in the MAIN clause<\/td><td>Only by investing in education <b class=\"hl\">can we<\/b> close the gap.<\/td><\/tr><tr><td>Not until<\/td><td>inversion in the main clause<\/td><td>Not until you watch it twice <b class=\"hl\">can you<\/b> follow the plot.<\/td><\/tr><tr><td>Under no circumstances / In no way<\/td><td>+ modal/aux + S<\/td><td>Under no circumstances <b class=\"hl\">should<\/b> this be ignored.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Auxiliary + subject + verb<\/span><\/div><p><s class=\"wrong\">Never before I have seen<\/s> → <b class=\"hl\">Never before have I seen<\/b>. If there is no auxiliary, add <b class=\"hl\">do / does / did<\/b>: Not only <b class=\"hl\">did<\/b> the government fail…<\/p><\/div><div class=\"box rule\"><div class=\"box-h\"><span class=\"box-tag\">Rule<\/span><span class=\"box-t\">Exception with 'to be'<\/span><\/div><p>With <b class=\"hl\">be<\/b> there is no extra auxiliary: Not only <b class=\"hl\">is<\/b> he amiable, but he <b class=\"hl\">is also<\/b> handsome. Compare: Not only <b class=\"hl\">does<\/b> she sing, but she <b class=\"hl\">also<\/b> dances.<\/p><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your writing<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ Not only does educational games facilitate…<\/div><div class=\"fx-r\">✓ Not only <b class=\"hl\">do<\/b> educational games facilitate…<\/div><div class=\"fx-why\">Plural subject → do.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Not only does having time to do exercise, but it is also resting…<\/div><div class=\"fx-r\">✓ Not only <b class=\"hl\">does<\/b> exercise <b class=\"hl\">help<\/b> workers recharge, but rest <b class=\"hl\">also<\/b> improves their focus.<\/div><div class=\"fx-why\">After the inverted auxiliary you need a full verb.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Not only famous individuals enhance this…, but also…<\/div><div class=\"fx-r\">✓ Not only <b class=\"hl\">do<\/b> celebrities <b class=\"hl\">fuel<\/b> this harmful trend, but low-cost airlines <b class=\"hl\">also<\/b>…<\/div><div class=\"fx-why\">Inversion needs the auxiliary.<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-cleft", "ch": "vg", "part": "Grammar", "title": "Cleft sentences", "sub": "Put the spotlight on one idea", "html": "<p class=\"lead\">A cleft sentence splits one idea into two clauses to <b class=\"hl\">emphasise<\/b> the important part. Essential in the essay and in the debate.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>What + clause + is/was…<\/td><td><b class=\"hl\">What<\/b> the study fails to consider <b class=\"hl\">is<\/b> the long-term impact.<\/td><\/tr><tr><td>It is/was + X + that/who…<\/td><td><b class=\"hl\">It is<\/b> the lack of funding <b class=\"hl\">that<\/b> hinders progress.<\/td><\/tr><tr><td>The reason why… is that…<\/td><td><b class=\"hl\">The reason why<\/b> reform stalled <b class=\"hl\">is that<\/b> nobody was accountable.<\/td><\/tr><tr><td>All (that) we need… is…<\/td><td><b class=\"hl\">All<\/b> we need to do <b class=\"hl\">is<\/b> invest in education.<\/td><\/tr><tr><td>What + V + is + to-infinitive<\/td><td><b class=\"hl\">What<\/b> governments should do <b class=\"hl\">is<\/b> (to) tax plastic.<\/td><\/tr><tr><td>It is not X, but Y, that…<\/td><td><b class=\"hl\">It is not<\/b> the financial <b class=\"hl\">but<\/b> the environmental implications we should worry about.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Where to use it<\/span><\/div><p>Topic sentence of a body paragraph: <b class=\"hl\">What critics tend to overlook is…<\/b> · Debate: <b class=\"hl\">What we need to do is obvious.<\/b> · Boosting: <b class=\"hl\">What is absolutely clear is that…<\/b><\/p><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your essay<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ What the companies fails to consider is the season…<\/div><div class=\"fx-r\">✓ What companies <b class=\"hl\">fail<\/b> to consider is the season…<\/div><div class=\"fx-why\">Cleft was good, but plural subject → fail (no -s).<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-conditionals", "ch": "vg", "part": "Grammar", "title": "Advanced & inverted conditionals", "sub": "Had / Were / Should + mixed conditionals", "html": "<p class=\"lead\">Inverting the conditional (dropping <b class=\"hl\">if<\/b>) is formal and very C1. Learn the three forms.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Inverted<\/th><th>Means<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><b class=\"hl\">Had<\/b> + S + p.p.<\/td><td>If S had…<\/td><td><b class=\"hl\">Had<\/b> the government acted sooner, the crisis would have been averted.<\/td><\/tr><tr><td><b class=\"hl\">Were<\/b> + S + to / <b class=\"hl\">Were it not for<\/b><\/td><td>If S were… / If it weren't for<\/td><td><b class=\"hl\">Were it not for<\/b> investment in tech, development would stall.<\/td><\/tr><tr><td><b class=\"hl\">Should<\/b> + S + V<\/td><td>If S should…<\/td><td><b class=\"hl\">Should<\/b> you need help, do not hesitate to ask.<\/td><\/tr><\/tbody><\/table><\/div><h3>Mixed conditionals<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Type<\/th><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Past cause → present result<\/td><td>If + past perfect, would + infinitive<\/td><td>If they <b class=\"hl\">had invested<\/b> earlier, they <b class=\"hl\">would be<\/b> profitable now.<\/td><\/tr><tr><td>Present cause → past result<\/td><td>If + past simple, would have + p.p.<\/td><td>If fossil fuels <b class=\"hl\">did not have<\/b> negative effects, scientists <b class=\"hl\">would have worried<\/b> less.<\/td><\/tr><\/tbody><\/table><\/div><h3>C1 conditional conjunctions<\/h3><div class=\"chips\"><span class=\"chip\">provided / providing that<\/span><span class=\"chip\">as long as<\/span><span class=\"chip\">on (the) condition that<\/span><span class=\"chip\">supposing<\/span><span class=\"chip\">unless (= if not)<\/span><span class=\"chip\">but for + noun<\/span><span class=\"chip\">failing that<\/span><span class=\"chip\">even if<\/span><\/div><ul class=\"ex\"><li><b class=\"hl\">But for<\/b> her support, I would have failed. (= de no ser por)<\/li><li><b class=\"hl\">Were this trend to continue<\/b>, inequality would inevitably widen.<\/li><li><b class=\"hl\">Should this trend continue unchecked<\/b>, the consequences would be catastrophic.<\/li><\/ul><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Listen for them too<\/span><\/div><p>In the archaeology listening the professor says: <b class=\"hl\">Had we<\/b>, like others before us, <b class=\"hl\">been tempted<\/b> to listen to local legends, <b class=\"hl\">we'd have started<\/b> digging in entirely the wrong location. That is exactly what you have to produce in Writing.<\/p><\/div>", "tags": ""}, {"id": "vg-passive", "ch": "vg", "part": "Grammar", "title": "Passives & impersonal structures", "sub": "The academic voice", "html": "<p class=\"lead\">Impersonal passives give your essay and summary an academic tone without needing a source.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>It is + p.p. + that…<\/td><td><b class=\"hl\">It is widely assumed that<\/b> automation will cut jobs.<\/td><\/tr><tr><td>S + is + p.p. + to-infinitive<\/td><td>Plastic <b class=\"hl\">is thought to be<\/b> one of the main pollutants.<\/td><\/tr><tr><td>S + is + p.p. + to have + p.p.<\/td><td>The CEO <b class=\"hl\">is reported to have resigned<\/b>. (past event)<\/td><\/tr><tr><td>Causative: have/get + object + p.p.<\/td><td>The company <b class=\"hl\">had the report reviewed<\/b> by experts.<\/td><\/tr><tr><td>Passive with modals<\/td><td>Tougher measures <b class=\"hl\">should be introduced<\/b>.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"chips\"><span class=\"chip\">It is widely held that…<\/span><span class=\"chip\">It is generally agreed that…<\/span><span class=\"chip\">It is often claimed that…<\/span><span class=\"chip\">It has been well documented that…<\/span><span class=\"chip\">X is widely believed to contribute to…<\/span><span class=\"chip\">X is said to be…<\/span><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Don't overdo it<\/span><\/div><p>Alternate active and passive. Passive everywhere sounds heavy; keep the impersonal passive for academic claims.<\/p><\/div>", "tags": ""}, {"id": "vg-subjunctive", "ch": "vg", "part": "Grammar", "title": "Subjunctive & wishes", "sub": "Formal recommendations", "html": "<p class=\"lead\">After words of necessity or recommendation, formal English uses the <b class=\"hl\">bare infinitive<\/b> for every person (no -s, no 'should' needed).<\/p><ul class=\"ex\"><li>It is vital that the company <b class=\"hl\">implement<\/b> new rules. (not implements)<\/li><li>The board recommended that he <b class=\"hl\">be<\/b> promoted.<\/li><li>It is imperative that the issue of waste <b class=\"hl\">be addressed<\/b>.<\/li><li>It is vital that traditions <b class=\"hl\">be kept<\/b> alive.<\/li><li>I wish governments <b class=\"hl\">were<\/b> more transparent. (<b class=\"hl\">were<\/b> for all persons)<\/li><\/ul><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Triggers<\/span><\/div><p>Adjectives: <b class=\"hl\">essential · vital · imperative · crucial · advisable<\/b> that… / Verbs: <b class=\"hl\">suggest · recommend · demand · insist · propose · require<\/b> that… + base form.<\/p><\/div>", "tags": ""}, {"id": "vg-participles", "ch": "vg", "part": "Grammar", "title": "Participle & reduced relative clauses", "sub": "Shorter, denser, more fluent", "html": "<p class=\"lead\">Participle clauses compress two ideas into one sentence. Reduced relatives cut <b class=\"hl\">which/who + be<\/b>.<\/p><h3>Participle clauses<\/h3><ul class=\"ex\"><li><b class=\"hl\">Having considered<\/b> the evidence, the panel reached a verdict.<\/li><li><b class=\"hl\">Faced with<\/b> rising costs, firms cut staff.<\/li><li><b class=\"hl\">Given<\/b> the circumstances, the decision was reasonable.<\/li><li><b class=\"hl\">Bearing in mind<\/b> the risks, caution is advisable.<\/li><li>Jackets <b class=\"hl\">being<\/b> relatively complex garments, many things can go wrong. (from a listening)<\/li><\/ul><h3>Reduced relative clauses<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Original<\/th><th>Reduced (C1)<\/th><\/tr><\/thead><tbody><tr><td>The policy, <b class=\"hl\">which was introduced<\/b> in 2020…<\/td><td>The policy, <b class=\"hl\">introduced<\/b> in 2020…<\/td><\/tr><tr><td>Students <b class=\"hl\">who are from<\/b> disadvantaged backgrounds…<\/td><td>Students <b class=\"hl\">from<\/b> disadvantaged backgrounds…<\/td><\/tr><tr><td>The research, <b class=\"hl\">which was conducted<\/b> by Harvard…<\/td><td>The research, <b class=\"hl\">conducted<\/b> by Harvard…<\/td><\/tr><tr><td>Employees <b class=\"hl\">who are affected<\/b> by the changes…<\/td><td>Employees <b class=\"hl\">affected<\/b> by the changes…<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box rule\"><div class=\"box-h\"><span class=\"box-tag\">Rule<\/span><span class=\"box-t\">Only with 'be'<\/span><\/div><p>You can only reduce when the original clause contains <b class=\"hl\">be<\/b>. You can't reduce 'which I like'.<\/p><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">While + -ing<\/span><\/div><p>From your notes: you can drop the subject after <b class=\"hl\">while / when<\/b> if it's the same: <b class=\"hl\">While<\/b> support<b class=\"hl\">ing<\/b> local farmers, we also cut emissions.<\/p><\/div>", "tags": ""}, {"id": "vg-modals", "ch": "vg", "part": "Grammar", "title": "Modals: deduction, speculation & hedging", "sub": "How sure are you?", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Modal<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>must have + p.p.<\/td><td>past certainty<\/td><td>She <b class=\"hl\">must have missed<\/b> the train.<\/td><\/tr><tr><td>can't have + p.p.<\/td><td>past impossibility<\/td><td>He <b class=\"hl\">can't have read<\/b> the book.<\/td><\/tr><tr><td>may / might have been + p.p.<\/td><td>past possibility<\/td><td>It <b class=\"hl\">may have been<\/b> stolen.<\/td><\/tr><tr><td>needn't have + p.p.<\/td><td>unnecessary but done<\/td><td>You <b class=\"hl\">needn't have brought<\/b> a gift.<\/td><\/tr><tr><td>should have + p.p.<\/td><td>criticism / regret<\/td><td>They <b class=\"hl\">should have acted<\/b> sooner.<\/td><\/tr><tr><td>might / could well + V<\/td><td>strong possibility<\/td><td>We <b class=\"hl\">could well see<\/b> a shift towards…<\/td><\/tr><tr><td>is bound / likely / unlikely to<\/td><td>probability<\/td><td>It <b class=\"hl\">is bound to<\/b> have an impact on…<\/td><\/tr><\/tbody><\/table><\/div><h3>Modals as hedging tools (from your notes)<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Modal<\/th><th>Use<\/th><th>Prefer in writing<\/th><\/tr><\/thead><tbody><tr><td>may<\/td><td>future possibility: it's possible that…<\/td><td>It <b class=\"hl\">may<\/b> lead to…<\/td><\/tr><tr><td>might<\/td><td>slightly less possible, in certain cases<\/td><td>This <b class=\"hl\">might<\/b> be true in some cases.<\/td><\/tr><tr><td>could<\/td><td>= may<\/td><td>It <b class=\"hl\">could<\/b> be argued that…<\/td><\/tr><tr><td>can<\/td><td>present facts / routines<\/td><td>Stress <b class=\"hl\">can<\/b> cause insomnia.<\/td><\/tr><tr><td>must<\/td><td>categoric, dogmatic, mandatory<\/td><td>It is <b class=\"hl\">mandatory<\/b> to… (softer)<\/td><\/tr><tr><td>should / ought to<\/td><td>advisable<\/td><td>It is <b class=\"hl\">advisable / recommendable<\/b> to…<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Speaking Part 5<\/span><\/div><p>This could potentially lead to… · It is bound to have an impact on… · We may well see a shift towards…<\/p><\/div>", "tags": ""}, {"id": "vg-nominal", "ch": "vg", "part": "Grammar", "title": "Nominalisation", "sub": "Turn verbs into nouns to raise the register", "html": "<p class=\"lead\">Nouns compress ideas and sound academic. It's also the fastest way to paraphrase the essay question or the summary texts.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Verbal (neutral)<\/th><th>Nominalised (C1)<\/th><\/tr><\/thead><tbody><tr><td>They reduced costs.<\/td><td><b class=\"hl\">The reduction in<\/b> costs…<\/td><\/tr><tr><td>The law was put into practice.<\/td><td><b class=\"hl\">The implementation of<\/b> the law…<\/td><\/tr><tr><td>People are aware of the risks.<\/td><td><b class=\"hl\">A growing awareness of<\/b> the risks…<\/td><\/tr><tr><td>Countries should import less food.<\/td><td><b class=\"hl\">The case for reducing a nation's dependency on<\/b> food imports…<\/td><\/tr><tr><td>Electric cars are increasingly popular.<\/td><td><b class=\"hl\">The popularity of<\/b> electric cars continues to grow.<\/td><\/tr><tr><td>Companies implemented the policy quickly.<\/td><td><b class=\"hl\">The rapid implementation of<\/b> the policy…<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your notes<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ the growing consume of plastic<\/div><div class=\"fx-r\">✓ the growing <b class=\"hl\">consumption<\/b> of plastic<\/div><div class=\"fx-why\">consume (verb) → consumption (noun).<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ invests in space must be increased<\/div><div class=\"fx-r\">✓ <b class=\"hl\">investment<\/b> in space must be increased<\/div><div class=\"fx-why\">invest → investment.<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-compare", "ch": "vg", "part": "Grammar", "title": "The… the… & so / such", "sub": "Comparatives and intensifiers", "html": "<h3>The + comparative…, the + comparative…<\/h3><ul class=\"ex\"><li><b class=\"hl\">The more<\/b> time you dedicate to research, <b class=\"hl\">the better<\/b> your results will be.<\/li><li><b class=\"hl\">The earlier<\/b> we implement these policies, <b class=\"hl\">the less<\/b> damage the ecosystem will suffer.<\/li><li><b class=\"hl\">The less<\/b> countries buy from abroad, <b class=\"hl\">the more<\/b> they produce at home.<\/li><li><b class=\"hl\">The more<\/b> dangerous the sport, <b class=\"hl\">the more<\/b> I enjoy it.<\/li><li><b class=\"hl\">The longer, the better.<\/b><\/li><\/ul><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Always 'the' twice<\/span><\/div><p><s class=\"wrong\">Bigger a car is, more petrol<\/s> → <b class=\"hl\">The bigger<\/b> a car is, <b class=\"hl\">the more<\/b> petrol it uses.<\/p><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your writing<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ the happier workers, the more increase of benefits<\/div><div class=\"fx-r\">✓ <b class=\"hl\">the happier<\/b> workers are, <b class=\"hl\">the more profitable<\/b> the company becomes<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ the more freedom workers have…, the better boost can achieve the enterprise<\/div><div class=\"fx-r\">✓ <b class=\"hl\">the more<\/b> freedom workers have, <b class=\"hl\">the more<\/b> the company <b class=\"hl\">benefits<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ The more ambitious you are, the more content you became<\/div><div class=\"fx-r\">✓ The more ambitious you are, the more content you <b class=\"hl\">become<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ the less plastic society uses, the better future new generation will have<\/div><div class=\"fx-r\">✓ the less plastic society uses, <b class=\"hl\">the better the future<\/b> for <b class=\"hl\">the<\/b> next generation<\/div><\/div><\/div><\/div><h3>So / Such<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>so + adjective/adverb (+ that)<\/td><td>The analysis was <b class=\"hl\">so complex<\/b> that it took weeks.<\/td><\/tr><tr><td>such + a/an + adj + singular noun<\/td><td>It was <b class=\"hl\">such a complex analysis<\/b> that it took weeks.<\/td><\/tr><tr><td>such + (adj) + plural / uncountable<\/td><td>They were <b class=\"hl\">such cheap tickets<\/b>… · It was <b class=\"hl\">such awful weather<\/b>…<\/td><\/tr><tr><td>so many + plural<\/td><td>There were <b class=\"hl\">so many people<\/b> that we couldn't see him.<\/td><\/tr><tr><td>so much + uncountable<\/td><td>We had <b class=\"hl\">so much luggage<\/b> that we needed a porter.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Never 'so + noun'<\/span><\/div><p><s class=\"wrong\">so beautiful day<\/s> → <b class=\"hl\">such a beautiful day<\/b> · <s class=\"wrong\">such beautiful<\/s> → <b class=\"hl\">so beautiful<\/b>.<\/p><\/div>", "tags": ""}, {"id": "vg-quantifiers", "ch": "vg", "part": "Grammar", "title": "Quantifiers", "sub": "Countable vs uncountable: the most penalised error", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Quantifier<\/th><th>With<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>A great deal of / A large amount of / A considerable amount of<\/td><td>uncountable<\/td><td>A great deal of <b class=\"hl\">research<\/b> has been conducted.<\/td><\/tr><tr><td>A large number of / The vast majority of / Countless / A fair number of<\/td><td>countable<\/td><td>A large number of <b class=\"hl\">students<\/b> prefer online learning.<\/td><\/tr><tr><td>A significant proportion of<\/td><td>both<\/td><td>A significant proportion of the population <b class=\"hl\">lives<\/b> in cities.<\/td><\/tr><tr><td>Several / Numerous / A variety of<\/td><td>countable<\/td><td>Numerous factors contribute to climate change.<\/td><\/tr><tr><td>Sufficient / Insufficient<\/td><td>uncountable<\/td><td>There is insufficient funding for schools.<\/td><\/tr><tr><td>A small / limited number of · A minority of<\/td><td>countable<\/td><td>Only a small number of cases have been reported.<\/td><\/tr><tr><td>Scarcely any / Hardly any / Virtually no<\/td><td>both<\/td><td>Virtually no progress has been made.<\/td><\/tr><tr><td>A negligible amount of<\/td><td>uncountable<\/td><td>A negligible amount of pollution comes from this source.<\/td><\/tr><\/tbody><\/table><\/div><h3>Top C1<\/h3><div class=\"chips\"><span class=\"chip\">the lion's share of (la mayor parte)<\/span><span class=\"chip\">a plethora of (abundancia)<\/span><span class=\"chip\">a dearth of (escasez)<\/span><span class=\"chip\">a disproportionate number of<\/span><span class=\"chip\">an array of<\/span><span class=\"chip\">in excess of / upwards of (más de)<\/span><span class=\"chip\">far too much / far too many<\/span><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Golden rule<\/span><\/div><p><s class=\"wrong\">A large amount of people<\/s> → <b class=\"hl\">A large number of<\/b> people · <s class=\"wrong\">A large number of money<\/s> → <b class=\"hl\">A large amount of<\/b> money. Uncountable: information, advice, knowledge, research, news, furniture, evidence, luggage, accommodation.<\/p><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Elegant openers<\/span><\/div><p>It is worth noting that a significant number of… · One must bear in mind that the vast majority of… · What is striking is that a disproportionate number of…<\/p><\/div>", "tags": ""}, {"id": "vg-hedging", "ch": "vg", "part": "Grammar", "title": "Hedging & boosting", "sub": "Neither dogmatic nor insecure", "html": "<p class=\"lead\"><b class=\"hl\">Hedge<\/b> for predictions, controversial topics and claims without proof. <b class=\"hl\">Boost<\/b> for reliable data and accepted facts. Ratio in a balanced essay: about <b class=\"hl\">3 hedges : 1 boost<\/b>.<\/p><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Instead of (B2)<\/th><th>C1 hedge<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>may<\/td><td>It would be reductive to suggest that…<\/td><td>It would be reductive to suggest that social media has only negative effects.<\/td><\/tr><tr><td>it's not perfect<\/td><td>This is not to say that…<\/td><td>This is not to say that the policy is without flaws.<\/td><\/tr><tr><td>may not<\/td><td>It is by no means certain that…<\/td><td>It is by no means certain that renewables alone will solve climate change.<\/td><\/tr><tr><td>may improve<\/td><td>There is a growing body of evidence to suggest that…<\/td><td>There is a growing body of evidence that exercise improves cognition.<\/td><\/tr><tr><td>so<\/td><td>While X may be true, it does not necessarily follow that Y<\/td><td>While funding may increase, it does not necessarily follow that outcomes will improve.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"chips\"><span class=\"chip\">It would be an oversimplification to suggest…<\/span><span class=\"chip\">There is a tendency for… to…<\/span><span class=\"chip\">This may, at least in part, account for…<\/span><span class=\"chip\">…is arguably the single greatest obstacle to…<\/span><span class=\"chip\">The evidence would seem to suggest…<\/span><span class=\"chip\">Broadly speaking / By and large<\/span><\/div><h3>Boosting (use sparingly)<\/h3><div class=\"chips\"><span class=\"chip\">It is undeniable that…<\/span><span class=\"chip\">There is compelling evidence that…<\/span><span class=\"chip\">It is abundantly clear that…<\/span><span class=\"chip\">X unequivocally demonstrates that…<\/span><span class=\"chip\">It is beyond dispute that…<\/span><span class=\"chip\">…is nothing short of essential.<\/span><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Sounds aggressive<\/span><\/div><p><s class=\"wrong\">It is obvious that…<\/s> / <s class=\"wrong\">Everybody knows that…<\/s> → <b class=\"hl\">It is widely acknowledged that…<\/b> / <b class=\"hl\">There is little doubt that…<\/b><\/p><\/div>", "tags": ""}, {"id": "vg-concession", "ch": "vg", "part": "Grammar", "title": "Advanced concession & contrast", "sub": "Much as · For all · notwithstanding · yet · whereas", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Structure<\/th><th>Example<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Much as + S + V<\/td><td><b class=\"hl\">Much as<\/b> I appreciate the policy, I cannot support it.<\/td><td>por mucho que<\/td><\/tr><tr><td>For all its + noun<\/td><td><b class=\"hl\">For all its<\/b> benefits, the policy has drawbacks.<\/td><td>a pesar de todo su…<\/td><\/tr><tr><td>Noun + notwithstanding<\/td><td>Concerns <b class=\"hl\">notwithstanding<\/b>, the project went ahead.<\/td><td>goes AFTER the noun<\/td><\/tr><tr><td>…, albeit + adj/noun<\/td><td>A vibrant atmosphere, <b class=\"hl\">albeit<\/b> at the cost of displacing residents.<\/td><td>aunque<\/td><\/tr><tr><td>Far from + -ing/noun<\/td><td><b class=\"hl\">Far from<\/b> solving the problem, the policy aggravates it.<\/td><td>lejos de<\/td><\/tr><\/tbody><\/table><\/div><h3>Three uses of YET (from your notes)<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Use<\/th><th>Example<\/th><th>ES<\/th><\/tr><\/thead><tbody><tr><td>end of negative sentence<\/td><td>I haven't done it <b class=\"hl\">yet<\/b>.<\/td><td>aún<\/td><\/tr><tr><td>between adjectives<\/td><td>Soft <b class=\"hl\">yet<\/b> cheap.<\/td><td>y sin embargo<\/td><\/tr><tr><td>start of sentence<\/td><td><b class=\"hl\">Yet<\/b>, this is still a problem.<\/td><td>aun así<\/td><\/tr><\/tbody><\/table><\/div><h3>Joining ideas correctly<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>same subject → and<\/td><td>I like fish <b class=\"hl\">and<\/b> chips.<\/td><\/tr><tr><td>different subjects / contrast → but / whereas<\/td><td>I like fish <b class=\"hl\">but<\/b> he likes chips.<\/td><\/tr><tr><td>contrast two facts<\/td><td>I love yoga, <b class=\"hl\">whereas<\/b> I hate running.<\/td><\/tr><tr><td>afterthought<\/td><td>I was proved wrong, <b class=\"hl\">though<\/b>.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Despite vs Although<\/span><\/div><p><b class=\"hl\">Despite / In spite of<\/b> + noun or -ing (Despite <b class=\"hl\">the rain<\/b> / Despite <b class=\"hl\">being tired<\/b>). <b class=\"hl\">Although<\/b> + clause (Although <b class=\"hl\">it was raining<\/b>). Never <s class=\"wrong\">despite of<\/s>.<\/p><\/div>", "tags": ""}, {"id": "vg-verbpatterns", "ch": "vg", "part": "Grammar", "title": "Infinitive or -ing?", "sub": "Verb patterns from your notes", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Rule<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Infinitive points to the future / purpose<\/td><td>I stopped <b class=\"hl\">to watch<\/b> the match. (I stopped in order to watch)<\/td><\/tr><tr><td>-ing points to the past / the activity itself<\/td><td>I stopped <b class=\"hl\">watching<\/b> TV. (I gave it up)<\/td><\/tr><tr><td>preposition + person + to + infinitive<\/td><td>It's easy <b class=\"hl\">for me to go<\/b>.<\/td><\/tr><tr><td>that + person + may/can + infinitive<\/td><td>It's possible <b class=\"hl\">that I may go<\/b>.<\/td><\/tr><tr><td>let / make + object + bare infinitive<\/td><td>I <b class=\"hl\">let you go<\/b>. · He <b class=\"hl\">made me laugh<\/b>.<\/td><\/tr><tr><td>passive of make → to<\/td><td>I <b class=\"hl\">was made to<\/b> laugh. (exception!)<\/td><\/tr><tr><td>preposition + -ing<\/td><td>I'm interested <b class=\"hl\">in learning<\/b>. · Look forward <b class=\"hl\">to hearing<\/b> from you.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your voicemail<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ I look forward for your reply<\/div><div class=\"fx-r\">✓ I look forward <b class=\"hl\">to<\/b> your reply / to <b class=\"hl\">hearing<\/b> from you<\/div><div class=\"fx-why\">look forward TO + noun / -ing.<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-prepositions", "ch": "vg", "part": "Grammar", "title": "Prepositions & word order", "sub": "Rules from your handwritten notes", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Preposition<\/th><th>Core idea<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>in<\/td><td>inside, literally (Latin words keep it: interested in)<\/td><td>interested <b class=\"hl\">in<\/b>, <b class=\"hl\">in<\/b> the box<\/td><\/tr><tr><td>on<\/td><td>surface / 'not closed' media / continuing an action<\/td><td><b class=\"hl\">on<\/b> the internet, <b class=\"hl\">on<\/b> the radio, <b class=\"hl\">on<\/b> the beach · keep <b class=\"hl\">on<\/b> running<\/td><\/tr><tr><td>at<\/td><td>a point / choosing a place<\/td><td>See you <b class=\"hl\">at<\/b> the town hall.<\/td><\/tr><tr><td>of<\/td><td>≈ Spanish 'de'<\/td><td>a bottle <b class=\"hl\">of<\/b> water (full) ≠ a water bottle (may be empty)<\/td><\/tr><tr><td>about<\/td><td>acerca de, related to<\/td><td>a film <b class=\"hl\">about<\/b> war<\/td><\/tr><tr><td>with<\/td><td>con<\/td><td><b class=\"hl\">with<\/b> my friends<\/td><\/tr><tr><td>from<\/td><td>origin, roots<\/td><td>come <b class=\"hl\">from<\/b>, <b class=\"hl\">from<\/b> one to another<\/td><\/tr><tr><td>for<\/td><td>in favour of / destination (don't overuse: often <b class=\"hl\">to<\/b>)<\/td><td>this is <b class=\"hl\">for<\/b> you · vote <b class=\"hl\">for<\/b><\/td><\/tr><tr><td>against<\/td><td>en contra de / leaning on<\/td><td>lean <b class=\"hl\">against<\/b> the wall<\/td><\/tr><tr><td>upon<\/td><td>= on (formal, reinforced)<\/td><td>It was <b class=\"hl\">upon<\/b> the table.<\/td><\/tr><tr><td>up (particle)<\/td><td>reinforces the action: completely<\/td><td>fill <b class=\"hl\">up<\/b>, close <b class=\"hl\">up<\/b>, shut <b class=\"hl\">up<\/b><\/td><\/tr><\/tbody><\/table><\/div><div class=\"box rule\"><div class=\"box-h\"><span class=\"box-tag\">Rule<\/span><span class=\"box-t\">Word order<\/span><\/div><p><b class=\"hl\">verb + person + preposition + thing<\/b>: Provide <b class=\"hl\">someone with<\/b> information · Explain <b class=\"hl\">the problem to<\/b> me (<s class=\"wrong\">explain me<\/s>).<\/p><\/div><h3>Dependent prepositions that Spanish speakers get wrong<\/h3><div class=\"chips\"><span class=\"chip\">depend <b class=\"hl\">on<\/b><\/span><span class=\"chip\">consist <b class=\"hl\">of<\/b><\/span><span class=\"chip\">listen <b class=\"hl\">to<\/b><\/span><span class=\"chip\">explain <b class=\"hl\">to<\/b> sb<\/span><span class=\"chip\">apologise <b class=\"hl\">for<\/b><\/span><span class=\"chip\">rely <b class=\"hl\">on<\/b><\/span><span class=\"chip\">focus <b class=\"hl\">on<\/b><\/span><span class=\"chip\">concerned <b class=\"hl\">about<\/b><\/span><span class=\"chip\">committed <b class=\"hl\">to<\/b><\/span><span class=\"chip\">struggle <b class=\"hl\">with<\/b><\/span><span class=\"chip\">campaign <b class=\"hl\">against<\/b><\/span><span class=\"chip\">affect sb (no preposition!)<\/span><span class=\"chip\">face sth (no 'with')<\/span><span class=\"chip\">discuss sth (no 'about')<\/span><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your writing<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ affect to the level of concentration<\/div><div class=\"fx-r\">✓ affect <b class=\"hl\">the level of<\/b> concentration<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ have to face with numerous complications<\/div><div class=\"fx-r\">✓ have to <b class=\"hl\">face<\/b> numerous complications<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ they count with quickly delivering<\/div><div class=\"fx-r\">✓ they <b class=\"hl\">benefit from<\/b> fast delivery / they <b class=\"hl\">can rely on<\/b> fast delivery<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ care about their own children<\/div><div class=\"fx-r\">✓ <b class=\"hl\">take care of / look after<\/b> their children<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-small", "ch": "vg", "part": "Grammar", "title": "Small things that give you away", "sub": "Articles, also, spelling, agreement", "html": "<h3>The vs a / plural for generalisations<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>first mention → a<\/td><td>I saw <b class=\"hl\">an<\/b> otter.<\/td><\/tr><tr><td>already known → the<\/td><td><b class=\"hl\">The<\/b> otter is called Martha.<\/td><\/tr><tr><td>general statement → a + singular or plural with no article<\/td><td><b class=\"hl\">An<\/b> otter usually eats fish. / Otters usually eat fish.<\/td><\/tr><\/tbody><\/table><\/div><h3>Where to put ALSO<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Register<\/th><th>Position<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Writing<\/td><td>start, with comma<\/td><td><b class=\"hl\">Also,<\/b> … (better: <b class=\"hl\">Furthermore,<\/b> …)<\/td><\/tr><tr><td>Speaking / neutral<\/td><td>mid-position: before main verb, after be<\/td><td>I <b class=\"hl\">also<\/b> like chips · This is <b class=\"hl\">also<\/b> a scam · I would <b class=\"hl\">also<\/b> like…<\/td><\/tr><\/tbody><\/table><\/div><h3>Spelling & word-building<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Rule<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>consonant + y → ies<\/td><td>try → tries · easy → easier<\/td><\/tr><tr><td>vowel + y → ys<\/td><td>play → plays<\/td><\/tr><tr><td>Use prefixes instead of 'not'<\/td><td>not familiar → <b class=\"hl\">un<\/b>familiar · not possible → <b class=\"hl\">im<\/b>possible<\/td><\/tr><tr><td>-wise = in relation to<\/td><td>careerwise, businesswise<\/td><\/tr><\/tbody><\/table><\/div><h3>Agreement & relative clauses<\/h3><ul class=\"ex\"><li>The person who <b class=\"hl\">sleeps<\/b> there <b class=\"hl\">is<\/b> Hungarian. (= The person sleeps there + The person is Hungarian)<\/li><li><b class=\"hl\">People are<\/b>, <s class=\"wrong\">people is<\/s> · <b class=\"hl\">information is<\/b>, <s class=\"wrong\">informations<\/s> · <b class=\"hl\">he says<\/b>, she <b class=\"hl\">depends<\/b><\/li><\/ul><h3>Typical Spanish-speaker errors<\/h3><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ I have 20 years<\/div><div class=\"fx-r\">✓ I <b class=\"hl\">am<\/b> 20<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ I am agree<\/div><div class=\"fx-r\">✓ I agree<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ a problem difficult<\/div><div class=\"fx-r\">✓ a difficult problem<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ since three years<\/div><div class=\"fx-r\">✓ <b class=\"hl\">for<\/b> three years (since 2023)<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ the most big<\/div><div class=\"fx-r\">✓ the biggest / bigger<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ At the end, …<\/div><div class=\"fx-r\">✓ <b class=\"hl\">In the end / Ultimately<\/b>, …<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ All in consider<\/div><div class=\"fx-r\">✓ <b class=\"hl\">All things considered<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ even thought<\/div><div class=\"fx-r\">✓ even <b class=\"hl\">though<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ I am concern about<\/div><div class=\"fx-r\">✓ I am <b class=\"hl\">concerned<\/b> about<\/div><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">3-minute revision trick<\/span><\/div><p>Re-read your text looking ONLY for: (1) third-person <b class=\"hl\">-s<\/b>, (2) articles <b class=\"hl\">a / the<\/b>, (3) <b class=\"hl\">prepositions<\/b>, (4) a <b class=\"hl\">repeated connector<\/b>. These four cover 80% of what is penalised.<\/p><\/div>", "tags": ""}, {"id": "vg-irregular", "ch": "vg", "part": "Grammar", "title": "Irregular verbs", "sub": "Grouped by pattern", "html": "<p class=\"lead\">Your irregular-verb sheet, grouped so the patterns stick. Watch the ones that differ from what you'd expect: <b class=\"hl\">lead – led – led<\/b>, <b class=\"hl\">lie – lay – lain<\/b>, <b class=\"hl\">spring – sprang – sprung<\/b>, <b class=\"hl\">seek – sought – sought<\/b>.<\/p><div class=\"deckref\" data-deck=\"irregular\" data-title=\"Irregular verbs\"><\/div>", "tags": ""}, {"id": "vg-upgrades", "ch": "vg", "part": "Vocabulary", "title": "Upgrades & the black list", "sub": "Replace basic words", "html": "<p class=\"lead\">Every word on the left that appears in your writing is a point you give away.<\/p><div class=\"deckref\" data-deck=\"upgrades\" data-title=\"Basic → C1 upgrades\"><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">The lesson of precision<\/span><\/div><p>Replace vague with concrete (an approximate number instead of 'a lot of'), generic with specific (name countries), and basic verbs with one-word verbs that carry the nuance (<b class=\"hl\">exacerbate<\/b> instead of 'make worse').<\/p><\/div><div class=\"deckref\" data-deck=\"blacklist\" data-title=\"Black list\"><\/div>", "tags": ""}, {"id": "vg-good-bad", "ch": "vg", "part": "Vocabulary", "title": "Synonyms of good & bad", "sub": "Pick the nuance, not just a bigger word", "html": "<div class=\"deckref\" data-deck=\"good\" data-title=\"Synonyms of GOOD\"><\/div><div class=\"deckref\" data-deck=\"bad\" data-title=\"Synonyms of BAD\"><\/div>", "tags": ""}, {"id": "vg-important", "ch": "vg", "part": "Vocabulary", "title": "Synonyms of important", "sub": "Your notes: 21 ways to say it", "html": "<p class=\"lead\">Your top four: <b class=\"hl\">crucial · paramount · vital · significant<\/b>. Then add nuance with the rest.<\/p><div class=\"deckref\" data-deck=\"important\" data-title=\"Synonyms of IMPORTANT\"><\/div><div class=\"deckref\" data-deck=\"synonyms\" data-title=\"Adding synonyms\"><\/div>", "tags": ""}, {"id": "vg-collocations", "ch": "vg", "part": "Vocabulary", "title": "Collocations", "sub": "Words that belong together", "html": "<div class=\"deckref\" data-deck=\"collocations\" data-title=\"High-value collocations\"><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Collocations from your exercises<\/span><\/div><p><b class=\"hl\">raise<\/b> awareness (not gain) · <b class=\"hl\">pose<\/b> a threat (not bridge) · <b class=\"hl\">draw<\/b> a conclusion · <b class=\"hl\">shed<\/b> light on · <b class=\"hl\">bridge<\/b> the gap · <b class=\"hl\">gain<\/b> momentum.<\/p><\/div>", "tags": ""}, {"id": "vg-verbs", "ch": "vg", "part": "Vocabulary", "title": "Academic & judgement verbs", "sub": "For summarising and arguing", "html": "<div class=\"deckref\" data-deck=\"verbs\" data-title=\"Academic, reporting &amp; judgement verbs\"><\/div>", "tags": ""}, {"id": "vg-phrasal", "ch": "vg", "part": "Vocabulary", "title": "Phrasal verbs", "sub": "Neutral and formal register", "html": "<div class=\"deckref\" data-deck=\"phrasal\" data-title=\"Phrasal verbs\"><\/div>", "tags": ""}, {"id": "vg-idioms", "ch": "vg", "part": "Vocabulary", "title": "Idioms & expressions", "sub": "2–3 per Speaking test, very few in the essay", "html": "<div class=\"deckref\" data-deck=\"idioms\" data-title=\"Idioms &amp; expressions\"><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Sound native without risk<\/span><\/div><p>when it comes to… · at the end of the day · more often than not · by and large · to a certain extent · for the most part<\/p><\/div>", "tags": ""}, {"id": "vg-connectors", "ch": "vg", "part": "Vocabulary", "title": "Connectors", "sub": "One different connector per paragraph", "html": "<p class=\"lead\">Varying connectors is one of the criteria that raises your mark most. Don't overuse <b class=\"hl\">and / but / so / also<\/b>.<\/p><div class=\"deckref\" data-deck=\"connectors\" data-title=\"Connectors by function\"><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">From your writing<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ At the end of the day, … (in an essay)<\/div><div class=\"fx-r\">✓ <b class=\"hl\">Ultimately<\/b>, …<\/div><div class=\"fx-why\">'At the end of the day' is fine in Speaking, too informal for the essay.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Notwithstanding, governments are doing nothing.<\/div><div class=\"fx-r\">✓ <b class=\"hl\">Nevertheless<\/b>, governments are doing nothing.<\/div><div class=\"fx-why\">'Notwithstanding' needs a noun: Concerns notwithstanding…<\/div><\/div><\/div><\/div>", "tags": ""}, {"id": "vg-register", "ch": "vg", "part": "Vocabulary", "title": "Register", "sub": "Semi-formal: neither casual nor pompous", "html": "<p class=\"lead\">Your essay and summary need a <b class=\"hl\">semi-formal<\/b> register. The Oxford test can also ask you to transform register.<\/p><div class=\"deckref\" data-deck=\"register\" data-title=\"Register: informal → formal\"><\/div><div class=\"box rule\"><div class=\"box-h\"><span class=\"box-tag\">Rule<\/span><span class=\"box-t\">No contractions in writing<\/span><\/div><p>it's → it is · don't → do not · can't → cannot.<\/p><\/div>", "tags": ""}, {"id": "vg-t-money", "ch": "vg", "part": "Vocabulary", "title": "Money & finance", "sub": "Career choices, cost of living, housing", "html": "<div class=\"deckref\" data-deck=\"money\" data-title=\"Money &amp; finance\"><\/div>", "tags": ""}, {"id": "vg-t-work", "ch": "vg", "part": "Vocabulary", "title": "Work & education", "sub": "Jobs, careers, schools, training", "html": "<div class=\"deckref\" data-deck=\"work\" data-title=\"Work &amp; education\"><\/div>", "tags": ""}, {"id": "vg-t-health", "ch": "vg", "part": "Vocabulary", "title": "Health & well-being", "sub": "Body, medicine, stress", "html": "<div class=\"deckref\" data-deck=\"health\" data-title=\"Health &amp; well-being\"><\/div>", "tags": ""}, {"id": "vg-t-environment", "ch": "vg", "part": "Vocabulary", "title": "Environment & nature", "sub": "Climate, waste, species", "html": "<div class=\"deckref\" data-deck=\"environment\" data-title=\"Environment &amp; nature\"><\/div>", "tags": ""}, {"id": "vg-t-tech", "ch": "vg", "part": "Vocabulary", "title": "Technology & media", "sub": "Gadgets, internet, news", "html": "<div class=\"deckref\" data-deck=\"tech\" data-title=\"Technology &amp; media\"><\/div>", "tags": ""}, {"id": "vg-t-travel", "ch": "vg", "part": "Vocabulary", "title": "Travel, places & cities", "sub": "Describing places, urban life", "html": "<div class=\"deckref\" data-deck=\"travel\" data-title=\"Travel, places &amp; cities\"><\/div>", "tags": ""}, {"id": "vg-t-people", "ch": "vg", "part": "Vocabulary", "title": "Family, relationships & personality", "sub": "Describing people", "html": "<div class=\"deckref\" data-deck=\"people\" data-title=\"Family, relationships &amp; personality\"><\/div>", "tags": ""}, {"id": "vg-t-shopping", "ch": "vg", "part": "Vocabulary", "title": "Food, shopping & clothes", "sub": "Everyday life", "html": "<div class=\"deckref\" data-deck=\"shopping\" data-title=\"Food, shopping &amp; clothes\"><\/div>", "tags": ""}, {"id": "vg-t-moods", "ch": "vg", "part": "Vocabulary", "title": "Feelings, moods & memory", "sub": "Emotions and memories", "html": "<div class=\"deckref\" data-deck=\"moods\" data-title=\"Feelings, moods &amp; memory\"><\/div>", "tags": ""}, {"id": "vg-notebook", "ch": "vg", "part": "Vocabulary", "title": "Your class notebook", "sub": "Words from Héctor's lessons and your handwritten pages", "html": "<p class=\"lead\">Everything from your own notes that isn't already in another table. These are words you met in class: review them as flashcards.<\/p><div class=\"deckref\" data-deck=\"notebook\" data-title=\"Your class notebook\"><\/div>", "tags": ""}, {"id": "vg-false", "ch": "vg", "part": "Vocabulary", "title": "False friends & meaning traps", "sub": "The ones you got wrong in 'right or wrong'", "html": "<div class=\"deckref\" data-deck=\"falsefriends\" data-title=\"False friends &amp; meaning traps\"><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">How to make a word yours<\/span><\/div><p>Not with the translation: write <b class=\"hl\">one true sentence<\/b> about your own life with each word and say it aloud. If it comes out on its own, the word is yours.<\/p><\/div><div class=\"deckref\" data-deck=\"readingwords\" data-title=\"Words from your reading texts\"><\/div>", "tags": ""}, {"id": "vg-ideas-howto", "ch": "vg", "part": "Ideas by topic", "title": "How to use the ideas bank", "sub": "Ammunition for the essay and the debate", "html": "<p class=\"lead\">Almost nobody fails Writing or Speaking because of their English: they fail because they <b class=\"hl\">go blank<\/b>. With 45 seconds to prepare the debate, there's no time to think of content.<\/p><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Study arguments, not sentences<\/span><\/div><p>Don't memorise word for word. Memorise the <b class=\"hl\">argument<\/b> and its key collocation (take its toll on, raise public awareness, at the expense of, on the brink of…). Then rebuild the sentence in your own words so it sounds natural.<\/p><\/div><h3>Wildcard sentences (fit almost any prompt)<\/h3><ul class=\"ideas\"><li>Governments must strike a balance between […] and […].<\/li><li>Legislation alone is unlikely to solve the problem; a shift in public attitudes is equally necessary.<\/li><li>The short-term costs must be weighed against the long-term gains.<\/li><li>Technology is a double-edged sword: […], yet […].<\/li><li>The pace of change has outstripped our capacity to regulate it.<\/li><li>Convenience often comes at the expense of privacy.<\/li><li>What was once considered a luxury is now regarded as a basic necessity.<\/li><li>Individual action, though not insignificant, pales beside the impact of industry.<\/li><li>Prevention is invariably cheaper — and kinder — than treatment.<\/li><li>Raising public awareness is arguably as important as the measures themselves.<\/li><li>Skills that were highly prized a decade ago are rapidly becoming obsolete.<\/li><li>Exposure to other cultures does not entail abandoning one's own traditions.<\/li><li>Cultural heritage, once lost, cannot be recovered.<\/li><li>Sustainability should be treated as an investment rather than an expense.<\/li><li>A holistic approach, encompassing nutrition, exercise and mental well-being, is far more effective than any single measure.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-sport", "ch": "vg", "part": "Ideas by topic", "title": "Sport, competition & education", "sub": "", "html": "<h3>Sport and performance<\/h3><ul class=\"ideas\"><li>Professional athletes train their minds to get rid of negative thoughts and the fear of failure, while maintaining their concentration.<\/li><li>Exercise helps people to have a sound mind and to build up mental strength.<\/li><li>Peak performance is usually a combination of determination and motivation.<\/li><\/ul><h3>Sport at school<\/h3><ul class=\"ideas\"><li>Physical Education should be an essential part of the curriculum, as <b class=\"hl\">not only does it enhance<\/b> pupils' well-being, <b class=\"hl\">but it also<\/b> promotes exercise as a healthy way of living later in life.<\/li><li>Through fitness, students learn self-discipline and build self-respect while maintaining a healthy body and mind.<\/li><\/ul><h3>Sport and money<\/h3><ul class=\"ideas\"><li>Many believe footballers do not deserve the exorbitant amounts they are paid compared with doctors.<\/li><li>Sponsorship deals and astronomical transfer fees lead to fierce competition, putting athletes under incredible pressure.<\/li><li>Financial rewards lead some athletes to resort to banned substances.<\/li><li>The fact that athletes must be subjected to regular testing indicates that the true meaning of sport has been lost.<\/li><\/ul><h3>Competition in the classroom<\/h3><ul class=\"ideas\"><li>Healthy competition motivates students to reach their full potential.<\/li><li>Students who succeed feel a sense
