ailers are creating garments in a sustainable way…"}, {"s": "F", "t": "Whereas in fact they're just cutting down slightly on the resources required, but certainly not the energy used, particularly when compared to producing items of clothing from brand new synthetic fabrics."}, {"s": "M", "t": "So maybe it's a step in the right direction, maybe not."}, {"s": "F", "t": "I've heard it suggested that clothing manufacturers who used recycled plastic in their products should be required to state details about exactly how garments were made on the product's label."}, {"s": "M", "t": "It'd mean that companies trying to do their bit environmentally would be faced with complying with extra legislation, while the ones who couldn't care less about the environment could get away with doing next to nothing."}, {"s": "F", "t": "It'd encourage being transparent about the impact manufacturing has environmentally, though, and other companies might well follow. Anyway, do you own any clothes made from recycled plastic?"}, {"s": "M", "t": "I do — some swimming trunks and a jacket — and I've tried on plenty of others. In terms of how they feel to wear, it's actually tremendously hard, if not impossible, to tell them apart from garments created from artificial fibres."}, {"s": "F", "t": "I've run testing sessions recently, in which participants have been given a coat, for example, made from recycled plastic, and a similar one that hadn't been recycled in any way. As far as cosiness went, there was next to no difference between the scores they gave for each — apart from anything made from natural fibres, which did tend to outperform them."}, {"s": "M", "t": "Fascinating! Of course one way to encourage more clothing companies to use recycled fabrics is to remove any government tariffs or other charges from products made from them."}, {"s": "F", "t": "I'd much rather that approach was applied to products made from natural fibres which have had minimal processing during their manufacture instead. Otherwise you might end up sending out the wrong message."}, {"s": "M", "t": "Every little helps, though, surely, so I can see no reason for going down that road for both of these kinds of garments. Anyway, it's been really great talking to you, Elena — thanks so much for joining me."}, {"s": "F", "t": "You're welcome!"}], "items": [{"q": "The early excitement about these brands has not been sustained.", "a": "W", "why": "'predictions… haven't really materialised'."}, {"q": "Suitable plastic may be scarcer than the public assumes.", "a": "M", "why": "'harder to come by than people perhaps imagine'."}, {"q": "Recycled clothing may create a false impression of sustainability.", "a": "B", "why": "He: misleading impression; she adds that energy use isn't reduced."}, {"q": "Labelling rules could unfairly burden environmentally responsible companies.", "a": "M", "why": ""}, {"q": "Garments made from recycled plastic feel no different from those made from new synthetic fibres.", "a": "B", "why": "He: hard to tell apart; she: next to no difference in cosiness."}, {"q": "Tax advantages should be reserved for natural-fibre products.", "a": "W", "why": "He wants them for both kinds of garment."}], "note": "Opinions written for this app (the original question sheet wasn't in your photos)."}, {"id": "li51", "sec": "li", "part": "Part 4", "title": "Part 4 · Attitude and purpose", "type": "listenset", "instr": "Ask yourself: why is this person speaking? Purpose often comes in the last sentence.", "clips": [{"q": "A lecturer is talking to her students about citizen science. Why is she talking about it?", "o": ["to warn them about the limitations of volunteer-collected data", "to suggest a line of work for their own projects", "to illustrate how public involvement has changed research"], "a": 1, "why": "'it is precisely what I would like several of you to be doing this term, with a scheme of your own choosing'.", "script": [{"s": "F", "t": "Before any of you settle on a methodology, I want you to look at the garden bird count that has run in this country every January for forty years. Half a million observations a year, collected by people with no training whatsoever, and for a long time professionals treated the whole thing as a curiosity. What changed their minds was not the volume but a series of papers showing that, once you correct for the fact that volunteers cluster near towns and count more on sunny weekends, the dataset is as reliable as anything we generate ourselves. That correction is the interesting part — and it is precisely what I would like several of you to be doing this term, with a scheme of your own choosing."}]}, {"q": "A man is talking about learning a language as an adult. What does he say about it?", "o": ["Progress is slower than teachers usually admit.", "The main obstacle is psychological rather than cognitive.", "Immersion works less well than structured study."], "a": 1, "why": "'What we cannot do is tolerate sounding foolish' — embarrassment, not ability. A is contradicted: adults acquire grammar faster.", "script": [{"s": "M", "t": "Everyone tells you that a child's brain is a sponge and yours has hardened, and there is something in that — but a great deal less than the excuse-making requires. Adults actually acquire grammar faster; we're better at spotting patterns, we can read, we can look things up. What we cannot do is tolerate sounding foolish for eighteen months. A seven-year-old will happily produce nonsense in front of a room full of people. A forty-year-old will sit in silence rather than get a tense wrong — and silence is where languages go to die."}]}, {"q": "A woman is reviewing a book about the history of tea. What is her main criticism?", "o": ["The book covers too broad a period of time.", "The central argument is never seriously tested.", "The structure makes the argument hard to follow."], "a": 1, "why": "'never once tests it against a rival explanation' + 'a case made by someone who was never going to lose'.", "script": [{"s": "F", "t": "There is a great deal to enjoy here — Fenton writes beautifully about the plantations, and the chapter on the Boston shipments is the best thing I have read on the subject. My difficulty is with the claim on which the whole book rests: that tea, more than sugar or cotton, shaped the empire. She states it in the introduction, she states it again in the conclusion, and in between she gives us four hundred pages of excellent narrative that never once tests it against a rival explanation. It reads like a case made by someone who was never going to lose."}]}]}, {"id": "li32", "sec": "li", "part": "Part 4", "title": "Part 4 · Lectures and conversations (2.04)", "type": "listenset", "instr": "Watch the adverb in the question (particularly, mainly) and the to-infinitive of purpose.", "clips": [{"q": "A student is asking her professor about an essay. What does the professor particularly want her to do?", "o": ["Avoid giving the essay a conventional focus.", "Ensure that the essay is supported by references.", "Concentrate on forming a clear structure in the essay."], "a": 0, "why": "'ordinary people, as opposed to the more high-profile characters'. B and C come with low-emphasis language ('of course', 'I'm sure you're aware').", "script": [{"s": "F", "t": "Professor? Would you have a moment to discuss our essay on lifestyles in history?"}, {"s": "M", "t": "Of course. What we're after is a discussion of landmark changes in lifestyles during particular periods of history — things like the impact of the industrial revolution. It's something that's probably most effectively addressed by examining the lives of what we might term 'ordinary people', as opposed to the more high-profile characters that typically attract our attention. There's a huge number of resources now available on that — which'll need proper crediting of course — and I'm sure you're aware that time spent on planning a logical line of development can only help your arguments."}]}, {"q": "An author is talking about book reviews. She tends to ignore reviews of her novels because…", "o": ["they distract her from her work.", "any inaccuracies in them annoy her.", "she finds negative comments discouraging."], "a": 0, "why": "'wasting far too much time contemplating… so these days I give reviews a miss'. C is explicitly ruled out.", "script": [{"s": "F", "t": "I remember anxiously waiting for reviews after my first book was published. And naturally, some were more positive and enthusiastic than others. Some infuriated me — had they actually read the book from cover to cover? The sheer range of opinions takes a lot of processing though — I found myself wasting far too much time contemplating what had been said, so these days I generally give reviews a miss. It's not that I can't handle criticism — everyone's entitled to their own opinion, after all. But I want to hear it from people I trust — my editor, and a handful of friends and fellow authors."}]}, {"q": "Two students are discussing a documentary about fast fashion. What criticism does the woman make?", "o": ["The topic of the programme lacked relevance.", "The choice of interviewees was inappropriate.", "There was too much focus on the presenter."], "a": 1, "why": "'the people featured were keen consumers in general… so what they said didn't really support the point'. 'She stole the show' is surrounded by praise.", "script": [{"s": "F", "t": "Given so many of us are concerned about the clothing industry churning out so much cheap, poor-quality clothing, I was excited to watch Fast Fashion Nightmare last night."}, {"s": "M", "t": "Me too, it was really interesting."}, {"s": "F", "t": "I can't think of any other celebrity more capable of fronting a documentary like that than Stephanie Walker — in a sense she stole the show, but there was no doubting her commitment in getting her message about the negative impacts of fast fashion across. It did strike me that the people featured were keen consumers in general though, not just of fast fashion specifically, so what they said didn't really support the point the documentary was trying to make. Seeing a programme tackle such a thorny issue was refreshing all the same."}]}, {"q": "An archaeology professor is talking to his students. Why is he talking about an archaeological site?", "o": ["to encourage them to volunteer there", "to suggest it as a possible focus for project work", "to illustrate a problem they may face in the profession"], "a": 1, "why": "The first sentence: 'To inspire your upcoming research into so-called lost cities'.", "script": [{"s": "M", "t": "To inspire your upcoming research into so-called 'lost cities', I'll show you some slides of the archaeological dig we did last year, at a site called Trellick — a practically complete medieval town that was abandoned abruptly sometime in the 12th century. Over the centuries since, it gradually acquired almost mythical status. It was rediscovered through finds of pottery and coins by a farmer, whose observations proved invaluable. Had we, like others before us, been tempted to listen to local legends, we'd have started digging in entirely the wrong location. Of course you too, by following the evidence and helping out somewhere, could similarly experience the unique thrill of being the first to uncover the remains of a settlement lost in the mists of time."}]}, {"q": "A professor of fashion is talking to some students. Why is he talking to them?", "o": ["to challenge them to make an original jacket if they want", "to discourage them from making a jacket until a later date", "to help them identify potential problems when making a jacket"], "a": 0, "why": "'if anyone is set on producing something utterly unique… far be it from me to prevent you'. Listing problems is context, not purpose.", "script": [{"s": "M", "t": "I've been asked whether it's OK for students to consider crafting a jacket this early in the course. Well, jackets being relatively complex garments, there are hundreds of things that could go wrong with anything from the pattern to the fabric to the fitting. Anyway, in answer to the question, it would certainly be legitimate; whether it's actually a safe option is quite another matter. That said, if anyone is set on producing something utterly unique — and remember that they've been on the scene for a long time — far be it from me to prevent you from going outside your comfort zone."}]}]}, {"id": "li33", "sec": "li", "part": "Strategy", "title": "Predict the trap before listening", "type": "mcq", "instr": "Without any audio: which option is the most likely trap, and why?", "items": [{"q": "How does the speaker feel about the new museum? A) impressed by the architecture · B) disappointed by the collection · C) surprised by the ticket price. In feeling questions, the trap is usually…", "o": ["the option mentioned literally and then dismissed with 'though / that said'", "always option A", "the option with the most difficult words"], "a": 0, "why": "Listen for the final twist: what comes after 'though / that said' is usually the real feeling."}, {"q": "Why is the manager talking to the team? A) to announce a change · B) to praise their work · C) to warn about deadlines. In purpose questions, the trap is usually…", "o": ["what takes up most of the talking time", "the first option", "the option that repeats words from the question"], "a": 0, "why": "The real purpose is often announced in the first sentence with a to-infinitive (or, in Part 4, in the last sentence)."}]}, {"id": "rehw1", "sec": "re", "part": "Part 1", "title": "Part 1 · Your reading homework (8 short texts)", "type": "mcq", "instr": "Time yourself: about 1 min 20 s per text. Identify the purpose first.", "timer": 11, "items": [{"q": "What is the main purpose of the notice?", "o": ["to inform people of a series of seminars to help workaholics", "to educate people on the negative health implications of being a workaholic", "to explain the concept of a workaholic"], "a": 0, "why": "The health problems are the hook; the purpose is the call to action: 'We are running weekly seminars… sign up today'.", "text": "Do you often find yourself working late while your friends and associates are out socialising, or getting up at the crack of dawn to get into the office and squeeze in a few hours before your colleagues arrive? Well, if your answer to these questions is yes, then you might just be a workaholic. Furthermore, did you realise that a workaholic lifestyle can have a detrimental effect on your health? In fact, there is a long list of health issues associated with working too much and not taking enough leisure time: heart disease, high blood pressure, anxiety, depression, stomach complaints and insomnia to name just a few! But don't worry, not all hope is lost. We are running weekly seminars to help you get on top of your work-life balance. We will help you build strategies to detach from work and enjoy more leisure time. If you feel like work is taking over, then sign up today. You won't regret it.", "title": "A notice"}, {"q": "The author's description of Arabella is designed to make the reader ___ her.", "o": ["distrust", "admire", "feel sorry for"], "a": 2, "why": "'behind those eyes there is a sadness'… alone, father died, mother works two jobs. She doesn't complain, but the description builds sympathy.", "text": "Arabella is such a delightful young girl. She is ten years old with short dark curls that bounce when she laughs. She wears odd socks and can often be seen clutching a sketchbook full of fanciful drawings of mythical creatures. She has the brightest of smiles and eyes that twinkle like the stars. But behind those eyes there is a sadness that most people don't see. Arabella is often alone because her mother has to work two jobs just to make ends meet. Her father died many years ago leaving her mother to support their only child. Arabella often watches the other children getting picked up from school and hears their laughter as they run into their parents' arms. But she never complains, never asks for more than she has. Instead, she offers kind smiles and little jokes to hide the way she feels inside.", "title": "Literary fiction"}, {"q": "The extract suggests that the Time Traveller is attempting to…", "o": ["verify the effectiveness of a machine.", "appraise claims made about a machine.", "inspect modifications made to a machine."], "a": 0, "why": "He is about to demonstrate that the machine really works: 'satisfy yourselves there is no trickery… I don't want… to be told I'm a quack'.", "text": "The Medical Man got up out of his chair and peered into the thing. 'It's beautifully made,' he said. 'It took two years to make,' retorted the Time Traveller. Then, when we had all imitated the action of the Medical Man, he said: 'Now I want you clearly to understand that this lever, being pressed over, sends the machine gliding into the future, and this other reverses the motion. Presently I am going to press the lever, and off the machine will go. It will vanish, pass into future Time, and disappear. Have a good look at the thing and satisfy yourselves there is no trickery. I don't want to waste this model, and then be told I'm a quack.'", "title": "A novella"}, {"q": "In the blogger's opinion, some technological developments…", "o": ["should receive praise even if they are frustrating.", "are at their most valuable when they save time.", "are less widely discussed than others."], "a": 2, "why": "'While past feats of innovation are celebrated, little is said about the creations that even their inventors now regret.'", "text": "While past feats of innovation are celebrated, little is said about the creations that even their inventors now regret. This refers not only to inventions which have caused irrevocable damage to the world but also to those which have made life just that little bit more convoluted. One is Tim Berners-Lee's decision to include the double slash within web addresses when inventing the World Wide Web. Another is Ethan Zuckerman's invention of the pop-up ad. There may be worse examples. After all, it doesn't take long to tap a symbol on a keyboard or close down a tab in your browser, but consider the hours that would already have been saved had billions of people not had to do that.", "title": "A blog"}, {"q": "The writer places a condition on the acceptance of the invitation in order to…", "o": ["allow people to participate only at certain stages.", "encourage the participation of specific groups.", "ensure participants avoid dropping out."], "a": 2, "why": "'Should you feel that this is a manageable objective for you…' — they want people who will last the whole month.", "text": "You recently participated in our online survey on the impact of social media on mood and indicated that you would be willing to participate in further research. Thus, we are formally inviting you to participate in our forthcoming study on the impact of social media withdrawal on both heavy and minimal social media users. If you agree to your inclusion in the study, set to begin in February, you will be required to abstain from using social media, including messaging apps, for the duration of one month. Should you feel that this is a manageable objective for you and wish to accept this invitation, please reply at your earliest convenience and no later than 31 January.", "title": "A letter"}, {"q": "The writer's purpose is to…", "o": ["speculate about the timing of an anticipated event.", "warn about the possible consequences of inaction.", "make a comparison between the present and future."], "a": 1, "why": "'the outcome of a failure to put plans and safeguards in place now will be known' — utopia or dystopia depends on acting now.", "text": "By 2070, experts will have been discussing the potential impact of machine learning for at least a century and the outcome of a failure to put plans and safeguards in place now will be known. With automation on the verge of transforming our lives today, it is going to be a prevalent feature of daily living by the middle of the century and beyond. However, the question remains whether there will be a resulting utopia or a dystopia. Will labour inequality and shortages have been eradicated and quality of life improved? Or will billions of people be living in poverty, having lost their jobs to androids? Only one of those options is surely desirable.", "title": "A newspaper editorial"}, {"q": "What does the extract suggest about the use of artificial intelligence in higher education?", "o": ["Students largely remain undecided on how to apply it.", "Some students require a more principled approach to using it.", "It is most effective in helping to ensure linguistic accuracy."], "a": 1, "why": "'some remain unaware of corresponding ethical issues… ignorant of the privacy issues… unaware of the requirement to cite'.", "text": "The results of this small-scale study suggest that artificial intelligence is commonly exploited by university students in their work but that some remain unaware of corresponding ethical issues. The participants – 42 geology undergraduates about to embark on a research project – were almost all planning to use large language models as a means of support. In most cases, this was for the approved purposes of editing and proofreading. However, a fifth were also going to direct the tool to generate texts for their assignments based on research data they would supply. All but two of these students were ignorant of the privacy issues this may raise and unaware of the requirement to cite their use of artificial intelligence in their reference lists.", "title": "A report"}, {"q": "What is the main purpose of the article?", "o": ["to explain the changing population of a species", "to illustrate the human role in maintaining a species", "to outline the financial importance of a species"], "a": 1, "why": "Every sentence links the bee's spread or survival to humans: nurtured as a resource, introduced to the Americas, 'careful management and action on threats'. A is a detail; C isn't developed.", "text": "A sociable flying insect, the honey bee, originally native to Afro-Eurasia, is now found globally. Distribution spread as humans began to nurture the creatures as a resource providing a valuable foodstuff. Since the 16th century, multiple subspecies have been introduced to the Americas. Despite this, the honey bee represents only a small fraction of the approximately 20,000 known species of bee. From a historic peak of 11, due to careful management and action on threats, there are currently eight surviving species of honey bee officially recognised globally, with a total of 43 subspecies.", "title": "An article: Honey bees"}], "note": "Answer key written for this app (your homework sheet had no key)."}, {"id": "rehw2", "sec": "re", "part": "Part 2", "title": "Part 2 · Work and family life (homework)", "type": "match", "timer": 8, "instr": "Apply the protocol: read all three texts first, then match. Each person may be chosen more than once.", "opts": ["A", "B", "C"], "passages": [{"title": "A — Aloza Henry", "text": "A modern mythology has developed about traditional customs holding up the financial evolution of a country; it suggests that shedding them will somehow prove liberating. There's as much truth in this as in most legends. This is in contrast to the fears that many commentators raise about certain patterns closer to home, such as the average parental age for starting a family. Considering that seeking to establish a career has gained priority over committing to parenthood, I'm beginning to wonder whether our ancestors had it right. No one has ever satisfactorily explained the reason to me as to why the balance between work and home life has shifted so far towards the former. It stands to reason, however, that those who love their jobs will be more content with this situation. On the other hand, as the majority of our workforce don't share this luxury, there can only be one outcome in terms of the population's degree of contentment."}, {"title": "B — Guillermo Alvarez", "text": "There are countless surveys carried out worldwide every year which monitor the satisfaction levels of different populations, and the majority of these consistently demonstrate an upward trend. I can't help but think that there's a strong correlation between these figures and the increasing levels of prosperity that most nations, and the individuals within them, have experienced. This has come about through rapid development, which has inevitably meant sacrificing some old, well-loved ways of doing things. I'm not sure many people mourn the loss of the repetitive jobs of yesteryear, but the shorter hours have clearly been consigned to history. As people are generally putting off starting a family far more than in previous generations, this will bring them the kind of maturity that will help to make what is a very challenging few years more fruitful as their offspring develop and grow."}, {"title": "C — Kasper Voss", "text": "Whilst the average employee these days probably rues the direction in which the length of their week is going, I'd be surprised if they felt the same way about its mundanity. Factory work has become increasingly mechanised, leading to an expansion in more gratifying work. Given that there are also far more diverting leisure activities to occupy us these days, it's little wonder that this has a tangibly more light-hearted mood than 30 years ago. As with all changes, there are inevitably losers as well as winners, and I'm far from convinced that having close to middle-aged parents is going to stand the newest generation in good stead. That said, by the time the first child arrives, both mother and father are generally some way up the career ladder. This is one example of the many ways in which swift development has contributed to the enhancement of many nations' wealth."}], "items": [{"q": "Who never received a satisfying explanation as to why career has taken priority over family life?", "a": "A", "why": "'No one has ever satisfactorily explained the reason to me'."}, {"q": "Who suggests that only those who genuinely love their jobs will find real satisfaction under the current work-life balance?", "a": "A", "why": "'those who love their jobs will be more content… the majority don't share this luxury'."}, {"q": "Who believes that a nation's growing wealth is reflected in the rising life satisfaction of its population, based on survey evidence?", "a": "B", "why": ""}, {"q": "Who maintains that postponing parenthood gives people extra maturity that makes the early years of raising children more rewarding?", "a": "B", "why": ""}, {"q": "Who points out that automation has reduced the amount of monotonous work available, making jobs more satisfying?", "a": "C", "why": "'Factory work has become increasingly mechanised, leading to an expansion in more gratifying work'."}, {"q": "Who questions whether being raised by older parents will really benefit children, despite the financial security this brings?", "a": "C", "why": ""}, {"q": "Who observes that employees today typically work longer hours than earlier generations did?", "a": "B", "why": "'the shorter hours have clearly been consigned to history'. C hints at it ('rues the direction… length of their week'), but B states the comparison with the past."}], "note": "Answer key written for this app."}, {"id": "rehw3", "sec": "re", "part": "Part 2", "title": "Part 2 · Banning single-use plastic (homework)", "type": "match", "timer": 8, "instr": "Read all three texts before answering.", "opts": ["A", "B", "C"], "passages": [{"title": "A — Doran Yusef", "text": "There has been little debate as to whether it actually makes ecological sense to ban single-use plastic products. I find this troublesome, given that the paper and glass, which would presumably replace the plastic used in bags and bottles respectively, use more energy than plastic in their production, therefore contributing more to global warming. Changing the material that these products are created from will have minimal financial impact, as income and employment losses in plastics and packaging would be absorbed into the manufacturing of whichever material takes its place. Costs imposed on consumers at the point of sale for plastic bags have been highly successful in reducing how many are used, so now is the moment to enforce these on other items packaged in disposable plastic. Any outright ban would need to be instigated gradually, in order to make it workable."}, {"title": "B — Hideko Suzuki", "text": "Customers have little or no direct control over what packaging a company sells its products in. It's therefore unfair to inflict additional expenses on buyers for decisions made by the producer. Along similar lines, if shops want to sell their goods, they should provide and pay for the means of carrying it home. I think the financial implications of a ban on the products are more far-reaching than anyone has predicted. You can't just remove an entire industry from a nation and expect no repercussions. What's driving the call for a ban, of course, are the catastrophic consequences to the planet of avoiding this issue. I wholeheartedly go along with the view that it needs to be addressed, but perhaps not so quickly that we end up creating more problems than we solve. These sorts of transitions take time, especially as the regulation of such a ban is likely to be extraordinarily complex."}, {"title": "C — Radislav Kovac", "text": "The majority of those calling for stopping short of a ban on throwaway plastics claim that it would be absurdly complicated to introduce and supervise. I would beg to differ. Is it really such an effort to visit a supermarket to see which manufacturers still use plastic packaging, and whether customers are being provided with plastic bags? There's no reason why they should be, as schemes worldwide whereby customers pay for these have been immensely effective and should now encompass other single-use products. Having said that, although plastic is undoubtedly a major pollutant, it would be wrong to completely ignore the likely impact of producing other more energy-intensive materials that might replace it. However, I believe these would be the lesser of two evils. Also, although the focus has largely been on packaging and bags, there needs to be a widening of the net to include other everyday items like drinking straws."}], "items": [{"q": "Who suspects that the materials likely to replace plastic could end up doing more harm to the planet, since producing them takes so much more power?", "a": "A", "why": ""}, {"q": "Who takes the view that phasing out plastic wouldn't have much economic impact, since the workforce would simply shift into producing whatever replaces it?", "a": "A", "why": ""}, {"q": "Who feels that shoppers shouldn't be the ones footing the bill for packaging choices that are entirely out of their hands?", "a": "B", "why": ""}, {"q": "Who fears the ban's economic fallout could be far bigger than anyone has bargained for?", "a": "B", "why": ""}, {"q": "Who worries that rushing the process could end up doing more harm than good?", "a": "B", "why": "A also wants it gradual, but only B says rushing could create more problems than it solves."}, {"q": "Who dismisses the idea that policing a ban on plastic packaging would be particularly difficult?", "a": "C", "why": "'I would beg to differ'."}, {"q": "Who accepts that alternative materials also cause environmental harm, but still regards moving away from plastic as the better option?", "a": "C", "why": "'the lesser of two evils'."}], "note": "Answer key written for this app."}, {"id": "rehw4", "sec": "re", "part": "Part 3", "title": "Part 3 · How the microwave oven was invented (homework)", "type": "match", "timer": 11, "instr": "Choose the sentence (A–G) that fits each gap. One sentence is extra. Check the words before and after each gap.", "opts": ["A", "B", "C", "D", "E", "F", "G"], "optsfull": ["A · Developing a reputation there as someone who had an uncanny ability to come up with straightforward fixes to even the most complex of engineering problems, his employer had given him the task of improving radar technology that they were producing for the military.", "B · As a consequence of these impracticalities, coupled with the public's mistrust of such a new technology, sales were, perhaps surprisingly, poor.", "C · In the 1940s, however, little information was available about the effect microwaves might have on humans, so Spencer never took into account how safe it might be to work and cook with microwaves.", "D · It was during his efforts to develop this technology that the unusual side-effect came to light.", "E · His natural curiosity immediately led him to wonder how exactly this had happened, so Spencer conducted another experiment, this time with an egg.", "F · He possessed an unusual instinctive curiosity that led him into employment at a textile mill in a nearby town.", "G · In addition to this increasingly universal appeal, Spencer's work continues to influence research into further uses for radar, especially those which monitor global weather conditions and trap speeding drivers: police radar guns detect the reflections of microwaves to calculate a driver's speed."], "passages": [{"title": "How the microwave oven was invented", "text": "The microwave is, these days, a common sight in many kitchens around the world and cherished for the speed at which it heats up food and drink. However, it is a little-known fact that its creation came about almost completely by accident, while a self-taught US engineer named Percy Spencer, who was working on improvements to military hardware, realised a snack he had in his pocket had melted. Radar, which had been used extensively by the armed forces, detects enemy aircraft and allows planes to fly at night. [1] But Spencer's experience and intelligence led him to the realisation that here were domestic applications for this discovery.\n\nHe had grown up in a poor family in the backwoods of Maine, in the eastern United States, and had minimal formal education. He had also had little or no direct exposure to emerging technologies of the time, such as cars and electrical power. But Spencer didn't allow this to hold him back. [2] His role there was to assist with the installation of electricity at the plant, despite having had no formal training in electrical engineering.\n\nOn joining the Navy at the age of 18, he gained a fascination for the radio and taught himself everything he could about the new technology. This was to stand Spencer in good stead after leaving the Navy. He gained employment at the American Appliance Company, later renamed the Raytheon Manufacturing Company, and rapidly gained renown as one of their most accomplished engineers. [3] On one occasion, he decided to run some experiments using magnetrons, a high-powered component found inside radars. As he did so, he happened to put his hands into his pockets, where he habitually kept his snack. That day, it happened to be a candy bar made from peanuts and caramel. To his surprise, he found that it had turned into a warm, melted mess in his pocket whilst he had been at work.\n\nHad it been a chocolate bar, this would not have been so remarkable, as chocolate becomes liquid at a relatively low temperature. Melting a peanut and caramel bar, however, requires substantially larger amounts of energy. [4] He placed it close to the magnetron and within seconds, it had exploded, splattering cooked egg everywhere, including on his face. On a subsequent occasion, he repeated the experiment with popping corn and was soon sharing popcorn with his team. Recognising that it was microwaves produced by the magnetron that had heated it to such a degree, his employer immediately patented the invention.\n\nThe launch of the first commercial microwave oven came just two years later. Costing around $5,000 (well over $50,000 today), it weighed about 340 kg and was almost two metres tall. [5] The venture ended up losing the company a lot of money, becoming their greatest business failure to date.\n\nEventually, the company would work hard to bring down the price and to create models of a more convenient size, and sales of the microwave oven mushroomed. According to US government figures, in excess of 90% of American homes had microwaves by 1997. Although not all countries have been so quick in embracing this appliance, its acceptance is growing day by day and it has rapidly become the quickest method of heating up food and drink across the planet. [6]\n\nAnd all of this progress stems from Spencer's realisation that a melting candy bar in his pocket had far greater significance than a trip to the dry cleaners! In 1999, Percy Spencer was finally given his rightful place alongside great inventors such as Thomas Edison and the Wright Brothers at the National Inventors Hall of Fame."}], "items": [{"q": "Gap 1", "a": "D", "why": "'this technology' = radar, mentioned just before."}, {"q": "Gap 2", "a": "F", "why": "'His role there' needs a place: the textile mill."}, {"q": "Gap 3", "a": "A", "why": "'there' = Raytheon; his task (radar) leads to the magnetron experiments."}, {"q": "Gap 4", "a": "E", "why": "'this time with an egg' → 'splattering cooked egg everywhere'."}, {"q": "Gap 5", "a": "B", "why": "'these impracticalities' = price, weight, size."}, {"q": "Gap 6", "a": "G", "why": "'this increasingly universal appeal' follows 'across the planet'."}], "note": "Extra sentence: C. Answer key written for this app."}, {"id": "rehw5", "sec": "re", "part": "Part 3", "title": "Part 3 · Replacing arts subjects in schools (homework)", "type": "match", "timer": 11, "instr": "Choose the sentence (A–G) that fits each gap. One sentence is extra.", "opts": ["A", "B", "C", "D", "E", "F", "G"], "optsfull": ["A · But the structure of the timetable they'd decided on, which allowed students to select only one choice between art, music and drama, and none of them if the child also wanted to study a second language, hardly seemed to support that.", "B · It's an oddly short-sighted view, and one which has been the subject of campaigns which spell out clearly the contribution of the creative sector to the economy.", "C · But the latter have had their funding cut, and many state-school teachers find their time and resources stretched so thinly that they are unable to provide the kind of musical tuition, choir or gallery trips and after-school clubs that were previously on offer.", "D · Many of them say they wouldn't have been able to get started in their careers without similar backing.", "E · The statistics suggest, however, that whatever ministers or congressmen say, a clear disparity appears to have been created.", "F · It is crucial to develop imagination, curiosity and empathy.", "G · There's no question that the opportunity to explore creative expression can broaden people of any age's outlook and allow this to happen."], "passages": [{"title": "Replacing arts subjects in schools", "text": "Despite a lack of resources, we need a commitment to creativity in schools.\n\nIn 2006, 84-year-old American novelist Kurt Vonnegut wrote a letter to a class of schoolchildren who had asked him to visit. He was too ill to travel, but offered them instead the following lesson for life: 'Practise any art, music, singing, dancing, acting, drawing, painting, sculpting, poetry, fiction, essays, reportage, not to get money and fame, but to experience becoming, to find out what's inside you, to make your soul grow.' [1] And it comes with some pretty positive side-effects: boosting confidence and encouraging empathy and outlook about the wider world. Middle-class parents have long known this; it's why they get their children signed up for music groups before they can walk. Being 'cultured' opens doors even if you don't pursue a career in the arts. Private schools know this too, and usually offer a rich and varied extracurricular programme of artistic activities. But Vonnegut's advice is not so easy to follow for those with little opportunity or guidance when it comes to creativity.\n\nSchools used to provide these, often backed up by community youth projects. [2] Perhaps an even greater worry is that creative writing, art, drama and music, once an integral part of the curriculum, are having their status reduced in favour of more obviously 'commercially useful' subjects. In the UK, for example, there has recently been a huge decline in the number of pupils taking qualifications in arts subjects. In a challenging global economy, the arts are increasingly seen as 'soft subjects'. This appears to be happening despite assurances from politicians, who firmly reject the suggestion that the arts are somehow considered less important than subjects such as science and maths. [3] This observation was reinforced when my 14-year-old son recently chose subject options for the two subsequent academic years. The fact that his school decided to send an accompanying letter assuring parents that the 'soft subjects' would not be considered inferior to maths and sciences by the top universities was telling in itself. [4] So, if schools and government are unable or unwilling to stem the tide in favour of more 'commercially useful' subjects, where do those whose career aims do not neatly fall into that category turn?\n\nCharitable institutions which provide grants and bursaries for talented young people are springing up in many countries, or finding themselves in greater demand. Students who were unable to develop their skills for want of the most basic provision — the cost of a musical instrument or the train fare to a drama school audition — are getting their financial needs met, and are also helped in other ways. One such organisation now supports more than 1,000 individuals through different projects, and counts several established actors among its patrons. [5] But the obvious problem with charities is that, by definition, they can't be everywhere, and such an approach is no substitute for a nationwide educational commitment to the arts. The performing arts should not become luxuries for well-off children, because talent doesn't go with money. To bridge this potential inequality, carving out a space for all young people to express themselves creatively is essential. [6] These qualities can do much to shape a more progressive society.\n\nTo achieve this worthy aim, governments should consider not only the inclusion of the expressive arts in all state school curricula, but also investment in teachers who can provide art, drama and music outside the timetable, for the less tangible — but no less valuable — purpose of expanding minds and, yes, growing souls."}], "items": [{"q": "Gap 1", "a": "G", "why": "'allow this to happen' = make your soul grow; 'And it comes with… side-effects'."}, {"q": "Gap 2", "a": "C", "why": "'the latter' = community youth projects."}, {"q": "Gap 3", "a": "E", "why": "'whatever ministers say' contrasts with the politicians' assurances; 'This observation was reinforced…'."}, {"q": "Gap 4", "a": "A", "why": "'hardly seemed to support that' = the school's reassuring letter."}, {"q": "Gap 5", "a": "D", "why": "'Many of them' = the established actors who are patrons."}, {"q": "Gap 6", "a": "F", "why": "'These qualities' = imagination, curiosity and empathy."}], "note": "Extra sentence: B. Answer key written for this app."}, {"id": "re11", "sec": "re", "part": "Part 1", "title": "Part 1 · Short texts (literature, cities, jobs)", "type": "mcq", "instr": "Read each text and choose the answer.", "items": [{"q": "On hearing the professor's words, the narrator feels…", "o": ["committed to ensuring that the work of scientists is better understood.", "determined to make a mark for himself as a famous scientist.", "inspired to discredit the dismissal of ancient scientists."], "a": 1, "why": "'Far more will I achieve' = personal ambition.", "text": "The ancient teachers of this science promised impossibilities and performed nothing. The modern masters promise very little but penetrate into the inner workings of nature. They have discovered how the blood circulates, and the nature of the air we breathe. As the professor went on, the narrator felt as if wrestling with a real enemy; soon his mind was filled with one thought: So much has been done. Far more will I achieve.", "title": "Text A · literary source"}, {"q": "What does the extract suggest about green spaces in cities?", "o": ["They are more advantageous for the happiness of people in poorer areas.", "The explicit reasons as to how they enhance well-being remain uncertain.", "Their inclusion in any future development is sometimes taken for granted."], "a": 1, "why": "'the causal relationship… offers scope for further research' = HOW they help isn't fully understood.", "text": "Earlier research has indicated a clear link between the mental health of city inhabitants and the extent to which they have easy access to green spaces such as parks. Our own research shows a correlation between access to green spaces and the physical health of a city's residents, and this correlation stands after taking into account how prosperous or deprived an area is. While the causal relationship between the two offers scope for further research, there is little doubt that access to green spaces needs to be an important consideration for city planners.", "title": "Text B · research report"}, {"q": "The writer thinks graduates should currently prioritise jobs that…", "o": ["cover the day-to-day costs of general outgoings.", "provide some financial stability for the long-term future.", "correspond with the skillset they have acquired from academia."], "a": 0, "why": "'just have something' + 'make ends meet'. C is what the writer advises against.", "text": "This week's entry looks at graduate jobseeking in the current labour market. Employers tend to exercise caution when hiring. They're less likely to take a chance on unproven talent, so this may be a time to suppress enthusiasm for speculative applications and concentrate on the achievable. It can't be overstated how important it is to just have something, whatever that is. Holding out for a position precisely aligned to your degree won't make it easy to make ends meet, after all.", "title": "Text C · careers blog"}]}, {"id": "re48", "sec": "re", "part": "Part 1", "title": "Part 1 · Medicine texts", "type": "mcq", "instr": "1 min 20 s per text. Watch for negations and exaggerations.", "timer": 6, "items": [{"q": "The writer argues that placebo responses should be…", "o": ["removed more rigorously from the results of clinical trials.", "investigated as a treatment in their own right.", "explained to patients before any treatment begins."], "a": 1, "why": "'why so little effort has gone into understanding how it might be used deliberately'. A is a trap: excluding it from trials is 'entirely proper'.", "text": "That patients improve after receiving an inert treatment has been documented for as long as controlled trials have existed, and the finding is routinely dismissed as noise to be subtracted. This framing is convenient but incoherent. If the ritual of consultation — the attention, the explanation, the expectation of relief — reliably produces measurable change in reported pain and in certain physiological markers, then it is not an artefact obscuring the real effect. It is an effect, and one that clinicians already deploy every day without acknowledging that they do. The question worth asking is not how to eliminate it from trial design, where its exclusion is entirely proper, but why so little effort has gone into understanding how it might be used deliberately.", "title": "Text A · medical journal"}, {"q": "What is Priya's main purpose in writing?", "o": ["to question the statistical methods that have been selected.", "to ask for more time before the protocol is submitted.", "to raise a concern about how widely the findings will apply."], "a": 2, "why": "'would rule out roughly a third of the patients… may not travel very far beyond the trial itself' = external validity.", "text": "Hi Rob, Thanks for sending the draft protocol through — I've read it twice now. The design is elegant, and I can see how much work has gone into the randomisation. I do want to flag one thing before this goes to the committee. The exclusion criteria as written would rule out roughly a third of the patients we actually see on the ward, which means whatever we find may not travel very far beyond the trial itself. I know the statistics come out cleaner this way. I'm just not convinced that cleaner is what we need here. Happy to go through it with you on Thursday if that would help — I'd far rather we sorted it out between us than had it raised in the meeting. Best, Priya", "title": "Text B · an email"}, {"q": "What is the writer's main point about antibiotic resistance?", "o": ["The public has grown indifferent to warnings that are repeated too often.", "The obstacle is a financial one rather than a scientific one.", "Attempts to change prescribing habits have achieved nothing."], "a": 1, "why": "'a poor commercial proposition' + 'Until the economics are addressed'. C exaggerates: campaigns are 'worth having, but they treat a symptom'.", "text": "Every few years a report announces that we are approaching a post-antibiotic era, and every few years the warning is absorbed, repeated and shelved. The science is not in dispute: resistant strains are spreading, and the pipeline of genuinely novel compounds has been close to empty for three decades. What is stated far less plainly is why. Developing a drug that will be held in reserve, prescribed sparingly and superseded within a decade is a poor commercial proposition, and no quantity of alarm about superbugs alters that arithmetic. Campaigns urging patients to finish the course, or doctors to prescribe less, are worth having, but they treat a symptom. Until the economics are addressed — through public funding, guaranteed purchase, or something not yet invented — the reports will keep arriving and very little will change.", "title": "Text C · magazine article"}, {"q": "Why does the reviewer describe the case of the algorithm?", "o": ["to show that the book's central claim is undermined by its own evidence.", "to illustrate the author's warning about reaching conclusions too quickly.", "to criticise the way in which the book has been marketed."], "a": 1, "why": "'how confidently we generalise from a single impressive result'. A reverses the roles; C picks up an aside.", "text": "In her new book, the cardiologist Mei Ferrara devotes an early chapter to a diagnostic algorithm that outperformed a panel of specialists on a set of retrospective scans — a result her publishers have understandably placed on the cover. Readers who stop there will miss her point entirely. Ferrara returns to the case forty pages later to note that the same algorithm, once deployed in a hospital serving a different population, performed worse than the junior doctors it was meant to assist, and that nobody noticed for eleven months. The chapter is not a demonstration of what these systems can do. It is a demonstration of how confidently we generalise from a single impressive result, and how long it can take to find out that we were wrong.", "title": "Text D · book review"}]}, {"id": "re12", "sec": "re", "part": "Part 2", "title": "Part 2 · Social media and language decline", "type": "match", "timer": 8, "instr": "Match each question to A (Mayumi Watanabe), B (Ignacio Duarte) or C (Orla Stevens).", "opts": ["A", "B", "C"], "passages": [{"title": "A · Mayumi Watanabe", "text": "Gatekeepers have wept over slipping standards for hundreds of years, yet communication still functions. Whether social media has a deleterious impact is exceedingly hard to pin down. Language will not die out because we use it through digital devices. Some people find change deeply unsettling, which leads them to find fault with what they perceive to be the source of that change."}, {"title": "B · Ignacio Duarte", "text": "I have seen the debate cause tempers to flare in departmental meetings. The capacity for instantaneous interaction is a quantum leap forward. While polished prose has its place, social media should have its own style. Crucially, I can navigate both landscapes, and so can my digital-native students. The offended purists would do well to revisit their judgemental stance."}, {"title": "C · Orla Stevens", "text": "The abbreviated nature of comments can infuriate some scholarly types. This is not necessarily their fault; they have been conditioned to think of language in a certain way. The enduring beauty of language is its fluidity — to imagine it can be trapped is absurd. A Dutch linguist confirmed that digital language does not negatively impact young people's essays. Restrictions on message length appear to have inspired users to become more inventive."}], "items": [{"q": "Who suggests that attempts to hold back evolution in language are ultimately pointless?", "a": "C", "why": ""}, {"q": "Who has some empathy for people who instinctively dislike social media language?", "a": "C", "why": ""}, {"q": "Who mentions disputes among colleagues over social media and language use?", "a": "B", "why": ""}, {"q": "Who claims that concern about language decline is far from being a new occurrence?", "a": "A", "why": ""}, {"q": "Who admits to adapting the way they use language on social media?", "a": "B", "why": ""}, {"q": "Who links a potentially adverse feature of certain social media with enhanced language performance?", "a": "C", "why": ""}, {"q": "Who believes criticism of social media's influence is motivated by a strong sense of discomfort?", "a": "A", "why": ""}]}, {"id": "re46", "sec": "re", "part": "Part 2", "title": "Part 2 · Moving to another country", "type": "match", "timer": 8, "instr": "Match each question to Nadia (A), Tomás (B) or Aiko (C). Not one word from the questions appears in the texts.", "opts": ["A", "B", "C"], "passages": [{"title": "A · Nadia", "text": "I qualified as a paediatrician in Cairo and moved to Hamburg eleven years ago. Everyone assumes the language must have been the obstacle, and my German was certainly poor at the start, but what actually held me up was paperwork — eighteen months of it, during which I was not permitted to practise at all. I had braced myself for homesickness and for the winters; nobody had thought to warn me that my qualifications would arrive as a claim to be verified rather than as a fact. My colleagues were welcoming, and one of them gave up several of his own weekends to help me assemble the file, without anyone asking him to. What strikes me now is that the younger doctors arriving from abroad go through a process that is, if anything, slower than mine was, and I catch myself telling them it will all be fine — which is not entirely honest of me."}, {"title": "B · Tomás", "text": "I left a village near Braga for Geneva at twenty-three, with a job on a building site arranged by a cousin. The money was extraordinary by the standards of home, and I sent most of it back for six years without asking myself many questions about where any of it was going. Then my knees gave out, as knees do in that trade, and I discovered I had no plan whatsoever — it had simply never occurred to me that the work might stop before I chose to stop. I retrained as an electrician at thirty-one, in a language I had picked up on scaffolding rather than in a classroom, which was a humbling experience. I still run into men who arrived the same year I did and who are doing exactly what we all did then, and I would not dream of saying a word to them about it. That is nobody's business but theirs."}, {"title": "C · Aiko", "text": "My grandparents left Okinawa for São Paulo in the 1930s, and I made the journey in reverse at twenty-six, going 'back' to a country I had never set eyes on. I had expected to be received as Japanese, and I was received as Brazilian, which threw me completely — in Brazil I had always been the Japanese one. The factory work was hard but the isolation was harder, and it took the best part of a year before I worked out that every other returnee on my shift felt precisely the same way and simply never brought it up. I have stayed fifteen years now. The question of where I belong has never really settled itself, though it bothers me a great deal less than it once did."}], "items": [{"q": "Who was taken aback by the identity that others assigned to them?", "a": "C", "why": "'taken aback' ↔ 'threw me completely'."}, {"q": "Who mentions assistance offered by someone acting entirely on their own initiative?", "a": "A", "why": "The cousin arranges a job (family), not spontaneous help."}, {"q": "Who admits to presenting a more encouraging picture than the facts justify?", "a": "A", "why": ""}, {"q": "Who had never considered the possibility that a situation might end involuntarily?", "a": "B", "why": ""}, {"q": "Who took a considerable time to discover that a feeling was widely shared?", "a": "C", "why": ""}, {"q": "Who deliberately avoids passing judgement on other people's choices?", "a": "B", "why": ""}]}, {"id": "re47", "sec": "re", "part": "Part 3", "title": "Part 3 · Letting go of the landscape", "type": "match", "timer": 11, "instr": "Six sentences have been removed. Choose from A–H. There are two extra sentences.", "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "optsfull": ["A · Where a scheme depends on the cooperation of dozens of smallholders, a single refusal can render an entire corridor unworkable.", "B · What works on marginal English clay has very little to say about alpine pasture or the Iberian dehesa.", "C · Within a decade, on the standard account, a single predator had remodelled the physical structure of an entire valley.", "D · Reintroducing a large carnivore, by contrast, requires no consultation whatsoever and can be completed within a single season.", "E · The approach had obvious merits, but it treated nature as an exhibit to be preserved rather than as a system to be set in motion.", "F · Its owners turned to rewilding not out of conviction but because the farm's heavy clay soil had made conventional arable production unprofitable.", "G · Several recent reviews conclude that the wolves' contribution, while real, was substantially smaller than the popular version allows.", "H · Visitor numbers at the reserve have fallen every year since the scheme was introduced."], "passages": [{"title": "Letting go of the landscape", "text": "For most of the last century, conservation in Europe meant holding a line. Reserves were fenced, species lists were compiled, and success was measured by how closely a landscape resembled its condition at some earlier date. [1] Rewilding proposes something considerably less tidy: restore the processes that shape an ecosystem, and then decline to manage the outcome.\n\nThe most frequently cited example is the return of wolves to Yellowstone in 1995. Elk numbers fell, willow and aspen recovered along the riverbanks, and beavers followed. [2] The story travelled widely, not least because it was so easy to tell.\n\nEcologists have since grown more cautious. Rainfall patterns, hunting pressure and the recovery of the bear population all shifted over the same period, and separating their effects from those of the wolves has proved stubbornly difficult. [3] That does not make the underlying principle wrong; it makes the evidence a good deal thinner than the headlines implied.\n\nIn Europe the obstacles are rarely biological. The continent's landscapes have been farmed for millennia, and the people who farm them have opinions. [4] The projects that have succeeded — the Oostvaardersplassen in the Netherlands, the Knepp estate in southern England — have generally done so where ownership was concentrated in few hands and the land was already marginal.\n\nKnepp is instructive for a second reason. [5] Free-roaming pigs, cattle and ponies now perform the work that machinery once did, and the estate earns considerably more from ecotourism and meat than it ever did from wheat.\n\nNone of which amounts to a template. [6] What rewilding offers is not a destination but a change of question: instead of asking what a landscape ought to look like, it asks what should be permitted to happen there."}], "items": [{"q": "Gap 1", "a": "E", "why": "'The approach' points back to 'holding a line'."}, {"q": "Gap 2", "a": "C", "why": "Closes the elk → willow → beavers chain."}, {"q": "Gap 3", "a": "G", "why": "The only sentence that qualifies the wolves' role."}, {"q": "Gap 4", "a": "A", "why": "Develops 'the people who farm them have opinions'."}, {"q": "Gap 5", "a": "F", "why": "'Its owners' = Knepp; money vs wheat."}, {"q": "Gap 6", "a": "B", "why": "Justifies 'None of which amounts to a template'."}], "note": "Extras: D contradicts paragraph 4; H is impossible next to 'earns more from ecotourism'. Gapped-text distractors are usually contradictory, not irrelevant."}, {"id": "re45", "sec": "re", "part": "Part 4", "title": "Part 4 · Flexibility, and who actually gets it", "type": "mcq", "timer": 8, "instr": "Read the article and choose A, B or C. 8 minutes.", "passage": {"title": "Flexibility, and who actually gets it", "text": "Few developments in the labour market have generated as much heat and as little light as the rise of platform work. The arrangement is familiar enough: individuals are engaged task by task through an app rather than employed by the hour, and are paid per delivery, per ride, per completed job. Its advocates present it as the logical endpoint of a long march towards flexibility; its critics see a rebranding of the casual labour that most industrialised economies spent the twentieth century dismantling. What is remarkable is how seldom either camp pauses to examine the numbers it deploys so confidently. Estimates of the sector's size differ by a factor of five, depending almost entirely on whether someone who drives for two hours a month is counted alongside someone who drives for fifty hours a week.\n\nThe flexibility claim deserves closer scrutiny than it customarily receives. Survey after survey finds that couriers and drivers place a high value on choosing their own hours, and it would be condescending to dismiss this as some sort of illusion. Yet the same surveys reveal that a sizeable minority feel unable to turn work down without their standing on the platform quietly deteriorating. Algorithms reward availability, and the penalty for declining is rarely stated but widely understood. Flexibility, then, is real; it is simply distributed unevenly, accruing most generously to those who need it least.\n\nThe regulatory response has been fragmentary. Courts in several countries have found platform workers to be employees in all but name, only for legislatures to introduce exemptions within months. It would be easy, and lazy, to read this as political timidity. The difficulty is structural: employment law was built around a division that platform work straddles, and every attempt to force these workers into one category or the other produces consequences nobody intended — protections that eliminate the very flexibility workers say they value, or freedoms that leave them carrying risks they cannot absorb.\n\nSome economists reach for historical parallels, likening platform workers to the dock labourers who once gathered at the gates each morning in the hope of a day's hire. The comparison is seductive and, on inspection, misleading. The dock worker's insecurity arose from a surplus of labour and an absence of information; the platform worker's arises from an abundance of information held by one party only. Understanding that difference matters, because the remedies designed for the first problem — hiring halls, registration schemes, seniority rules — address almost nothing in the second.\n\nNone of this argues for inaction. It argues for a narrower and more honest set of questions. Who bears the cost when demand collapses? Who owns the data that determines what a worker is offered, and at what price? Answer those, and a good deal of the philosophical argument about employment status becomes secondary. Leave them unanswered, and no amount of reclassification will make much difference to the people doing the work."}, "items": [{"q": "In the first paragraph, the writer is mainly concerned with…", "o": ["the speed at which platform work has spread across industries.", "the weakness of the evidence on which both sides rely.", "the historical origins of casual forms of employment."], "a": 1, "why": "'how seldom either camp pauses to examine the numbers'. C recycles 'twentieth century'.", "text": "", "title": ""}, {"q": "What does the writer conclude about flexibility?", "o": ["Workers have been misled about how much of it they really have.", "It matters far less to workers than commentators assume.", "Those in the weakest position benefit from it least."], "a": 2, "why": "'accruing most generously to those who need it least'.", "text": "", "title": ""}, {"q": "Why does the writer mention the actions of courts and legislatures?", "o": ["to show that the law has been applied inconsistently from place to place.", "to suggest that the problem does not fit the categories available.", "to argue that politicians have avoided taking a difficult decision."], "a": 1, "why": "'It would be easy, and lazy, to read this as political timidity' → C is the rejected reading.", "text": "", "title": ""}, {"q": "The writer refers to dock labourers in order to…", "o": ["warn against a comparison that conceals more than it reveals.", "demonstrate how little working conditions have improved.", "identify measures from the past that could be reintroduced."], "a": 0, "why": "'seductive and, on inspection, misleading'.", "text": "", "title": ""}, {"q": "What is the writer doing in the final paragraph?", "o": ["accepting that no satisfactory solution is currently available.", "calling for platform workers to be reclassified without delay.", "proposing that the debate be rebuilt around more specific questions."], "a": 2, "why": "'a narrower and more honest set of questions'.", "text": "", "title": ""}]}, {"id": "wrerr", "sec": "wr", "part": "Error clinic", "title": "Correct your own mistakes", "type": "rewrite", "instr": "These sentences come from your own writing. Rewrite each one correctly, then compare.", "items": [{"q": "Massive enterprises count with quickly delivering in considerable cities.", "a": "Large corporations can rely on fast delivery to major cities.", "lead": ""}, {"q": "It could be cause by an unstable housing.", "a": "It could be caused by unstable housing.", "lead": ""}, {"q": "One crucial factor to consider are breaks.", "a": "One crucial factor to consider is breaks.", "lead": ""}, {"q": "What the companies fails to consider is the season.", "a": "What companies fail to consider is the season.", "lead": ""}, {"q": "Not only does educational games facilitate children progression, but it also put them in realistic situation.", "a": "Not only do educational games facilitate children's progress, but they also put them in realistic situations.", "lead": ""}, {"q": "Offering flexible working arrangement significantly enhance employee retention.", "a": "Offering flexible working arrangements significantly enhances employee retention.", "lead": ""}, {"q": "They may be distracted of the real world in their firstly years.", "a": "They may be distracted from the real world in their early years.", "lead": ""}, {"q": "Smartphones affect to the level of concentration.", "a": "Smartphones affect the level of concentration.", "lead": ""}, {"q": "Small businesses have to face with numerous complications.", "a": "Small businesses have to face numerous complications.", "lead": ""}, {"q": "The smartphone's overuse has been a critical preoccupation.", "a": "Smartphone overuse has become a major concern.", "lead": ""}, {"q": "All in consider, the more disconnected individuals could be, the more reconnected they are.", "a": "All things considered, the more disconnected individuals are, the more connected to the real world they become.", "lead": ""}, {"q": "I am concern about call of without much time.", "a": "I'm sorry to call it off at such short notice.", "lead": ""}, {"q": "I look forward for your reply.", "a": "I look forward to your reply. | I look forward to hearing from you.", "lead": ""}, {"q": "The transition is a hardly challenge.", "a": "The transition is a considerable challenge.", "lead": ""}, {"q": "Whereas many individuals may support that it is expensive, it's yielded a high return.", "a": "While many may argue that it is expensive, it has yielded a high return.", "lead": ""}, {"q": "Humanity must act against the growing consume of plastic.", "a": "Humanity must act against the growing consumption of plastic.", "lead": ""}]}, {"id": "wr15", "sec": "wr", "part": "Register", "title": "Informal → formal", "type": "gap", "instr": "Complete the formal version.", "items": [{"q": "We aren't going to be able to drive around. → Motor vehicles are ___.", "a": ["prohibited"]}, {"q": "Look after the things in the apartment. → Take reasonable ___.", "a": ["care of the contents", "care"]}, {"q": "It'll be our fault if we break anything. → You are ___ for any damage.", "a": ["liable"]}, {"q": "If nothing bad has happened. → If no damage has ___.", "a": ["occurred"]}, {"q": "Tell them in advance. → ___ us in advance.", "a": ["Notify"]}, {"q": "We'll get it all back. → It will be ___ in full.", "a": ["refunded"]}]}, {"id": "wr34", "sec": "wr", "part": "Language", "title": "Raise the register", "type": "gap", "instr": "Replace the word(s) in CAPITALS with a C1 alternative.", "items": [{"q": "The policy had a BAD effect on small businesses. → a ___ effect", "a": ["detrimental", "adverse"]}, {"q": "A LOT OF PEOPLE were affected by the decision. → ___", "a": ["numerous individuals", "a considerable number of people", "a large number of people"]}, {"q": "Researchers DID a study on urban pollution. → ___", "a": ["conducted", "carried out", "undertook"]}, {"q": "Experts SAY that the situation will worsen. → ___", "a": ["contend", "maintain", "warn", "argue"]}, {"q": "The report SHOWS a clear link between the two. → ___", "a": ["reveals", "demonstrates", "highlights"]}, {"q": "The most important THING here is education. → ___", "a": ["factor", "issue", "aspect"]}, {"q": "This is a VERY GOOD solution. → a highly ___ solution", "a": ["effective", "viable"]}, {"q": "There is a SMALL risk of failure. → a ___ risk", "a": ["negligible", "minimal"]}]}, {"id": "wr35", "sec": "wr", "part": "Language", "title": "Evidence frames", "type": "gap", "instr": "Complete each frame with the missing word.", "items": [{"q": "A study ___ by the University of Bristol confirms that remote work increases productivity.", "a": ["conducted"]}, {"q": "A growing ___ of evidence indicates that screen time affects sleep quality.", "a": ["body"]}, {"q": "Statistics ___ by the Ministry reveal a sharp decline in enrolment.", "a": ["released", "published"]}, {"q": "This claim is ___ out by the findings of several recent surveys.", "a": ["borne"]}, {"q": "The evidence cited in support of this view is largely ___.", "a": ["anecdotal"]}, {"q": "Recent findings have ___ doubt on this assumption.", "a": ["cast"]}, {"q": "Nowhere is this more ___ than in the case of the Nordic countries.", "a": ["apparent", "evident"]}]}, {"id": "wr36", "sec": "wr", "part": "Language", "title": "Reporting verbs for the summary", "type": "gap", "instr": "Complete with: acknowledges · attributes · calls for · casts doubt on · draws attention to · warns (once each).", "items": [{"q": "The first text ___ the rise in obesity to sedentary lifestyles.", "a": ["attributes"]}, {"q": "The second writer ___ that the situation may worsen without intervention.", "a": ["warns"]}, {"q": "The author ___ stricter regulation of the industry.", "a": ["calls for"]}, {"q": "The report ___ the widely held belief that money buys happiness.", "a": ["casts doubt on"]}, {"q": "The professor ___ that his own data are limited.", "a": ["acknowledges"]}, {"q": "The article ___ an aspect of the debate that is often ignored.", "a": ["draws attention to"]}]}, {"id": "wr37", "sec": "wr", "part": "Language", "title": "Paraphrase: the 4 operations", "type": "rewrite", "instr": "Rewrite each sentence using the operation indicated.", "items": [{"q": "(nominalise) Companies implemented the new policy quickly.", "a": "The rapid implementation of the new policy…", "lead": ""}, {"q": "(change the voice) Critics attacked the government's plan.", "a": "The government's plan came under attack from critics.", "lead": ""}, {"q": "(change the word class) Electric cars are becoming increasingly popular.", "a": "The popularity of electric cars continues to grow.", "lead": ""}, {"q": "(synonyms) A lot of people think the problem is very big.", "a": "A considerable number of individuals regard the issue as substantial.", "lead": ""}, {"q": "(free) Advertising makes people want things they cannot afford.", "a": "Advertising generates desires for goods that lie beyond consumers' means.", "lead": ""}]}, {"id": "wr38", "sec": "wr", "part": "Language", "title": "Concession → refutation", "type": "match", "instr": "Match each concession (1–4) with its refutation (A–D).", "opts": ["A", "B", "C", "D"], "optsfull": ["A · …yet this benefit is frequently offset by the environmental cost borne by local communities.", "B · …however, the evidence from Scandinavia suggests precisely the opposite.", "C · …but this objection overlooks the hidden environmental cost embedded in imported goods.", "D · …yet the depth of those connections remains open to question."], "items": [{"q": "Granted, local produce is often more expensive, …", "a": "C", "why": ""}, {"q": "Admittedly, social media connects people across continents, …", "a": "D", "why": ""}, {"q": "Critics would no doubt argue that regulation stifles innovation, …", "a": "B", "why": ""}, {"q": "It would be naive to deny that tourism brings revenue, …", "a": "A", "why": ""}], "note": "The refutation never denies the concession: it reframes it (hidden cost, quality vs quantity, counter-example, trade-off)."}, {"id": "wr39", "sec": "wr", "part": "Language", "title": "Hedge these claims", "type": "rewrite", "instr": "Soften these over-confident statements.", "items": [{"q": "Everybody knows that social media is bad for teenagers.", "a": "It is widely acknowledged that social media can have a detrimental effect on adolescents.", "lead": ""}, {"q": "It is obvious that this policy will fail.", "a": "It is by no means certain that this policy will achieve its intended aims.", "lead": ""}, {"q": "Technology always destroys jobs.", "a": "There is a tendency for technological change to displace certain types of employment.", "lead": ""}, {"q": "Money is the only reason people work.", "a": "Financial reward may, at least in part, account for people's motivation to work.", "lead": ""}]}, {"id": "wr41", "sec": "wr", "part": "Language", "title": "From B1 to C1", "type": "rewrite", "instr": "Rewrite these sentences at C1 level.", "items": [{"q": "There are a lot of problems with the education system and it is very bad.", "a": "The education system faces numerous shortcomings, several of which are becoming increasingly difficult to ignore.", "lead": ""}, {"q": "I think that people do not know about recycling and this is a big thing.", "a": "Public awareness of recycling remains alarmingly low, and this is arguably one of the most pressing issues at stake.", "lead": ""}, {"q": "Technology is good but it is also bad, so we must be careful.", "a": "Technology is very much a double-edged sword: while it undeniably enhances efficiency, it simultaneously raises pressing ethical concerns.", "lead": ""}, {"q": "There is a lot of pollution because there are a lot of cars.", "a": "Air pollution can largely be attributed to vehicle emissions, which continue to rise in most urban centres.", "lead": ""}]}, {"id": "wr40", "sec": "wr", "part": "Language", "title": "Ideas bank: one C1 sentence", "type": "rewrite", "instr": "Write ONE C1 sentence defending the position indicated, then compare with the model.", "items": [{"q": "Competitive sport should be removed from schools. (against)", "a": "Healthy competition motivates students to reach their full potential and instils a self-discipline that carries over into adult life.", "lead": ""}, {"q": "Advertising aimed at children should be banned. (for)", "a": "By running constant campaigns aimed at a particular age group, advertisers manufacture needs that young consumers are not yet equipped to question.", "lead": ""}, {"q": "Globalisation is destroying local cultures. (against)", "a": "Exposure to different cultures broadens people's horizons, but this does not mean they will neglect the customs of their own country.", "lead": ""}, {"q": "People should be made to work until they are 70. (against)", "a": "It is unreasonable to expect people to remain in employment until seventy, particularly in physically demanding occupations.", "lead": ""}, {"q": "Cities are better places to live than the countryside. (against)", "a": "Living in a metropolis offers unparalleled convenience, yet it can also induce a profound sense of urban alienation.", "lead": ""}]}, {"id": "wr13", "sec": "wr", "part": "Essay", "title": "Essay: choosing a career", "type": "write", "kind": "essay", "task": "You have been discussing career choices in class. Your tutor has asked you to write an essay: 'What factors should people consider most carefully when choosing a career?' Include TWO of the following: qualifications · pay · job satisfaction.", "min": 220, "max": 280, "minutes": 30, "checklist": ["I rephrased the prompt instead of copying it", "Clear thesis + the two points announced", "I developed exactly TWO ideas, not three", "4 C1 structures: inversion, cleft, impersonal passive, inverted conditional", "At least one evidence phrase (A study conducted by…)", "One concession with its refutation", "A different connector per paragraph, no repeated 'also'", "Between 220 and 280 words", "Final check: -s · articles · prepositions · repeated connectors"], "model": "Choosing a career is arguably one of the most significant decisions young people face today. Among the many factors involved, two aspects stand out: the salary a job offers and the satisfaction it brings. This essay will argue that, while pay cannot be ignored, job satisfaction plays a more decisive role in the long run.\n\nThe most compelling argument in favour of prioritising pay is that financial security underpins almost every other aspect of life. It stands to reason that a well-paid position makes it easier to secure a mortgage and make ends meet, particularly given the rising cost of living. Granted, a high salary does not guarantee happiness; however, it would be naive to deny that money removes a considerable source of stress.\n\nWhat many graduates tend to overlook, nonetheless, is the long-term impact of a monotonous job. A growing body of evidence indicates that employees who find their work fulfilling are more productive and far less likely to suffer burnout. Not only does job satisfaction foster motivation, but it also encourages people to develop new skills, which in turn improves their career prospects. Were someone to choose a career purely for financial reasons, they could well find themselves trapped in a role that takes a heavy toll on their well-being.\n\nIn conclusion, the question of how to
