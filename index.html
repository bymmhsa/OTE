 of accomplishment that boosts their self-confidence.<\/li><li>Competition does not always promote team spirit; weaker students may be laughed at and suffer embarrassment.<\/li><li>Competition can motivate determined students but stress those who lack self-confidence.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-work", "ch": "vg", "part": "Ideas by topic", "title": "Work, languages & equality", "sub": "", "html": "<h3>The job market<\/h3><ul class=\"ideas\"><li>To compete in the job market you need to be well equipped for the position and hold suitable qualifications.<\/li><li>Meeting the basic requirements alone will not get you very far in terms of employment prospects.<\/li><li>To secure a job you must impress employers not only with academic achievements but also with your social skills.<\/li><li>Formal qualifications alone will not get candidates very far in a saturated job market.<\/li><li>In a rapidly evolving economy, professionals must adopt a mindset of continuous upskilling.<\/li><\/ul><h3>Foreign languages<\/h3><ul class=\"ideas\"><li>Students exposed to two or more languages acquire better communicative abilities and gain access to two different worlds.<\/li><li>Fluency in a foreign language is not merely a medium of communication but a means of surpassing cultural barriers.<\/li><li>Learners should avoid falling back on their dominant language and maximise their exposure to the new one.<\/li><\/ul><h3>Working environment<\/h3><ul class=\"ideas\"><li>A pleasant working environment generates positive feelings and increases productivity.<\/li><li>Employees should not be treated as commodities; teamwork and team spirit trigger motivation.<\/li><li>Offering flexible working arrangements significantly enhances employee retention rates.<\/li><li>Prolonged exposure to high-pressure environments takes a heavy toll on mental health, frequently culminating in burnout.<\/li><li>Constant connectivity blurs the boundaries between work and personal life, leading to digital fatigue.<\/li><\/ul><h3>Equality<\/h3><ul class=\"ideas\"><li>Several employers remain reluctant to employ women owing to discrimination and prejudice.<\/li><li>Women face obstacles in the workplace, from harassment to being overlooked for promotion.<\/li><li>Women are often underpaid despite doing the same job as their male counterparts.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-media", "ch": "vg", "part": "Ideas by topic", "title": "Media, advertising & television", "sub": "", "html": "<h3>The media<\/h3><ul class=\"ideas\"><li>Journalism has become a highly competitive market; as a result, unscrupulous journalists publish misleading stories with sensational headlines.<\/li><li>If you do not read between the lines, you run the risk of being misled.<\/li><li>Social media algorithms are engineered to maximise engagement, often creating echo chambers that polarise public discourse.<\/li><li>The democratisation of information has empowered citizens but also facilitated the rapid spread of misinformation.<\/li><\/ul><h3>Advertising<\/h3><ul class=\"ideas\"><li>Advertising not only informs people about new products but also <b class=\"hl\">creates a need<\/b> to buy.<\/li><li>Consumers are constantly bombarded by adverts which create desires and shape buying habits.<\/li><li>By running constant campaigns aimed at a particular age group, advertisers manufacture needs for overpriced products.<\/li><li>Materialism fuelled by advertising affects teenagers most, as they try to be accepted by their peers.<\/li><\/ul><h3>Television<\/h3><ul class=\"ideas\"><li>Television is an inexpensive form of entertainment and, for some, the only source of leisure.<\/li><li>People who watch too much TV risk becoming couch potatoes, with devastating consequences for their health.<\/li><li>Television does not merely mirror society; it has a great impact on it.<\/li><li>It is the parents' responsibility to monitor children's viewing.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-global", "ch": "vg", "part": "Ideas by topic", "title": "Globalisation & the internet", "sub": "", "html": "<h3>Globalisation and identity<\/h3><ul class=\"ideas\"><li>Many oppose globalisation because it weakens national identities.<\/li><li>It is vital that traditions <b class=\"hl\">be kept<\/b> alive so that a sense of national identity can develop. (subjunctive)<\/li><li>Exposure to different cultures broadens people's horizons, but this does not mean they will neglect their own customs.<\/li><li>Cultural heritage should be passed down from generation to generation.<\/li><\/ul><h3>The internet<\/h3><ul class=\"ideas\"><li>The internet is an invaluable research tool, providing a wealth of knowledge at the press of a button.<\/li><li>Reliance on the internet can prove problematic, as people forget to think for themselves.<\/li><li>Information overload and over-dependence on technology are two negative aspects of the internet.<\/li><li>The fact that the internet is less time-consuming and highly efficient arguably outweighs the disadvantages.<\/li><\/ul><h3>Cybercrime and communication<\/h3><ul class=\"ideas\"><li>Being online makes you instantly vulnerable, which is why you should take precautions against e-crime.<\/li><li>What looks harmless on the surface may hide serious dangers.<\/li><li>Computers can lead to social isolation; online social skills have little to do with real-life ones.<\/li><li>As data breaches become increasingly sophisticated, organisations must bolster their digital defences.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-health", "ch": "vg", "part": "Ideas by topic", "title": "Stress, health & ageing", "sub": "", "html": "<h3>Stress<\/h3><ul class=\"ideas\"><li>Stress is said to be the illness of our time, as it lies behind many related conditions.<\/li><li>It is important to divert negative energy into something creative.<\/li><li>We should make time for ourselves and recharge our batteries rather than filling our schedules.<\/li><li>People who find a balance between work and leisure feel fulfilled and relaxed.<\/li><\/ul><h3>Health and body image<\/h3><ul class=\"ideas\"><li>Our society is obsessed with image, but extreme dieting can cause severe health problems.<\/li><li>Doctors recommend a balanced diet and regular exercise rather than restrictive regimes.<\/li><li>Chronic sleep deprivation can severely compromise cognitive function.<\/li><li>Public health campaigns are crucial for dispelling misconceptions about vaccines.<\/li><\/ul><h3>The elderly<\/h3><ul class=\"ideas\"><li>Life expectancy is on the increase owing to medical breakthroughs.<\/li><li>It is difficult for the elderly to rely solely on the welfare state; many struggle to make ends meet.<\/li><li>It is unreasonable to expect people to remain in employment until they are seventy.<\/li><li>One of the greatest fears of the elderly is being neglected by society and by their loved ones.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-env", "ch": "vg", "part": "Ideas by topic", "title": "Environment, cities & tourism", "sub": "", "html": "<h3>Climate change<\/h3><ul class=\"ideas\"><li>It would make a significant difference if governments economised on natural resources and invested in renewable energy.<\/li><li>Deforestation is increasing at such an alarming rate that reforestation should be a matter of urgency.<\/li><li>The international community must curb emissions if irreversible damage is to be prevented.<\/li><\/ul><h3>Waste and recycling<\/h3><ul class=\"ideas\"><li>It is imperative that the issue of waste <b class=\"hl\">be addressed<\/b> so as to reduce health hazards.<\/li><li>Governments should use the media to raise public awareness of recycling.<\/li><li>If governments do not tackle this issue immediately, the consequences will be catastrophic in the long run.<\/li><\/ul><h3>Cities and the countryside<\/h3><ul class=\"ideas\"><li>The migration from rural to urban areas leads to the depopulation of villages.<\/li><li>In search of a brighter future, people move to overcrowded areas and join the rat race.<\/li><li>Skyrocketing property values have made it nearly impossible for young people to get a foot on the housing ladder.<\/li><li>Gentrification creates a vibrant atmosphere, albeit at the cost of displacing long-term residents.<\/li><li>Investing in reliable public transport is the most effective way to reduce a city's carbon footprint.<\/li><\/ul><h3>Tourism<\/h3><ul class=\"ideas\"><li>Tourism provides local employment and boosts the economy through foreign exchange.<\/li><li>Tourism may bring unwanted changes to an area and cause pollution, noise and litter.<\/li><li>Overtourism threatens pristine environments: Maya Bay had to be closed after irresponsible tourism destroyed its coral.<\/li><\/ul>", "tags": ""}, {"id": "vg-ideas-c1", "ch": "vg", "part": "Ideas by topic", "title": "High-C1 ideas by academic field", "sub": "For the essay and Part 5 follow-up questions", "html": "<div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Psychology<\/div><ul class=\"ideas\"><li>Individuals rely on heuristics to simplify choices, which can lead to cognitive biases.<\/li><li>Memories are not passive recordings; we actively reconstruct them.<\/li><li>Emotional resilience enables people to bounce back from adversity.<\/li><li>Extrinsic rewards can undermine intrinsic motivation.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Learning<\/div><ul class=\"ideas\"><li>A learner-centred approach fosters critical thinking rather than regurgitating facts.<\/li><li>Adult learners struggle to eradicate fossilised errors.<\/li><li>Constant exposure to comprehensible input helps absorb structures subconsciously.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Nature<\/div><ul class=\"ideas\"><li>The introduction of an invasive species can disrupt the delicate equilibrium of an ecosystem.<\/li><li>Coral reefs act as marine nurseries; their degradation has a ripple effect on the food chain.<\/li><li>Rising sea levels present an existential threat to low-lying communities.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Society<\/div><ul class=\"ideas\"><li>The widening wealth gap poses a significant threat to social cohesion.<\/li><li>Grassroots movements play a pivotal role in driving legislative reform.<\/li><li>Rapid modernisation often comes at the expense of local heritage.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Technology<\/div><ul class=\"ideas\"><li>Generative AI has sparked intense debate about intellectual property.<\/li><li>While automation streamlines supply chains, it threatens to displace manual workers.<\/li><li>Telemedicine allows remote consultations for patients in rural areas.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Business & arts<\/div><ul class=\"ideas\"><li>Micromanagement can stifle creativity and lead to high staff turnover.<\/li><li>Disruptive innovation can upend an established industry.<\/li><li>Public funding for the arts is essential to nurture local talent.<\/li><li>Street art is now recognised as a legitimate form of cultural expression.<\/li><\/ul><\/div><\/div>", "tags": ""}, {"id": "vg-mine", "ch": "vg", "part": "Your additions", "title": "Everything you've added", "sub": "Your own words, idioms, structures and phrases", "html": "<p class=\"lead\">Learnt something new in class, in a series or in a book? Press <b class=\"hl\">＋<\/b> (bottom-right, on every screen), type it with its meaning and an example, and the app files it in the right section of the Classbook, adds it to Flashcards and builds exercises with it in <b class=\"hl\">Workbook › My words<\/b>.<\/p><div class=\"my-page\"><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">How the app decides where it goes<\/span><\/div><p>Phrasal verbs (verb + particle) → Phrasal verbs · fixed expressions of 3+ words → Idioms · connectors (however, in light of…) → Connectors · patterns with + or … (Not only + aux + S…) → the matching Grammar page · sentence frames with […] → Essay, Summary or Speaking phrases · 'X → Y' → Upgrades · single words → the topic they talk about (money, health, travel…) or your Notebook. You can always change the destination before saving.<\/p><\/div>", "tags": ""}, {"id": "sp-overview", "ch": "sp", "part": "The test", "title": "Speaking at a glance", "sub": "5 parts · about 15 minutes · marked by a human", "html": "<div class=\"box score\"><div class=\"box-h\"><span class=\"box-tag\">Your score<\/span><span class=\"box-t\">Speaking is your priority<\/span><\/div><p>Your August 2026 result: <b class=\"hl\">Speaking 128<\/b> (B2) · Reading 140 · Writing 140 · Listening 141 (C1). To reach C1 overall, Speaking is where the points are. Expand every answer, use 2–3 C1 structures per part and time yourself.<\/p><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Part<\/th><th>Task<\/th><th>Prep / answer<\/th><th>What is assessed<\/th><\/tr><\/thead><tbody><tr><td>1 · Interview<\/td><td>6 personal questions (Q1–2 not marked)<\/td><td>10 s / 30 s<\/td><td>Opinions, speculating about past/future, hypothesising, describing, advising<\/td><\/tr><tr><td>2 · Voice message<\/td><td>A delicate situation (cancel, complain, ask for a change)<\/td><td>10 s / 40 s<\/td><td>Diplomacy, empathy, problem-solving<\/td><\/tr><tr><td>3 · Summary<\/td><td>Listen to two experts, summarise what they agree on<\/td><td>40 s / 50 s<\/td><td>Main ideas, synthesis, paraphrase, circumlocution<\/td><\/tr><tr><td>4 · Debate<\/td><td>Argue for/against a statement with 2–3 given ideas<\/td><td>45 s / 2 min<\/td><td>Complex argument, connecting factors, uncertainty<\/td><\/tr><tr><td>5 · Follow-up<\/td><td>4 questions linked to the debate<\/td><td>— / 40 s each<\/td><td>Speculation, critical comments, comparing alternatives<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Recorded by a computer<\/span><\/div><p>You speak to a computer with headphones; nobody is in front of you. The timer moves on automatically, so <b class=\"hl\">never stop early<\/b>: keep talking with a small error rather than freezing.<\/p><\/div><button class=\"goto\" data-goto=\"wb:speaking\">Practise with timers in the Workbook →<\/button>", "tags": ""}, {"id": "sp-part1", "ch": "sp", "part": "Part 1 · Interview", "title": "Personal answers", "sub": "Expand: reason + example + detail", "html": "<div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Hypothesise<\/div><div class=\"step-b\">Use 2nd and 3rd conditionals instead of flat facts: <b class=\"hl\">If I were<\/b> going out, it <b class=\"hl\">would be<\/b> much more entertaining… · <b class=\"hl\">If my family had been<\/b> sporty, <b class=\"hl\">I would have been<\/b> more interested…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Show nuance<\/div><div class=\"step-b\">Avoid yes/no: <b class=\"hl\">Well, I guess it depends on<\/b> what I'm doing.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Describe precisely<\/div><div class=\"step-b\">Upgrade good/nice to <b class=\"hl\">breathtaking, fascinating, peaceful, magical, intricate, trivial<\/b>.<\/div><\/div><\/div><\/div><h3>Ready-made openers<\/h3><ul class=\"ideas\"><li>I'm originally from <u>_, where I was born, but I was brought up in <\/u>_, a coastal town in the north, where I've spent most of my life.<\/li><li>I'm currently in my fourth year of Biomedical Sciences, which aligns with my career aspirations.<\/li><li>To be honest, I'm still exploring my career options.<\/li><li>I'm keen on / I'm a huge fan of / I'm really fond of / I like nothing more than…<\/li><li>I'm an avid reader / cyclist / traveller.<\/li><li>I'm itching to try… (= I really want to)<\/li><li>I'm not at all keen on extreme sports.<\/li><li>In my spare time I tend to…, as it helps me <b class=\"hl\">unwind<\/b> and escape the stresses and strains of day-to-day life.<\/li><\/ul><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">A 30-second answer<\/span><\/div><blockquote class=\"model-text\">Thinking about it, I'd say a daily routine is <b class=\"hl\">essential<\/b>, at least for me. <b class=\"hl\">If I didn't<\/b> plan my week, I'd <b class=\"hl\">end up<\/b> wasting hours on my phone. That said, <b class=\"hl\">it depends on<\/b> the period: during exams my routine is quite rigid, whereas in summer I'm far more flexible. <b class=\"hl\">The more<\/b> structured my day is, <b class=\"hl\">the more<\/b> productive I feel.<\/blockquote><\/div><button class=\"goto\" data-goto=\"cb:sp-topics\">Prepare your 12 topics →<\/button>", "tags": ""}, {"id": "sp-topics", "ch": "sp", "part": "Part 1 · Interview", "title": "Topics to prepare in advance", "sub": "Have a name, a reason, an anecdote and 4–5 C1 words", "html": "<p class=\"lead\">For each topic have ready: (1) a concrete name or example <b class=\"hl\">in English<\/b>, (2) why you like/dislike it, (3) a short anecdote, (4) 4–5 C1 words you can use without hesitating. Practise aloud: 30 s (Part 1) or 2 min (Part 4).<\/p><div class=\"deckref\" data-deck=\"speakingkits\" data-title=\"Speaking topic kits\"><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Write your own answers<\/span><\/div><p>Use <b class=\"hl\">My notes<\/b> at the bottom of this page to write your answer for each topic (your book/film title, your gadget, your shop…). They are saved in this browser.<\/p><\/div>", "tags": ""}, {"id": "sp-part2", "ch": "sp", "part": "Part 2 · Voice message", "title": "The diplomatic toolkit", "sub": "Be polite, explain, propose", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Function<\/th><th>Phrases<\/th><\/tr><\/thead><tbody><tr><td>Disagree politely<\/td><td>I'm not sure I completely agree with… · I wonder if… is entirely correct. · I may well be wrong, but it seems to me that…<\/td><\/tr><tr><td>Show empathy<\/td><td>I see your point, however… · That's an interesting perspective… · I do see what you mean…<\/td><\/tr><tr><td>Propose alternatives<\/td><td>Have you thought about / considered…? · Perhaps there is another way of approaching this… · It might be worth exploring an alternative…<\/td><\/tr><tr><td>Decline an invitation<\/td><td>Thank you for the kind invitation, but I'm afraid [excuse]… · Under normal circumstances I would love to…, sadly [excuse]…<\/td><\/tr><tr><td>Rearrange a meeting<\/td><td>I wonder if we could possibly rearrange…? · Is there any way we can move… to an alternative time?<\/td><\/tr><tr><td>Refuse a request<\/td><td>I'm afraid due to [reason], I won't be able to… · Unfortunately, because of [reason], I'm unavailable for…<\/td><\/tr><tr><td>Apologise & request<\/td><td>I do apologise for any inconvenience. · Would there be any chance of rescheduling? · I'd really appreciate it if you could…<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">Your voicemail, corrected<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ I am afraid due to my grandmother has been hospitalized because an accident<\/div><div class=\"fx-r\">✓ I'm afraid that, <b class=\"hl\">as<\/b> my grandmother has been <b class=\"hl\">taken to hospital after<\/b> an accident, …<\/div><div class=\"fx-why\">due to + noun; because + clause; because <b class=\"hl\">of<\/b> + noun.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Unexceptive issue my relative have been occurred<\/div><div class=\"fx-r\">✓ <b class=\"hl\">An unexpected family emergency has come up<\/b><\/div><div class=\"fx-why\">occur is never passive; 'unexpected'.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ I am concern about call of without much time<\/div><div class=\"fx-r\">✓ I'm <b class=\"hl\">sorry to call it off at such short notice<\/b><\/div><div class=\"fx-why\">concerned; call off; at short notice.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ rearrange next week at the same hour<\/div><div class=\"fx-r\">✓ rearrange <b class=\"hl\">for<\/b> next week at the same <b class=\"hl\">time<\/b><\/div><div class=\"fx-why\">hour ≠ time.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ I look forward for your reply<\/div><div class=\"fx-r\">✓ I look forward <b class=\"hl\">to hearing from you<\/b>.<\/div><\/div><\/div><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Model message (40 s)<\/span><\/div><blockquote class=\"model-text\">Hello Dr Lewis, it's Marina Santos. <b class=\"hl\">I'm afraid<\/b> I won't be able to make our meeting this afternoon: my grandmother has just been taken to hospital and I need to be with my family. <b class=\"hl\">I'm really sorry to cancel at such short notice<\/b>, especially as I know how busy your schedule is. <b class=\"hl\">I wonder if we could possibly rearrange<\/b> for early next week, as the deadline for the final project is approaching and <b class=\"hl\">I'd really appreciate<\/b> your feedback before I submit the draft. Any time on Monday or Tuesday would suit me. <b class=\"hl\">Apologies again for any inconvenience<\/b>, and thank you for understanding.<\/blockquote><\/div>", "tags": ""}, {"id": "sp-part3", "ch": "sp", "part": "Part 3 · Oral summary", "title": "Mediation: synthesise two experts", "sub": "Find the TWO main points they share", "html": "<div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Before the audio<\/div><div class=\"step-b\">Notepad ready. Tell yourself: I need <b class=\"hl\">two main points in common<\/b>.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">While listening (once)<\/div><div class=\"step-b\">Don't write everything. Separate main ideas from details. If <b class=\"hl\">both<\/b> experts mention it, it's a main point.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Preparation (40 s)<\/div><div class=\"step-b\">Circle the 2 main points + 1 supporting detail each. Plan: Opening (5 s) → Point 1 + support (15 s) → Transition → Point 2 + support (15 s) → Closing (5 s).<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Speak (50 s)<\/div><div class=\"step-b\">Always cover both points + at least one detail each. <b class=\"hl\">Paraphrase<\/b>: never repeat the audio's words.<\/div><\/div><\/div><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Section<\/th><th>Phrases<\/th><\/tr><\/thead><tbody><tr><td>Opening<\/td><td>Both experts discussed the topic of… and its effects.<\/td><\/tr><tr><td>Point 1<\/td><td>The first key point made by both experts was that… / They agreed that…<\/td><\/tr><tr><td>Transition<\/td><td>On the other hand… / However, they also emphasised that…<\/td><\/tr><tr><td>Point 2<\/td><td>The second point they made was that…<\/td><\/tr><tr><td>Closing<\/td><td>In summary, both experts conclude that… / Overall, their message was that…<\/td><\/tr><\/tbody><\/table><\/div><h3>Paraphrasing techniques<\/h3><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">1 · Synonyms<\/div><p>give rise to → cause / bring about · tiredness → fatigue / weariness · important → vital / essential<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">2 · Change the word class<\/div><p>view stress as something negative → view stress <b class=\"hl\">negatively<\/b> · increase in number → <b class=\"hl\">an increased number of<\/b><\/p><\/div><div class=\"mini\"><div class=\"mini-t\">3 · Circumlocution<\/div><p>Like Taboo: chronic → 'stress that lasts for a very long time' · symptoms → 'signs that something is wrong physically'. Useful: <b class=\"hl\">It's a kind of… / You could describe it as… / In other words…<\/b><\/p><\/div><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Fatal errors<\/span><\/div><p>Listing everything → only the 2 main points · 'Expert 1 said… Expert 2 said…' → <b class=\"hl\">Both experts agreed that…<\/b> · Repeating the audio's words · Covering only ONE point · Stopping before 50 s.<\/p><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">Your notes on 'ambitious goals', turned into a model<\/span><\/div><blockquote class=\"model-text\">Both experts discussed the link between setting goals and happiness. <b class=\"hl\">The first key point they agreed on<\/b> was that ambitious goals make achievement more satisfying: <b class=\"hl\">the more<\/b> challenging the target, <b class=\"hl\">the greater<\/b> the sense of fulfilment, much like completing a difficult puzzle or training for months to run a race. <b class=\"hl\">However, they also emphasised<\/b> that goals must be realistic: people should accept their own limits and avoid comparing themselves with others. <b class=\"hl\">Overall, their message was that<\/b> ambition is vital for happiness, provided it is grounded in what we can actually achieve.<\/blockquote><\/div>", "tags": ""}, {"id": "sp-part4", "ch": "sp", "part": "Part 4 · Debate", "title": "Structure and systemic thinking", "sub": "2 minutes, one clear position", "html": "<h3>The 4-step macrostructure<\/h3><div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Introduction & framing<\/div><div class=\"step-b\">Define the topic and state your central premise: <b class=\"hl\">I'm going to present a case to support this statement. I am convinced that…<\/b><\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Argument 1<\/div><div class=\"step-b\">Connect ideas: The economy is too complex to separate local from global…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Argument 2<\/div><div class=\"step-b\">Add a secondary supporting layer: Population growth limits domestic sustainability…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Conclusion<\/div><div class=\"step-b\">Restate the premise and tie the arguments back to it: <b class=\"hl\">All things considered, …<\/b><\/div><\/div><\/div><\/div><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Connect factors<\/div><p>…are intrinsically linked to… · …have a knock-on effect on… · …can't be viewed in isolation. · …both form part of a larger, interconnected system.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Handle uncertainty<\/div><p>Given the…, it's highly likely that… · While nobody can say X, what we can be sure of is… · We have a clear precedent for this in…<\/p><\/div><\/div><h3>Rhetorical tools<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Tool<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Cleft sentence<\/td><td>It is not the financial, but the environmental implications we should worry about. · What we need to do is obvious.<\/td><\/tr><tr><td>Rule of three<\/td><td>Countries should ensure food security by minimising imports, supporting local farmers and prioritising seasonal produce.<\/td><\/tr><tr><td>Antithesis<\/td><td>We should not rely on imported goods, but rather embrace home-grown food.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Reusable 2-minute template<\/span><\/div><ol class=\"steps-ol\"><li><b class=\"hl\">Position (5 s):<\/b> I'm going to present a case to support / against this statement. I am convinced that…<\/li><li><b class=\"hl\">Argument 1 + concession (35 s):<\/b> First of all… Some might argue that…, but…<\/li><li><b class=\"hl\">Argument 2 (30 s):<\/b> Not to mention that…<\/li><li><b class=\"hl\">Argument 3 (30 s):<\/b> Another important point in favour of… is…<\/li><li><b class=\"hl\">Close (15 s):<\/b> All things considered, … + three adjectives.<\/li><\/ol><\/div>", "tags": ""}, {"id": "sp-model", "ch": "sp", "part": "Part 4 · Debate", "title": "Model answer, dissected", "sub": "Countries should import less food", "html": "<blockquote class=\"model-text\">Countries should import less food — I'm going to present a case to support this statement. I am convinced that reducing a country's dependency on food imports can have several potential advantages.<br><br>First of all, importing less food means supporting the local economy. <b class=\"hl\">The less<\/b> countries buy from abroad, <b class=\"hl\">the more<\/b> they produce in their own factories and farms. This creates jobs and generates taxes, which feed the economy and increase the country's GDP. <b class=\"hl\">Some might argue that<\/b> not all products can be manufactured locally, <b class=\"hl\">but<\/b> most can probably be replaced by home-made alternatives. <b class=\"hl\">When you come to think of it<\/b>, it might also boost the country's sense of patriotism.<br><br><b class=\"hl\">Not to mention that<\/b> producing food locally enhances a country's <b class=\"hl\">food security<\/b> and makes it less vulnerable in the face of natural disasters, <b class=\"hl\">geopolitical tensions<\/b> or trade restrictions.<br><br>Another important point in favour of importing less food is the positive effect on the environment. Transporting cargo across the globe inevitably produces excessive amounts of CO₂. By producing food locally, we reduce the <b class=\"hl\">carbon footprint<\/b> of food production and transportation.<br><br><b class=\"hl\">All things considered<\/b>, producing food locally rather than importing it stimulates economic growth and leads to a more <b class=\"hl\">sustainable, self-reliant and ethical<\/b> economy.<\/blockquote><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Device<\/th><th>Where<\/th><th>Why it scores<\/th><\/tr><\/thead><tbody><tr><td>Explicit signposting<\/td><td>I'm going to present a case…<\/td><td>The examiner knows your position from second one<\/td><\/tr><tr><td>The… the…<\/td><td>The less countries buy…, the more they produce…<\/td><td>Progressive comparative: hard to improvise<\/td><\/tr><tr><td>Concession + refutation<\/td><td>Some might argue that…, but…<\/td><td>Critical thinking, not a list of advantages<\/td><\/tr><tr><td>Controlled informal marker<\/td><td>When you come to think of it…<\/td><td>Sounds spontaneous, not memorised<\/td><\/tr><tr><td>Less common connector<\/td><td>Not to mention that…<\/td><td>Lexical range with no risk<\/td><\/tr><tr><td>Topic collocations<\/td><td>food security, geopolitical tensions, carbon footprint<\/td><td>Precision, not random 'expensive' words<\/td><\/tr><tr><td>Tricolon close<\/td><td>sustainable, self-reliant and ethical<\/td><td>Three adjectives = strong rhetorical ending<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box mine\"><div class=\"box-h\"><span class=\"box-tag\">Your own mistake<\/span><span class=\"box-t\">Your debate notes, upgraded<\/span><\/div><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ Being more independence about the food a country import<\/div><div class=\"fx-r\">✓ Becoming more <b class=\"hl\">independent<\/b> in terms of the food a country <b class=\"hl\">imports<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ governments should have a paramount reflexion about financial stability<\/div><div class=\"fx-r\">✓ governments should <b class=\"hl\">give serious thought to<\/b> financial stability<\/div><div class=\"fx-why\">'reflexion' isn't used like this.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ the pollution has been emitted by all the transport utilized could decrease<\/div><div class=\"fx-r\">✓ the pollution <b class=\"hl\">emitted<\/b> by <b class=\"hl\">transport<\/b> could <b class=\"hl\">fall significantly<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Employees would became remarkably hardworking<\/div><div class=\"fx-r\">✓ Employees would <b class=\"hl\">become<\/b> remarkably <b class=\"hl\">productive<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ the less stress suffers in employees, the more efficiency in the company<\/div><div class=\"fx-r\">✓ <b class=\"hl\">the less stress employees suffer, the more efficient<\/b> the company <b class=\"hl\">becomes<\/b><\/div><\/div><\/div><\/div><h3>Your vocabulary bank for 'shorter working hours'<\/h3><div class=\"chips\"><span class=\"chip\">a four-day week<\/span><span class=\"chip\">a 32-hour week<\/span><span class=\"chip\">reduced working hours<\/span><span class=\"chip\">less stress → higher productivity<\/span><span class=\"chip\">fewer sick leaves<\/span><span class=\"chip\">a crucial reduction in unnecessary costs<\/span><span class=\"chip\">an increase in overall revenue<\/span><span class=\"chip\">employee retention<\/span><span class=\"chip\">burnout<\/span><span class=\"chip\">intrinsically linked to efficiency<\/span><\/div>", "tags": ""}, {"id": "sp-part5", "ch": "sp", "part": "Part 5 · Follow-up", "title": "Speculating about global issues", "sub": "Move between past, present and future", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Time / type<\/th><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Past speculation<\/td><td>perfect modals<\/td><td>Global warming <b class=\"hl\">might well have been<\/b> less dramatic without industrial meat farming.<\/td><\/tr><tr><td>Past hypothesis<\/td><td>3rd conditional<\/td><td>If we <b class=\"hl\">hadn't needed<\/b> so much land, the destruction <b class=\"hl\">wouldn't have been<\/b> so extensive.<\/td><\/tr><tr><td>Present / future<\/td><td>modals<\/td><td>We <b class=\"hl\">could well see<\/b> a rapid improvement in biodiversity.<\/td><\/tr><tr><td>Present / future<\/td><td>2nd conditional<\/td><td>If we <b class=\"hl\">stopped<\/b> eating meat, we <b class=\"hl\">would see<\/b> huge disruption.<\/td><\/tr><tr><td>Probability<\/td><td>adverbs / adjectives<\/td><td>We <b class=\"hl\">almost certainly<\/b> will need to reduce consumption. · <b class=\"hl\">It is unlikely that<\/b> you could convince enough people.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Disagree diplomatically<\/div><p>I see why people might think that, but… · I have some sympathy for that point of view, but… · I don't know if I completely agree with that.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Express & respond<\/div><p>To me, it seems… · If I had to comment, I would say… · That's an interesting perspective. · I don't think that tells the whole story.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Feelings<\/div><p>Positive: I feel optimistic about… / It's encouraging to see… · Negative: It worries me that… / I feel uneasy about… · Mixed: I've got mixed feelings about… / It's a complex issue.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Compare alternatives<\/div><p>Similarly… / Both options share… · In contrast, X is the more sensible option. · We can divide this into three primary arguments… · The most important thing to consider is…<\/p><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Speculation starters<\/span><\/div><p>This could potentially lead to… · It's hard to say, but I'd imagine that… · In the long run, we may well see… · It is bound to have an impact on…<\/p><\/div>", "tags": ""}, {"id": "sp-interaction", "ch": "sp", "part": "Interaction & fluency", "title": "Phrases for any conversation", "sub": "Agree, disagree, buy time", "html": "<div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Agreeing<\/div><p>I couldn't agree more · You took the words right out of my mouth · That's exactly what I was thinking · I'd go along with that · You've got a point there · I'm with you 100% on this one<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Disagreeing<\/div><p>I do see your point, but I'm not sure… · I agree up to a point, but… · I beg to differ · I take your point, but… · True, yet if we look at this from a different angle… · I'm afraid I don't see it the same way<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Asking for opinions<\/div><p>What's your take on this? · Where do you stand on…? · What do you reckon? · …, wouldn't you agree?<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Expressing opinions<\/div><p>The way I see it… · As far as I'm concerned… · If you ask me… · I'm inclined to believe that… · It goes without saying that… · Speaking for myself…<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Buying time<\/div><p>That's a rather intriguing question — let me think for a second… · There are a couple of ways to look at this… · It really depends on… · That's a tricky question to answer, but…<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Adding & linking<\/div><p>Another point I'd like to add is… · It's also worth bearing in mind that… · Picking up on what you said… · At the end of the day…<\/p><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Pronunciation & fluency<\/span><\/div><p>You are recorded: vary your intonation, link words and never stop dead. Watch the silent letters: <b class=\"hl\">island<\/b> /ˈaɪlənd/, <b class=\"hl\">aisle<\/b> /aɪl/. Practise the 2-minute debate with a stopwatch: it's the hardest part.<\/p><\/div>", "tags": ""}, {"id": "li-overview", "ch": "li", "part": "The test", "title": "Listening at a glance", "sub": "Your strongest module: keep it warm", "html": "<div class=\"box score\"><div class=\"box-h\"><span class=\"box-tag\">Your score<\/span><span class=\"box-t\">Already C1<\/span><\/div><p>Listening 141 → you already have C1 here. This chapter is short on purpose: use it to keep your ear trained and to protect the score.<\/p><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Part<\/th><th>Task<\/th><th>Key skill<\/th><\/tr><\/thead><tbody><tr><td>1 · Multiple choice<\/td><td>5 short recordings, 3 options<\/td><td>General idea vs specific detail; all three options are mentioned<\/td><\/tr><tr><td>2 · Note completion<\/td><td>Informative monologue, 6 gaps (1–3 words)<\/td><td>Predict the word type; exact words heard<\/td><\/tr><tr><td>3 · Matching opinions<\/td><td>Long dialogue: Man / Woman / Both<\/td><td>Who holds which opinion; the 'Both' trap<\/td><\/tr><tr><td>4 · Multiple choice<\/td><td>5 questions<\/td><td>Attitude, feeling, purpose: the implicit, not the literal<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Adaptive and timed<\/span><\/div><p>You hear each recording twice. Answers are reviewed before the system moves on automatically. If you get early items right, the questions become harder (and worth more).<\/p><\/div><button class=\"goto\" data-goto=\"wb:listening\">Practise listening (with read-aloud audio) →<\/button>", "tags": ""}, {"id": "li-distractors", "ch": "li", "part": "Strategy", "title": "Anatomy of distractors", "sub": "Five rules that solve almost every item", "html": "<div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">All three options are mentioned<\/div><div class=\"step-b\">Hearing a word from an option doesn't make it the answer: it makes it a well-placed distractor.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">One option is explicitly ruled out<\/div><div class=\"step-b\">'It's not that I can't handle criticism…', 'but that's not really the point'. Find it: it's a gift.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">The final twist marks the answer<\/div><div class=\"step-b\">Watch <b class=\"hl\">though, that said, all the same, funnily enough, however<\/b>: what follows is usually the key.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Position depends on the question<\/div><div class=\"step-b\"><b class=\"hl\">Purpose<\/b> (Why is he talking…?) → usually the first sentence, often a to-infinitive: 'To inspire your research…'. <b class=\"hl\">Opinion/feeling<\/b> → usually at the end.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">5<\/div><div><div class=\"step-t\">The adverb in the question rules<\/div><div class=\"step-b\"><b class=\"hl\">particularly, mainly, especially<\/b> → choose what is emphasised, not just mentioned. What the speaker takes for granted ('of course', 'I'm sure you're aware') is never the answer.<\/div><\/div><\/div><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Solved example<\/span><\/div><p>An author ignores reviews because… A) they distract her · B) inaccuracies annoy her · C) negative comments discourage her. She says 'Some infuriated me' (sounds like B), 'It's not that I can't handle criticism' (rules out C) and 'wasting far too much time contemplating what had been said, <b class=\"hl\">so<\/b> these days I give reviews a miss'. That <b class=\"hl\">so<\/b> marks the real cause → <b class=\"hl\">A<\/b>.<\/p><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Paraphrase vs repetition<\/span><\/div><p>The correct option <b class=\"hl\">paraphrases<\/b> what is said; wrong options <b class=\"hl\">repeat words<\/b> from the audio. If an option sounds exactly like what you heard, be suspicious.<\/p><\/div>", "tags": ""}, {"id": "li-parts", "ch": "li", "part": "Strategy", "title": "Part by part", "sub": "Note completion and the 'Both' rule", "html": "<div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Part 2 · Note completion<\/div><ul class=\"ex\"><li>Predict the word type for each gap: number, noun, proper name?<\/li><li>When you hear a <b class=\"hl\">list or a negation<\/b>, the answer comes right after.<\/li><li>Write the <b class=\"hl\">exact word heard<\/b>: 'a third', not '33%'; 'weight', not 'weights'.<\/li><li>Speakers often mention the wrong candidate first (the council… → allotment holders).<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Part 3 · Man / Woman / Both<\/div><ul class=\"ex\"><li>Mark <b class=\"hl\">Both<\/b> only when both speakers contribute their own content on the same idea.<\/li><li>A polite 'you're right' or 'exactly' alone is not enough for Both.<\/li><li>The exam measures <b class=\"hl\">who formulates<\/b> the opinion.<\/li><\/ul><\/div><div class=\"mini\"><div class=\"mini-t\">Part 1 & 4 · Multiple choice<\/div><ul class=\"ex\"><li>Read the question and options before the audio.<\/li><li>Ask yourself: why is this person speaking?<\/li><li>Turning praise into criticism is a classic trap ('beautifully shot' is praise).<\/li><li>'Insufficient' is not 'useless': watch exaggerated options.<\/li><\/ul><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Keep your level<\/span><\/div><p>Listen to 10 minutes of a podcast or BBC radio a few times a week and summarise it aloud in 50 seconds: it trains Listening and Speaking Part 3 at the same time.<\/p><\/div>", "tags": ""}, {"id": "re-overview", "ch": "re", "part": "The test", "title": "Reading at a glance", "sub": "4 parts · authentic texts · adaptive", "html": "<div class=\"box score\"><div class=\"box-h\"><span class=\"box-tag\">Your score<\/span><span class=\"box-t\">So close<\/span><\/div><p>Reading <b class=\"hl\">140<\/b>: one point from C1. Small gains in Part 2 (multiple matching) will get you there.<\/p><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Part<\/th><th>Task<\/th><th>Time<\/th><th>Strategy<\/th><\/tr><\/thead><tbody><tr><td>1 · Multiple choice<\/td><td>6 short texts (ads, blogs, emails, notices, extracts), 3 options<\/td><td>~1 min 20 s / text<\/td><td>Identify the purpose quickly: inform, complain, suggest, warn?<\/td><\/tr><tr><td>2 · Multiple matching<\/td><td>Match questions to 3 people's texts<\/td><td>~8 min<\/td><td>Correct answers use synonyms, never the question's words<\/td><\/tr><tr><td>3 · Gapped text<\/td><td>6 sentences into gaps (8 options, 2 extra)<\/td><td>~11 min<\/td><td>Connectors and reference words before/after the gap: this, these, such, however<\/td><\/tr><tr><td>4 · Multiple choice<\/td><td>Long text, 5 questions<\/td><td>~8 min<\/td><td>Inference, author's attitude, implied meaning, words in context<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Golden strategy<\/span><\/div><ul class=\"ex\"><li>Read the question before the text in multiple choice: you know what to look for.<\/li><li>In matching, eliminate impossible options first.<\/li><li>In the gapped text, re-read the paragraph with the sentence inserted to check coherence.<\/li><li>If in doubt, answer anyway: wrong answers aren't penalised, and the adaptive test rewards getting early items right.<\/li><\/ul><\/div><button class=\"goto\" data-goto=\"wb:reading\">Practise reading →<\/button>", "tags": ""}, {"id": "re-part2", "ch": "re", "part": "Strategy", "title": "Your weak point: Part 2", "sub": "Stop anchoring on text A", "html": "<p class=\"lead\">In your class exercises, Part 4 went well (polka, asteroids, exercise: all correct, including author-attitude questions). Where you lose points is <b class=\"hl\">Part 2<\/b>: in the art matching you changed two answers from A to B and from A to C. That's <b class=\"hl\">anchoring on the first text<\/b>: you mark A because it 'more or less' fits before reading B and C.<\/p><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Mandatory protocol for Part 2<\/span><\/div><ol class=\"steps-ol\"><li><b class=\"hl\">Read all three texts first<\/b>, without the questions (3 min). Note two words per person in the margin.<\/li><li>Underline the <b class=\"hl\">concept<\/b> in the question, not the words. 'Who was taken aback…' → look for <b class=\"hl\">surprise<\/b>, not the word 'surprise'.<\/li><li><b class=\"hl\">Don't mark anything until you've checked all three<\/b>, even if A looks obvious.<\/li><li>Justify with a concrete phrase. If you can't point to it, it's a general feeling — exactly what the distractor exploits.<\/li><li>Check the distribution: if you end up with four A's and no C, something is wrong.<\/li><\/ol><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">The pattern<\/span><\/div><p>In the migration matching, not a single word from the six questions appeared in the texts. If you look for matching words, you fail all six.<\/p><\/div>", "tags": ""}, {"id": "re-traps", "ch": "re", "part": "Strategy", "title": "Distractor patterns", "sub": "Learned from your exercises", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Pattern<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Insufficient ≠ useless<\/td><td>Campaigns are 'worth having, but they treat a symptom' → not 'achieved nothing'.<\/td><\/tr><tr><td>'It would be easy/lazy to read this as X'<\/td><td>X is always the distractor.<\/td><\/tr><tr><td>Recycled words<\/td><td>An option repeats 'twentieth century' or 'Thursday' from the text but changes the meaning.<\/td><\/tr><tr><td>Missed negation<\/td><td>'its exclusion is entirely proper' → the writer does NOT want it removed from trials.<\/td><\/tr><tr><td>Reversed roles<\/td><td>The contradiction is the book's argument, not a weakness of the book.<\/td><\/tr><tr><td>An aside is not the purpose<\/td><td>'publishers placed it on the cover' is a side comment, not the reason.<\/td><\/tr><tr><td>Gapped text extras contradict<\/td><td>The two extra sentences usually contradict the paragraph rather than being irrelevant.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Vocabulary to recycle<\/span><\/div><p>deploy an argument · scrutiny · condescending · accrue · fragmentary · straddle · absorb a risk · seductive · surplus · remedies — all essay register.<\/p><button class=\"goto\" data-goto=\"fc:readingwords\">Flashcards: reading words →<\/button><\/div>", "tags": ""}, {"id": "wr-overview", "ch": "wr", "part": "The test", "title": "Writing at a glance", "sub": "Essay + Summary · 50 minutes", "html": "<div class=\"box score\"><div class=\"box-h\"><span class=\"box-tag\">Your score<\/span><span class=\"box-t\">One point from C1<\/span><\/div><p>Writing <b class=\"hl\">140<\/b>. The jump to C1 comes from range (3–4 C1 structures), absolute paraphrase in the summary and fixing your recurring errors (see the Error clinic).<\/p><\/div><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Part 1 · Essay<\/div><p><b class=\"hl\">30 min · 220–280 words.<\/b> A statement/question and three ideas: develop <b class=\"hl\">exactly two<\/b>. Formal register, clear position.<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Part 2 · Summary<\/div><p><b class=\"hl\">20 min · 80–100 words.<\/b> Two short texts on the same topic (e.g. a book extract + a lecture transcript). Write ONE paragraph that synthesises both, in your own words and <b class=\"hl\">without opinion<\/b>.<\/p><\/div><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Master it<\/span><\/div><ul class=\"ex\"><li>Include 3–4 C1 structures: inversion, cleft, impersonal passive, inverted conditional.<\/li><li>One different connector per paragraph; don't repeat 'also'.<\/li><li>Count your words: too few or too many is penalised. Aim for ~250.<\/li><li>Keep 3 minutes to check agreement (-s), articles and prepositions.<\/li><\/ul><\/div>", "tags": ""}, {"id": "wr-essay-structure", "ch": "wr", "part": "Essay", "title": "Essay structure, step by step", "sub": "Intro · 2 body paragraphs · conclusion", "html": "<h3>Introduction: 3 moves<\/h3><div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">General topic (no opinion yet)<\/div><div class=\"step-b\">Choosing a career is one of the most significant decisions young people face today.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Introduce the two points (integrate, don't list)<\/div><div class=\"step-b\">Among the many factors involved, two aspects stand out… / aspects such as [X] and [Y] become particularly relevant.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Thesis statement<\/div><div class=\"step-b\">This essay argues that… / In my view, [X] plays a more decisive role than [Y].<\/div><\/div><\/div><\/div><h3>Body paragraph: 5 steps<\/h3><div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Topic sentence<\/div><div class=\"step-b\">One important factor to consider is… / A key aspect that influences this issue is…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Explain<\/div><div class=\"step-b\">This is mainly because… / This can be explained by the fact that…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Example<\/div><div class=\"step-b\">A clear illustration of this is… / In practice, this often means that…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Extend<\/div><div class=\"step-b\">In addition, this can lead to… / However, this may not always be the case, as…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">5<\/div><div><div class=\"step-t\">Mini-conclusion<\/div><div class=\"step-b\">For these reasons, it becomes clear that… / Ultimately, this demonstrates that…<\/div><\/div><\/div><\/div><h3>Conclusion: 4 steps<\/h3><div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Restate the topic<\/div><div class=\"step-b\">In conclusion, the question of […] requires careful consideration.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Restate your opinion<\/div><div class=\"step-b\">Overall, I believe that… / On balance, it seems to me that…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Summarise reasons (no new ideas)<\/div><div class=\"step-b\">This is not only because…, but also because…<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Final thought<\/div><div class=\"step-b\">Therefore, individuals should… / Looking ahead, it is likely that…<\/div><\/div><\/div><\/div><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Do ✓<\/th><th>Don't ✗<\/th><\/tr><\/thead><tbody><tr><td>Integrate points smoothly (Among the many factors…)<\/td><td>List mechanically (Firstly, secondly…)<\/td><\/tr><tr><td>Use sophisticated connectors<\/td><td>Repeat and / but / so<\/td><\/tr><tr><td>Acknowledge the other side (While it is true that…, I would argue…)<\/td><td>Present only one side<\/td><\/tr><tr><td>Vary opinion phrases (I would contend, From my perspective)<\/td><td>Keep saying 'I think'<\/td><\/tr><tr><td>End with a recommendation or prediction<\/td><td>End abruptly<\/td><\/tr><\/tbody><\/table><\/div>", "tags": ""}, {"id": "wr-phrases-1", "ch": "wr", "part": "Essay", "title": "Phrase bank 1: evidence & openings", "sub": "The 40% you can prepare", "html": "<p class=\"lead\">About <b class=\"hl\">40%<\/b> of an essay can be prefabricated language. Memorise it and keep your energy for ideas. Choose <b class=\"hl\">one favourite phrase per function<\/b> and automate it.<\/p><h3>Referring to studies and evidence<\/h3><ul class=\"ideas\"><li>A study conducted by [a team at Oxford University] confirms that…<\/li><li>Recent research based on [data from over 2,000 households] suggests that…<\/li><li>A growing body of evidence indicates that…<\/li><li>Numerous studies have consistently shown that…<\/li><li>Statistics released by [the Ministry of Education] reveal that…<\/li><li>Empirical data drawn from several European countries <b class=\"hl\">lend<\/b> weight to the claim that… (data = plural)<\/li><li>Experts in the field broadly agree that…<\/li><li>This is borne out by… · A case in point is… · Nowhere is this more apparent than in…<\/li><\/ul><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Inventing sources<\/span><\/div><p>Nobody checks your source in the Oxford Test. Reuse one template: <b class=\"hl\">A study conducted by [credible institution] found that [reasonable figure], which suggests that [your argument].<\/b><\/p><\/div><h3>Questioning the other side's evidence<\/h3><ul class=\"ideas\"><li>Such claims, however, rest on rather shaky foundations.<\/li><li>This argument fails to take into account…<\/li><li>The evidence cited in support of this view is largely anecdotal.<\/li><li>Recent findings have cast doubt on this assumption.<\/li><\/ul><h3>Opening the essay<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Move<\/th><th>Phrases<\/th><\/tr><\/thead><tbody><tr><td>Context<\/td><td>The question of whether […] has sparked considerable debate in recent years. · Few issues divide public opinion as sharply as […]. · In an era characterised by […], the issue of […] has come to the fore. · Hardly a week goes by without another report of […] appearing in the media. · […] is a hotly debated topic that often divides opinion.<\/td><\/tr><tr><td>Tension<\/td><td>While some maintain that […], others contend that […]. · Advocates of […] point to […], whereas its critics warn of […]. · The debate essentially boils down to a trade-off between […] and […].<\/td><\/tr><tr><td>Thesis<\/td><td>This essay will argue that […], focusing in particular on […] and […]. · Having weighed up both sides, I am firmly convinced that […].<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Never copy the prompt<\/span><\/div><p>Rephrase with nominalisation and synonyms. 'Countries should import less food' → <b class=\"hl\">the case for reducing a nation's dependency on food imports<\/b>.<\/p><\/div>", "tags": ""}, {"id": "wr-phrases-2", "ch": "wr", "part": "Essay", "title": "Phrase bank 2: body, concession, cause", "sub": "Build paragraphs that write themselves", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Move<\/th><th>Phrases<\/th><\/tr><\/thead><tbody><tr><td>Topic sentence<\/td><td>The most compelling argument in favour of […] is that… · Perhaps the most pressing issue here is… · A further consideration worth bearing in mind is… · Central to this debate is the question of…<\/td><\/tr><tr><td>Explain<\/td><td>The rationale behind this is straightforward: … · What lies behind this is… · It stands to reason that… (= es lógico que)<\/td><\/tr><tr><td>Support<\/td><td>A clear example of this can be found in… · By way of illustration, … · To illustrate, consider the case of…<\/td><\/tr><tr><td>Consequence<\/td><td>The knock-on effect of this is that… · The upshot is that… · Such a shift would have far-reaching consequences for… · Were this trend to continue, […] would inevitably…<\/td><\/tr><\/tbody><\/table><\/div><h3>Concede, then refute<\/h3><div class=\"cardgrid c2\"><div class=\"mini\"><div class=\"mini-t\">Concede<\/div><p>Granted, there is some truth in the claim that… · Admittedly, …, yet… · It would be naive to deny that… · There is, of course, a legitimate concern that… · Critics would no doubt argue that…<\/p><\/div><div class=\"mini\"><div class=\"mini-t\">Refute<\/div><p>…, however, this objection overlooks the fact that… · Such concerns, while understandable, are ultimately outweighed by… · This argument, though superficially persuasive, does not stand up to scrutiny. · What this line of reasoning fails to account for is…<\/p><\/div><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">The refutation reframes<\/span><\/div><p>A good refutation never denies the concession; it <b class=\"hl\">reframes<\/b> it: hidden cost, quality vs quantity, a counter-example, a trade-off.<\/p><\/div><h3>Cause, effect and condition<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Function<\/th><th>C1 language<\/th><\/tr><\/thead><tbody><tr><td>Cause<\/td><td>stems from · is rooted in · can be attributed to · arises from · is largely a by-product of<\/td><\/tr><tr><td>Effect<\/td><td>gives rise to · brings about · results in · paves the way for · sets in motion · triggers<\/td><\/tr><tr><td>Negative effect<\/td><td>takes its toll on · undermines · erodes · jeopardises · exacerbates · aggravates<\/td><\/tr><tr><td>Positive effect<\/td><td>fosters · bolsters · enhances · lends itself to<\/td><\/tr><tr><td>Condition<\/td><td>provided that · on condition that · as long as · unless · failing that · but for<\/td><\/tr><\/tbody><\/table><\/div>", "tags": ""}, {"id": "wr-phrases-3", "ch": "wr", "part": "Essay", "title": "Phrase bank 3: conclusion & the 14-phrase kit", "sub": "", "html": "<ul class=\"ideas\"><li>In light of the above, … / All things considered, … / Weighing up the arguments on both sides, …<\/li><li>…, the evidence points overwhelmingly towards […].<\/li><li>…, I remain convinced that the benefits far outweigh the drawbacks.<\/li><li>If […] is to be achieved, concerted action will be required on the part of both governments and individuals.<\/li><li>Only by […] can we hope to […]. (inversion)<\/li><li>The challenge, then, is to strike a balance between […] and […].<\/li><li>Whether […] remains to be seen; what is clear is that inaction is no longer an option.<\/li><li>Taking the aforementioned points into consideration, I come to the conclusion that…<\/li><\/ul><div class=\"box key\"><div class=\"box-h\"><span class=\"box-tag\">Key point<\/span><span class=\"box-t\">Minimum kit: 14 phrases<\/span><\/div><ol class=\"steps-ol\"><li>The question of whether […] has sparked considerable debate in recent years. — open<\/li><li>While some maintain that […], others contend that […]. — tension<\/li><li>This essay will argue that […], focusing in particular on […] and […]. — thesis<\/li><li>The most compelling argument in favour of […] is that… — topic sentence<\/li><li>A study conducted by […] confirms that… — evidence<\/li><li>A clear example of this can be found in… — support<\/li><li>Not only does this […], but it also […]. — inversion<\/li><li>Granted, there is some truth in the claim that […], yet… — concession<\/li><li>Such concerns, while understandable, are ultimately outweighed by… — refutation<\/li><li>What critics tend to overlook is… — cleft<\/li><li>Were this trend to continue, […] would inevitably… — inverted conditional<\/li><li>All things considered, the evidence points overwhelmingly towards… — close<\/li><li>Both texts examine […]. The first points out that […], whereas the second highlights […]. — summary<\/li><li>Taken together, the texts suggest that… — close the summary<\/li><\/ol><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">Empty formulas<\/span><\/div><p><s class=\"wrong\">In today's modern world of today, it is a well-known fact that…<\/s> is smoke and the examiner sees it. Every prefabricated phrase must be followed by real content.<\/p><\/div>", "tags": ""}, {"id": "wr-models", "ch": "wr", "part": "Essay", "title": "Model paragraphs", "sub": "See the moves in action", "html": "<div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Introduction<\/span><\/div><blockquote class=\"model-text\">The question of whether governments should invest more heavily in public transport has sparked considerable debate in recent years. While some maintain that the cost is prohibitive, others contend that the environmental returns more than justify the outlay. This essay will argue that such investment is not merely desirable but necessary, focusing in particular on its environmental impact and its long-term economic benefits.<\/blockquote><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Body paragraph (4 moves)<\/span><\/div><blockquote class=\"model-text\"><b class=\"hl\">The most compelling argument<\/b> in favour of producing food locally is that it strengthens national food security. <b class=\"hl\">The rationale behind this is straightforward<\/b>: a country that relies on imports is left exposed to geopolitical tensions and trade restrictions beyond its control. <b class=\"hl\">A clear example of this can be found in<\/b> the disruptions to global supply chains witnessed in recent years, when several nations struggled to secure basic staples. <b class=\"hl\">The upshot is that<\/b> domestic production, however costly in the short term, functions as a form of insurance.<\/blockquote><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Concession → refutation<\/span><\/div><blockquote class=\"model-text\"><b class=\"hl\">Granted, there is some truth in the claim that<\/b> locally produced food is often more expensive. <b class=\"hl\">Such concerns, while understandable, are ultimately outweighed by<\/b> the environmental savings involved. <b class=\"hl\">What this line of reasoning fails to account for is<\/b> the hidden cost of that carbon footprint, which consumers pay indirectly.<\/blockquote><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Conclusion<\/span><\/div><blockquote class=\"model-text\"><b class=\"hl\">All things considered<\/b>, while the financial objections to local production cannot be dismissed out of hand, <b class=\"hl\">the evidence points overwhelmingly towards<\/b> the environmental and strategic benefits of reducing food imports. <b class=\"hl\">The challenge, then, is to strike a balance between<\/b> economic efficiency and long-term resilience. <b class=\"hl\">Only by<\/b> supporting domestic producers <b class=\"hl\">can governments hope to<\/b> build a genuinely sustainable food system.<\/blockquote><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Where to place your C1 structures<\/span><\/div><p>Cleft in the topic sentence (What critics tend to overlook is…) · impersonal passive in the explanation (It is widely assumed that…) · inversion in the support (Not only does this…) · inverted conditional in the consequence (Had this policy been adopted earlier…).<\/p><\/div>", "tags": ""}, {"id": "wr-checklist", "ch": "wr", "part": "Essay", "title": "B2 vs C1 self-check", "sub": "Before you submit", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>B2 (minimum)<\/th><th>C1 (target)<\/th><\/tr><\/thead><tbody><tr><td>Clear thesis (1 sentence)<\/td><td>Nuanced thesis (2 sentences, with hedging)<\/td><\/tr><tr><td>At least 1 concession<\/td><td>The concession is a whole paragraph move, not 1 sentence<\/td><\/tr><tr><td>2 body paragraphs with clear reasons<\/td><td>At least 1 cleft sentence (What is needed is…)<\/td><\/tr><tr><td>Conclusion summarises the points<\/td><td>At least 1 inversion (Not only does X…)<\/td><\/tr><tr><td>Not too many 'I think'<\/td><td>At least 1 reduced relative clause (…introduced in 2020)<\/td><\/tr><tr><td>Formal vocabulary (no good / bad / a lot of)<\/td><td>At least 2 advanced hedges (not just may/might)<\/td><\/tr><tr><td>No contractions<\/td><td>Not pompous or forced; the topic is treated with complexity<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Final 3 minutes<\/span><\/div><p>Look ONLY for: third-person -s · articles · prepositions · repeated connectors.<\/p><\/div>", "tags": ""}, {"id": "wr-summary", "ch": "wr", "part": "Summary", "title": "Summary: step by step", "sub": "Absolute paraphrase, both texts, no opinion", "html": "<div class=\"box rule\"><div class=\"box-h\"><span class=\"box-tag\">Rule<\/span><span class=\"box-t\">The golden rule<\/span><\/div><p><b class=\"hl\">ABSOLUTE PARAPHRASE.<\/b> Copying 4+ words in a row from the texts sinks your mark. Combine both texts, give no opinion, one paragraph, complete sentences, 80–100 words.<\/p><\/div><div class=\"stepgrid\"><div class=\"step\"><div class=\"step-n\">1<\/div><div><div class=\"step-t\">Extract core ideas<\/div><div class=\"step-b\">Highlight only the main ideas. Ignore examples, statistics and repetition. Ask: what is the key message of each paragraph?<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">2<\/div><div><div class=\"step-t\">Identify the relationship<\/div><div class=\"step-b\">Theory + examples? Argument + counter-argument? Problem + solutions? Same topic, different perspectives? Your summary must reflect it.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">3<\/div><div><div class=\"step-t\">Outline (3–5 sentences)<\/div><div class=\"step-b\">1: general topic · 2: key point of text 1 · 3: key point of text 2 and how they connect · 4 (optional): synthesis.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">4<\/div><div><div class=\"step-t\">Paraphrase 100%<\/div><div class=\"step-b\">Synonyms (important → crucial), change structure (active → passive), reorder information.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">5<\/div><div><div class=\"step-t\">Count and cut<\/div><div class=\"step-b\">Write a longer draft, then cut secondary details. Compact connectors save words: while, whereas, although, furthermore.<\/div><\/div><\/div><div class=\"step\"><div class=\"step-n\">6<\/div><div><div class=\"step-t\">Check register & coherence<\/div><div class=\"step-b\">Academic but clear. Logical flow. Information from BOTH texts. One unified paragraph.<\/div><\/div><\/div><\/div><div class=\"box trap\"><div class=\"box-h\"><span class=\"box-tag\">Trap<\/span><span class=\"box-t\">What sinks a summary<\/span><\/div><p>Copying 4+ words · giving your opinion (In my view… is forbidden) · summarising only one text · going over 100 words · adding outside information.<\/p><\/div>", "tags": ""}, {"id": "wr-summary-phrases", "ch": "wr", "part": "Summary", "title": "Summary phrase bank", "sub": "Reporting verbs and comparison only", "html": "<div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Move<\/th><th>Phrases<\/th><\/tr><\/thead><tbody><tr><td>Opening (mention both texts)<\/td><td>Both texts examine the issue of… · Both extracts address…, albeit from different angles. · Although they approach the topic differently, both writers focus on…<\/td><\/tr><tr><td>Text 1<\/td><td>The first text points out that… / draws attention to… / attributes […] to […].<\/td><\/tr><tr><td>Text 2<\/td><td>…, whereas the second highlights… · The second text, by contrast, emphasises… · The second writer takes a rather more sceptical view, arguing that… · The latter shifts the focus towards…<\/td><\/tr><tr><td>Agreement / difference<\/td><td>Both authors converge on the idea that… · A common thread running through both is… · Where the two texts differ is in their treatment of… · Unlike the first, the second text makes no mention of…<\/td><\/tr><tr><td>Close (no opinion)<\/td><td>Taken together, the texts suggest that… · Overall, both accounts point to […] as the decisive factor. · In short, the two texts present […] as […].<\/td><\/tr><\/tbody><\/table><\/div><h3>Paraphrase without going blank: 4 operations<\/h3><div class=\"tbl-wrap\"><table class=\"\"><thead><tr><th>Operation<\/th><th>Original<\/th><th>Paraphrased<\/th><\/tr><\/thead><tbody><tr><td>Synonym<\/td><td>companies reduced their costs<\/td><td>firms cut their expenditure<\/td><\/tr><tr><td>Nominalise<\/td><td>they implemented the law<\/td><td>the implementation of the law<\/td><\/tr><tr><td>Change the voice<\/td><td>experts criticised the plan<\/td><td>the plan came under criticism<\/td><\/tr><tr><td>Change the word class<\/td><td>it is increasingly popular<\/td><td>its popularity continues to grow<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box model\"><div class=\"box-h\"><span class=\"box-tag\">Model<\/span><span class=\"box-t\">Template (≈90 words)<\/span><\/div><blockquote class=\"model-text\">Both texts examine [topic]. The first points out that [idea 1 rephrased], attributing this largely to [cause]. The second, by contrast, emphasises [idea 2 rephrased] and warns that [risk]. Where the two converge is in their recognition that [common point]. Taken together, the texts suggest that [synthesis].<\/blockquote><\/div><button class=\"goto\" data-goto=\"fc:verbs\">Reporting verbs as flashcards →<\/button>", "tags": ""}, {"id": "wr-errors", "ch": "wr", "part": "Your writing", "title": "Error clinic", "sub": "Your own sentences, corrected", "html": "<p class=\"lead\">These come from your essays, summaries and notes. They're the errors most likely to reappear under pressure. Read the correction, then test yourself in the Workbook.<\/p><div class=\"fixes\"><div class=\"fix\"><div class=\"fx-w\">✗ Massive enterprises… in addition, they count with quickly delivering in considerable cities.<\/div><div class=\"fx-r\">✓ Large corporations… <b class=\"hl\">Moreover, they can rely on<\/b> fast delivery to major cities.<\/div><div class=\"fx-why\">'count with' is Spanish (contar con) → rely on / benefit from.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ unnecessarily it means that they disappear<\/div><div class=\"fx-r\">✓ this <b class=\"hl\">does not necessarily<\/b> mean that they <b class=\"hl\">will<\/b> disappear<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ It could be cause by an unstable housing<\/div><div class=\"fx-r\">✓ It could be <b class=\"hl\">caused by<\/b> unstable housing<\/div><div class=\"fx-why\">passive needs the past participle; housing is uncountable.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ violence shown by children will be reflect in their adulthood<\/div><div class=\"fx-r\">✓ violence shown by children <b class=\"hl\">will be reflected<\/b> in their adulthood<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Adolescence decades is crucial the circle of friends<\/div><div class=\"fx-r\">✓ <b class=\"hl\">During adolescence, one's circle of friends is crucial<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ help citizens to get away from this situations<\/div><div class=\"fx-r\">✓ help citizens <b class=\"hl\">escape these<\/b> situations<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Enhancing workplaces… is goal which CEO should be conscious about<\/div><div class=\"fx-r\">✓ Improving the workplace <b class=\"hl\">is a goal that CEOs should be aware of<\/b><\/div><div class=\"fx-why\">articles + plural; conscious → aware.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ boss' preoccupation should be the well-being<\/div><div class=\"fx-r\">✓ <b class=\"hl\">managers' main concern<\/b> should be their employees' well-being<\/div><div class=\"fx-why\">preoccupation is a false friend → concern.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ One crucial factor to consider are breaks<\/div><div class=\"fx-r\">✓ One crucial factor to consider <b class=\"hl\">is<\/b> breaks<\/div><div class=\"fx-why\">subject = factor (singular).<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Lightness in summer is a privilege… the massive temperatures during august<\/div><div class=\"fx-r\">✓ <b class=\"hl\">Natural light<\/b> in summer is a privilege… the <b class=\"hl\">extreme<\/b> temperatures in <b class=\"hl\">August<\/b><\/div><div class=\"fx-why\">months take a capital letter.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ The transition… is a hardly challenge<\/div><div class=\"fx-r\">✓ The transition… is <b class=\"hl\">a considerable<\/b> challenge<\/div><div class=\"fx-why\">hardly = apenas!<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ this material lasts numerous years in disappear<\/div><div class=\"fx-r\">✓ this material <b class=\"hl\">takes many years to disappear<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Not only does educational games facilitate children progression, but it also put them…<\/div><div class=\"fx-r\">✓ Not only <b class=\"hl\">do<\/b> educational games <b class=\"hl\">facilitate children's progress<\/b>, but they also <b class=\"hl\">put<\/b> them…<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ realistic situation they must face with<\/div><div class=\"fx-r\">✓ realistic <b class=\"hl\">situations<\/b> they must face<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ focusing on admirable impact on productivity and the finding working-life balance<\/div><div class=\"fx-r\">✓ focusing on <b class=\"hl\">its positive impact on productivity and on achieving a healthy work-life balance<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ being inside their own tranquillity home<\/div><div class=\"fx-r\">✓ being in <b class=\"hl\">the tranquillity of their own home<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Offering flexible working arrangement significantly enhance…<\/div><div class=\"fx-r\">✓ Offering flexible working <b class=\"hl\">arrangements<\/b> significantly <b class=\"hl\">enhances<\/b>…<\/div><div class=\"fx-why\">gerund subject → singular verb.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ remote working allow citizens feel financially rewarding<\/div><div class=\"fx-r\">✓ remote working <b class=\"hl\">allows<\/b> employees <b class=\"hl\">to feel<\/b> financially <b class=\"hl\">rewarded<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ The smartphone's overuse has been a critical preoccupation<\/div><div class=\"fx-r\">✓ Smartphone overuse has become a <b class=\"hl\">major concern<\/b><\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ This essay confirms that disconnect to the virtual world is beneficial<\/div><div class=\"fx-r\">✓ This essay <b class=\"hl\">will argue<\/b> that <b class=\"hl\">disconnecting from<\/b> the virtual world is beneficial<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ They may be distracted of the real world<\/div><div class=\"fx-r\">✓ They may be distracted <b class=\"hl\">from<\/b> the real world<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ in their firstly years<\/div><div class=\"fx-r\">✓ in their <b class=\"hl\">early<\/b> years<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ The crucial factor they do not be conscious about<\/div><div class=\"fx-r\">✓ <b class=\"hl\">What they fail to realise is<\/b> the irreversible harm…<\/div><div class=\"fx-why\">Turn it into a cleft!<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ All in consider, …<\/div><div class=\"fx-r\">✓ <b class=\"hl\">All things considered<\/b>, …<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ even thought, relatives must take care about their own children<\/div><div class=\"fx-r\">✓ even <b class=\"hl\">though<\/b> parents must <b class=\"hl\">keep an eye on<\/b> their children<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ A major preoccupation among younger people is to achieve a secure a mortgage<\/div><div class=\"fx-r\">✓ A major <b class=\"hl\">concern<\/b> among young people is <b class=\"hl\">securing<\/b> a mortgage<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Working hard is not proportionally to earning money<\/div><div class=\"fx-r\">✓ Hard work is not <b class=\"hl\">proportional to<\/b> earnings<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ From my perspective, I firmly believe that social media is hazardous…<\/div><div class=\"fx-r\">✓ From my perspective, social media is hazardous… (don't double the opinion marker)<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Whereas many individuals may support that it is expensive, it's yielded a high return.<\/div><div class=\"fx-r\">✓ <b class=\"hl\">While many may argue<\/b> that it is expensive, it <b class=\"hl\">has yielded<\/b> a high return.<\/div><div class=\"fx-why\">support ≠ argue/claim.<\/div><\/div><div class=\"fix\"><div class=\"fx-w\">✗ Some experts confirm being eight hours in front of a computer is harmful<\/div><div class=\"fx-r\">✓ <b class=\"hl\">Experts warn that spending<\/b> eight hours in front of a computer is harmful<\/div><\/div><\/div><button class=\"goto\" data-goto=\"wb:writing\">Test yourself on these errors →<\/button>", "tags": ""}, {"id": "wr-register", "ch": "wr", "part": "Your writing", "title": "Register transformations", "sub": "Informal → formal", "html": "<div class=\"deckref\" data-deck=\"register\" data-title=\"Register: informal → formal\"><\/div><div class=\"box tip\"><div class=\"box-h\"><span class=\"box-tag\">Exam tip<\/span><span class=\"box-t\">Typical task<\/span><\/div><p>Rules for a rented flat wri
